opencollection: 1.0.0
info:
  name: Board Game Organizer API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
  environments:
  - name: BGO Local
    variables:
    - name: baseUrl
      value: http://localhost:4000
    - name: actorUserId
      value: user_replace_actor
    - name: targetUserId
      value: user_replace_target
    - name: searchQuery
      value: boardgameorganizer.bgo@gmail.com
    - name: actorToken
      secret: true
      value: ''
    - name: targetToken
      secret: true
      value: ''
    - name: user_1_clerk_token
      value: ''
      secret: true
    - name: user_1_session_id
      value: ''
    - name: user_2_session_id
      value: ''
    - name: user_2_clerk_token
      value: ''
      secret: true
    - name: user2Id
      value: user_replace_2
    - name: user1Id
      value: user_replace_1
    - name: CLERK_SECRET_KEY
      value: ''
      secret: true
    - name: matchId
      value: ''
    - name: matchInvitationId
      value: ''
    - name: gameId
      value: '342942'
items:
- info:
    name: 01 Health
    type: http
    seq: 2
  http:
    method: GET
    url: '{{baseUrl}}/api/health'
    auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
    forwardAuthorizationHeader: false
- info:
    name: 02 Search users
    type: http
    seq: 1
  http:
    method: GET
    url: '{{baseUrl}}/api/users/search?query={{searchQuery}}'
    headers:
    - name: Authorization
      value: Bearer {{user_1_clerk_token}}
    auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
    forwardAuthorizationHeader: false
- info:
    name: Authentication User 2
    type: folder
    seq: 4
  request:
    auth: inherit
  items:
  - info:
      name: Create Session User 2
      type: http
      seq: 1
    http:
      method: POST
      url: https://api.clerk.com/v1/sessions
      headers:
      - name: Content-Type
        value: application/json
      body:
        type: json
        data: "{\n  \"user_id\": \"{{user2Id}}\"\n}"
      auth:
        type: bearer
        token: '{{CLERK_SECRET_KEY}}'
    runtime:
      scripts:
      - type: after-response
        code: 'test(''Sessione creata'', function () { expect(res.getStatus()).to.equal(200); });

          bru.setCollectionVar(''user_2_session_id'', res.getBody().id);

          bru.setEnvVar(''user_2_session_id'', res.getBody().id);'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
