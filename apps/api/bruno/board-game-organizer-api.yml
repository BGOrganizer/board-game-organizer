  - info:
      name: Create planning match with invitation
      type: http
      seq: 1
    http:
      method: POST
      url: '{{baseUrl}}/api/matches'
      headers:
      - name: Authorization
        value: Bearer {{user_1_clerk_token}}
      - name: Content-Type
        value: application/json
      auth: inherit
      body:
        type: json
        data: "{\n  \"name\": \"Friday games\",\n  \"dates\": [\"2026-10-01T20:00:00.000Z\"],\n  \"minPlayers\": 2,\n  \"\
          maxPlayers\": 2,\n  \"invitedUserIds\": [\"{{user2Id}}\"],\n  \"gameIds\": [{{gameId}}]\n}"
    runtime:
      scripts:
      - type: after-response
        code: "test('Status 201', function () { expect(res.getStatus()).to.equal(201); });\nconst body = res.getBody();\n\
          bru.setEnvVar('matchId', body.match.id);\nif (body.match.invitations.length > 0) {\n  bru.setEnvVar('matchInvitationId',\
          \ body.match.invitations[0].id);\n}"
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
