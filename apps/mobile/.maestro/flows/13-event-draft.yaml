appId: com.bgo.mobile
---
# Run after 12-organizations. No provider bypass: pending organizations cannot publish.
- launchApp
- tapOn: "Events"
- assertNotVisible: "New event"
- assertVisible:
    id: "list-filter-future"
- assertVisible:
    id: "list-filter-past"
- tapOn:
    id: "list-filter-future"
- tapOn:
    id: "list-filter-past"
- extendedWaitUntil:
    visible: "No events found"
    timeout: 30000
- tapOn:
    id: "list-filter-future"
- tapOn:
    id: "list-filter-past"
- assertNotVisible: "Clear search"
- tapOn:
    id: "list-search-input"
- inputText: "maestro-no-match-event"
- hideKeyboard
- extendedWaitUntil:
    visible: "No events found"
    timeout: 30000
- tapOn: "Clear search"
- hideKeyboard
- assertNotVisible: "Clear search"
- tapOn: "Community"
- tapOn:
    id: "community-tab-organizations"
- tapOn: "Maestro community club updated"
- tapOn:
    id: "organization-tab-events"
- assertVisible:
    id: "events-scroll"
- tapOn:
    id: "new-organization-event-fab"
- assertVisible: "Event information"
- tapOn: "Event name"
- inputText: "Maestro summer event"
- hideKeyboard
- assertNotVisible: "Time zone"
- tapOn: "Event information: Field help"
- assertVisible: "Choose a name, start and end on the same day.*"
- back
- tapOn:
    id: "event-start-calendar"
- runFlow:
    file: ../helpers/event-date-time.yaml
    env:
      DATE: "06/12/2030"
      HOUR: "14"
      MINUTE: "00"
- tapOn:
    id: "event-end-calendar"
- runFlow:
    file: ../helpers/event-date-time.yaml
    env:
      DATE: "06/12/2030"
      HOUR: "18"
      MINUTE: "00"
- tapOn: "Booking deadline: Field help"
- assertVisible: "Hours before the event starts.*"
- back
- tapOn: "Booking deadline (hours before start)"
- eraseText
- inputText: "24"
- hideKeyboard
- assertVisible:
    id: "event-navigation-bar"
- scrollUntilVisible:
    element:
      text: "Choose a verified address"
    direction: DOWN
    centerElement: true
- tapOn: "Choose a verified address"
- tapOn: "Location name"
- inputText: "Event club"
- tapOn: "Search address"
- inputText: "Via Roma Milano"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "address-result-0"
    timeout: 30000
- tapOn:
    id: "address-result-0"
- tapOn: "Confirm location"
- assertVisible: "New event"
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
    centerElement: true
- tapOn: "Next"
- tapOn: "Add table"
- tapOn: "Table name"
- eraseText
- inputText: "Cascadia event table"
- hideKeyboard
- tapOn: "Choose a game"
- tapOn: "Search board games"
- inputText: "Cascadia"
- hideKeyboard
- extendedWaitUntil:
    visible: "Select: Cascadia"
    timeout: 30000
- tapOn: "Select: Cascadia"
- assertVisible: "Configure table"
- scrollUntilVisible:
    element:
      text: "Save table"
    direction: DOWN
    centerElement: true
- tapOn: "Save table"
- assertVisible: "Cascadia event table"
- tapOn: "Next"
- assertVisible: "Review event"
- tapOn: "Publish event"
- extendedWaitUntil:
    visible: "Could not save event. Publication requires an approved organization and configured deadline service."
    timeout: 30000
- assertVisible: "Maestro summer event.*"
- tapOn: "Save draft"
- extendedWaitUntil:
    visible: "Maestro summer event"
    timeout: 30000
- tapOn: "Cascadia event table"
- assertVisible: "Minimum players.*2"
- assertNotVisible: "Request a place"
- back
- tapOn: "Edit event"
- scrollUntilVisible:
    element:
      text: "Next"
    direction: DOWN
    centerElement: true
- tapOn: "Next"
- tapOn: "Remove table: Cascadia event table"
- tapOn: "Next"
- tapOn: "Save draft"
- assertVisible: "Reset reservations"
- tapOn: "Cancel"
- assertVisible: "Review event"
- tapOn: "Save draft"
# The destructive action and dialog heading share this label.
- tapOn:
    text: "Reset reservations"
    index: 1
- extendedWaitUntil:
    visible: "Maestro summer event"
    timeout: 30000
