appId: com.bgo.boardgameorganizer.dev
name: Table labels, waiting states and usernames
# Owned Development/Preview fixtures; already authenticated in selected EN/IT locale.
# FREE: editable valid future Event with one small Table. FULL: small full PLANNING Table.
# CONFIRMED: included Table with supplied player on first roster page. No saves, resets or mocks.
tags: [manual, tables, profile]
---
- runScript: ../helpers/table-player-ux-inputs.js
- launchApp:
    clearState: false
- openLink: ${output.ux.free}
- runFlow: ../helpers/open-table-participants.yaml
- scrollUntilVisible:
    element: ${output.ux.participantsHelp}
    direction: DOWN
    timeout: 20000
- assertNotVisible: ${output.ux.seatsHelp}
- tapOn: ${output.ux.participantsHelp}
- assertVisible: ${output.ux.acceptedLegend}
- assertVisible: ${output.ux.pendingLegend}
- assertVisible: ${output.ux.waitingLegend}
- assertVisible: ${output.ux.demonstratorLegend}
- assertVisible: ${output.ux.guestLegend}
- scrollUntilVisible:
    element: ${output.ux.seatsText}
    direction: DOWN
    timeout: 20000
- back
- scrollUntilVisible:
    element: ${output.ux.empty}
    direction: DOWN
    timeout: 120000
- assertVisible: ${output.ux.waiting}
- assertNotVisible: ${output.ux.join}
- openLink: ${output.ux.full}
- runFlow: ../helpers/open-table-participants.yaml
- scrollUntilVisible:
    element: ${output.ux.join}
    direction: DOWN
    timeout: 120000
- assertNotVisible: ${output.ux.waitingHelp}
- scrollUntilVisible:
    element: ${output.ux.participantsHelp}
    direction: UP
    timeout: 20000
- tapOn: ${output.ux.participantsHelp}
- scrollUntilVisible:
    element: ${output.ux.waitingText}
    direction: DOWN
    timeout: 20000
- back
- openLink: ${output.ux.fullEvent}
- tapOn: ${output.ux.tablesTab}
- assertNotVisible: ${output.ux.tableList}
- assertNotVisible: ${output.ux.tableLegend}
- openLink: ${output.ux.confirmed}
- runFlow: ../helpers/open-table-participants.yaml
- scrollUntilVisible:
    element: ${output.ux.username}
    direction: DOWN
    timeout: 120000
- assertNotVisible: ${output.ux.email}
- openLink: bgo-dev:///profile
- tapOn: ${output.ux.player}
- assertVisible: ${output.ux.win}
- openLink: ${output.ux.edit}
- tapOn: ${output.ux.next}
- tapOn: ${output.ux.next}
- tapOn:
    id: ${output.ux.tableTrigger}
- assertVisible: ${output.ux.name}
- assertVisible: ${output.ux.nameHelp}
- tapOn: ${output.ux.nameHelp}
- assertVisible: ${output.ux.nameGuide}
- back
- tapOn: ${output.ux.countHelp}
- assertVisible: ${output.ux.countText}
- back
- takeScreenshot: table-player-ux-unsaved-draft
