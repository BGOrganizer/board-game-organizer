appId: com.bgo.mobile
---
# Cold start from a deep link must prioritize its destination, then leave tabs usable.
- killApp
- openLink: bgo:///groups
- extendedWaitUntil:
    visible: "Search groups"
    timeout: 120000
- tapOn: "Matches"
- extendedWaitUntil:
    visible: "No matches yet — create your first one!"
    timeout: 30000
