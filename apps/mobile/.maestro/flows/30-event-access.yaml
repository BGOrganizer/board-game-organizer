appId: com.bgo.boardgameorganizer.dev
name: Owned Event privacy, public enrollment, collection sources and final sharing
# MANUAL current Preview. Explicit mode/fixtures; enrollment persists and finalize is irreversible.
tags: [manual, events, privacy]
---
- runScript: ../helpers/event-access-inputs.js
- launchApp:
    clearState: false
- runFlow:
    when:
      true: ${output.access.mode === 'draft'}
    commands:
      - openLink: ${output.access.groupDraftLink}
      - extendedWaitUntil:
          visible:
            id: group-name-input
          timeout: 120000
      - assertVisible: ${output.access.groupName}
      - takeScreenshot: group-fab-before-keyboard
      - tapOn:
          id: group-name-input
      - inputText: "Unsaved group draft"
      - assertVisible:
          id: group-name-input
          focused: true
      # Compare FAB's physical Y in these screenshots; focus alone is not geometry evidence.
      - takeScreenshot: group-fab-with-keyboard
      - hideKeyboard
      - assertVisible:
          id: save-group-fab
      - takeScreenshot: group-fab-after-keyboard
      - openLink: ${output.access.editLink}
      - extendedWaitUntil:
          visible: ${output.access.next}
          timeout: 120000
      - tapOn: ${output.access.next}
      - extendedWaitUntil:
          visible: ${output.access.minimumTwo}
          timeout: 120000
      - assertVisible: ${output.access.maximumFour}
      - tapOn: ${output.access.originalGameRemove}
      - tapOn: ${output.access.increaseMinimum}
      - tapOn: ${output.access.increaseMaximum}
      - assertVisible: ${output.access.minimumThree}
      - assertVisible: ${output.access.maximumFive}
      - tapOn: ${output.access.chooseGame}
      - runFlow:
          when:
            visible:
              id: list-filter-collection
              selected: true
          commands:
            - tapOn:
                id: list-filter-collection
      - runFlow:
          when:
            visible:
              id: list-filter-participants
              selected: true
          commands:
            - tapOn:
                id: list-filter-participants
      - tapOn:
          id: game-search-input
      - inputText: ${output.access.catalogQuery}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.access.gameSelect}
          timeout: 120000
      - tapOn: ${output.access.gameSelect}
      - assertVisible: ${output.access.gameBounds}
      - assertVisible: ${output.access.minimumThree}
      - assertVisible: ${output.access.maximumFour}
      - assertVisible:
          text: ${output.access.increaseMaximum}
          enabled: false
      - tapOn: ${output.access.decreaseMaximum}
      - assertVisible:
          text: ${output.access.decreaseMaximum}
          enabled: false
      - tapOn: ${output.access.decreaseMinimum}
      - assertVisible:
          text: ${output.access.decreaseMinimum}
          enabled: false
      - tapOn: ${output.access.draftGameRemove}
      - assertVisible:
          text: ${output.access.increaseMaximum}
          enabled: true
      - takeScreenshot: table-draft-bgg-counts
      - back
- runFlow:
    when:
      true: ${output.access.mode === 'presentation'}
    commands:
      - openLink: bgo-dev:///groups
      - extendedWaitUntil:
          visible: ${output.access.groupListTab}
          timeout: 120000
      - tapOn: ${output.access.groupListTab}
      - tapOn:
          id: list-search-input
      - eraseText
      - inputText: ${output.access.groupFilter}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.access.openGroup}
          timeout: 120000
      - takeScreenshot: group-horizontal-card
      - tapOn: ${output.access.openGroup}
      - extendedWaitUntil:
          visible: ${output.access.overview}
          timeout: 120000
      - takeScreenshot: group-background-card
      - tapOn: ${output.access.events}
      - extendedWaitUntil:
          visible:
            id: list-search-input
          timeout: 120000
      - tapOn:
          id: list-search-input
      - eraseText
      - inputText: ${output.access.eventFilter}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.access.openEvent}
          timeout: 120000
      - takeScreenshot: event-horizontal-card
      - tapOn: ${output.access.openEvent}
      - extendedWaitUntil:
          visible: ${output.access.tables}
          timeout: 120000
      - takeScreenshot: event-background-card
      - tapOn: ${output.access.tables}
      - extendedWaitUntil:
          visible: ${output.access.gamesHelp}
          timeout: 120000
      - tapOn: ${output.access.gamesHelp}
      - assertVisible: ${output.access.approvedGame}
      - takeScreenshot: event-table-approved-games
      - back
      - openLink: bgo-dev:///tables
      - extendedWaitUntil:
          visible:
            id: list-search-input
          timeout: 120000
      - tapOn:
          id: list-search-input
      - eraseText
      - inputText: ${output.access.tableFilter}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${output.access.gamesHelp}
          timeout: 120000
      - takeScreenshot: table-horizontal-card
      - tapOn: ${output.access.gamesHelp}
      - assertVisible: ${output.access.approvedGame}
      - back
      - openLink: ${output.access.tableLink}
      - extendedWaitUntil:
          visible:
            id: table-participants-tab
          timeout: 120000
      - assertNotVisible: ${output.access.seats}
      - takeScreenshot: table-background-card
      - runFlow: ../helpers/open-table-participants.yaml
      - assertVisible: ${output.access.seats}
      - takeScreenshot: table-participants-unchanged
      - tapOn:
          id: table-overview-tab
      - assertNotVisible: ${output.access.seats}
- runFlow:
    when:
      true: ${output.access.mode === 'shared'}
    commands:
      - openLink: ${output.access.eventLink}
      - extendedWaitUntil:
          visible: ${output.access.shared}
          timeout: 120000
      - assertNotVisible: ${output.access.participants}
      - openLink: ${output.access.tableLink}
      - extendedWaitUntil:
          visible: ${output.access.results}
          timeout: 120000
      - assertNotVisible: ${output.access.ranking}
      - assertNotVisible: ${output.access.join}
      - tapOn: ${output.access.results}
      - scrollUntilVisible:
          element: ${output.access.player}
          direction: DOWN
          timeout: 120000
      - scrollUntilVisible:
          element: ${output.access.nd}
          direction: DOWN
          timeout: 120000
      - takeScreenshot: event-shared-final-results
- runFlow:
    when:
      true: ${output.access.mode === 'denied'}
    commands:
      - openLink: ${output.access.eventLink}
      - extendedWaitUntil:
          visible: ${output.access.loadEvent}
          timeout: 120000
      - assertNotVisible: ${output.access.finalize}
      - openLink: ${output.access.tableLink}
      - extendedWaitUntil:
          visible: ${output.access.loadTable}
          timeout: 120000
      - assertNotVisible: ${output.access.results}
      - assertNotVisible: ${output.access.join}
      - takeScreenshot: event-results-grant-revoked
- runFlow:
    when:
      true: ${output.access.mode === 'enroll'}
    commands:
      - openLink: ${output.access.tableLink}
      - runFlow: ../helpers/open-table-participants.yaml
      - extendedWaitUntil:
          visible: ${output.access.entry}
          timeout: 120000
      - tapOn: ${output.access.entry}
      - extendedWaitUntil:
          visible: ${output.access.review}
          timeout: 120000
      - tapOn:
          text: ${output.access.join}
          below: ${output.access.review}
      - extendedWaitUntil:
          visible: ${output.access.leave}
          timeout: 120000
      - openLink: ${output.access.groupLink}
      - extendedWaitUntil:
          visible: ${output.access.request}
          timeout: 120000
      - takeScreenshot: event-enrolled-without-group-membership
- runFlow:
    when:
      true: ${output.access.mode === 'picker'}
    commands:
      - openLink: ${output.access.editLink}
      - extendedWaitUntil:
          visible:
            text: ${output.access.next}
            enabled: true
          timeout: 120000
      - tapOn: ${output.access.next}
      - extendedWaitUntil:
          visible: ${output.access.chooseGame}
          timeout: 120000
      - tapOn: ${output.access.chooseGame}
      - assertVisible:
          id: list-filter-collection
          selected: true
      - assertNotVisible:
          id: list-filter-search
      - tapOn:
          id: game-search-input
      - inputText: ${output.access.ownQuery}
      - extendedWaitUntil:
          visible: ${output.access.ownName}
          timeout: 120000
      - eraseText
      - inputText: ${output.access.participantQuery}
      - extendedWaitUntil:
          visible: ${output.access.empty}
          timeout: 120000
      - hideKeyboard
      - tapOn:
          id: list-filter-participants
      - extendedWaitUntil:
          visible: ${output.access.participantName}
          timeout: 120000
      - tapOn:
          id: list-filter-collection
      - tapOn:
          id: game-search-input
      - eraseText
      - inputText: ${output.access.ownQuery}
      - extendedWaitUntil:
          visible: ${output.access.empty}
          timeout: 120000
      - hideKeyboard
      - tapOn:
          id: list-filter-participants
      - tapOn:
          id: game-search-input
      - eraseText
      - inputText: ${output.access.catalogQuery}
      - extendedWaitUntil:
          visible: ${output.access.catalogName}
          timeout: 120000
      - eraseText
      - inputText: ${output.access.emptyQuery}
      - extendedWaitUntil:
          visible: ${output.access.empty}
          timeout: 120000
      - assertVisible:
          id: game-search-input
          focused: true
      - takeScreenshot: event-picker-empty-focused
      - hideKeyboard
      - tapOn: ${output.access.back}
- runFlow:
    when:
      true: ${output.access.mode === 'finalize'}
    commands:
      - openLink: ${output.access.eventLink}
      - extendedWaitUntil:
          visible: ${output.access.finalize}
          timeout: 120000
      - tapOn: ${output.access.finalize}
      - assertVisible:
          id: event-results-share-switch
          checked: false
      - tapOn:
          id: event-results-share-switch
      - assertVisible:
          id: event-results-share-switch
          checked: true
      - tapOn: ${output.access.cancel}
      - tapOn: ${output.access.finalize}
      - assertVisible:
          id: event-results-share-switch
          checked: false
      - tapOn:
          id: event-results-share-switch
      - tapOn:
          text: ${output.access.finalize}
          below: ${output.access.finalizeTitle}
      - extendedWaitUntil:
          notVisible: ${output.access.finalizeTitle}
          timeout: 120000
      - assertNotVisible: ${output.access.finalize}
      - assertVisible: ${output.access.eventName}
      - takeScreenshot: event-final-sharing-committed
