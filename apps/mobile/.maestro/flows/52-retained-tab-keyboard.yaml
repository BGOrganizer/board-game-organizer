appId: com.bgo.boardgameorganizer.dev
name: Search Back restores Group tabs with the keyboard open
tags: [manual, performance, navigation, keyboard]
---
- runScript: ../helpers/cached-tab-navigation-inputs.js
- openLink: bgo-dev:///groups
- tapOn:
    id: top-tab-private
- assertVisible:
    id: list-sort-field
- assertNotVisible:
    id: list-filter-administrator
- tapOn:
    id: list-search-input
- inputText: Perf
- assertVisible:
    id: list-search-input
    text: Perf
- assertVisible:
    id: list-filter-administrator
- assertVisible:
    id: list-sort-field
- assertNotVisible:
    id: top-tab-public
# One tap on the search Back action also dismisses the keyboard.
- tapOn: '^(Back|Indietro)$'
- assertVisible:
    id: top-tab-private
    selected: true
- assertNotVisible:
    id: list-filter-administrator
- assertVisible:
    id: list-sort-field
- tapOn:
    id: top-tab-public
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: top-tab-public
    selected: true
- tapOn:
    id: top-tab-private
- assertVisible:
    id: top-tab-private
    selected: true
- assertNotVisible: Perf
