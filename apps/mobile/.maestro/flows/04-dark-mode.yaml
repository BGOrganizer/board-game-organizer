appId: com.bgo.mobile
---
# 4. Dark mode: run after `adb shell cmd uimode night yes`.
# Verifies the app still renders readable UI (no black-on-black) in dark mode.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- assertVisible: "Sign in / Register"
