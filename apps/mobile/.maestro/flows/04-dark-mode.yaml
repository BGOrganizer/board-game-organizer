appId: com.bgo.mobile
tags: [ci, theme, auth]
---
# Runner sets Android night mode before this flow. Stop/start must retain auth.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      contacts: allow
      notifications: allow
- extendedWaitUntil:
    visible:
      id: "profile-button"
    timeout: 120000
- runFlow: ../helpers/logout.yaml
- assertVisible: "Welcome to Board Game Organizer"
- assertVisible: "Sign in / Register"
- assertNotVisible:
    id: "profile-button"
