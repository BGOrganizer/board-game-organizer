appId: com.bgo.boardgameorganizer.dev
name: Event name bounds, unavailable Public choice and undecorated Group selector
# Owned Development with a fresh local Event draft. No saves, resets, provisioning or API writes.
# FORM_RULES_ACK=owned-development-groups; FORM_RULES_LOCALE=en|it
# FORM_RULES_PUBLIC_GROUP=unique exact approved Public group name managed by the actor.
# FORM_RULES_PUBLIC_EVENT_ID=owned PLANNING event in that group, with valid dates and location.
# FORM_RULES_PUBLIC_TABLE=exact existing table name in that event.
# Leaves an unsaved local draft. Run EN/IT and light/dark with a compatible Preview APK.
tags: [manual, events, forms]
---
- runScript: ../helpers/event-form-rules-inputs.js
- launchApp:
    clearState: false
- openLink: bgo-dev:///event/wizard
- extendedWaitUntil:
    visible:
      id: event-public-radio
    timeout: 120000
- assertVisible:
    id: event-public-radio
    enabled: false
- assertNotVisible: ${output.formRules.unavailable}
- tapOn: ${output.formRules.publicHelp}
- assertVisible: ${output.formRules.publicGuide}
- back
- tapOn: ${output.formRules.name}
- inputText: abcd
- hideKeyboard
- tapOn: ${output.formRules.next}
- assertVisible: ${output.formRules.invalidName}
- tapOn: ${output.formRules.name}
- eraseText: 120
- inputText: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
- copyTextFrom: ${output.formRules.name}
- assertTrue: ${maestro.copiedText.length === 30}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: event-group-select
    direction: DOWN
    timeout: 20000
- tapOn:
    id: event-group-select
- extendedWaitUntil:
    visible:
      id: list-search-input
    timeout: 30000
- tapOn:
    id: list-search-input
- inputText: ${output.formRules.groupQuery}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.formRules.group}
    timeout: 30000
- assertNotVisible: ${output.formRules.admin}
- tapOn: ${output.formRules.group}
- scrollUntilVisible:
    element:
      id: event-public-radio
    direction: UP
    timeout: 20000
- assertVisible:
    id: event-public-radio
    enabled: true
- tapOn:
    id: event-public-radio
- assertVisible:
    id: event-public-radio
    checked: true
- takeScreenshot: event-form-rules-unsaved
# Reuse another owned, valid planning draft for guest-demonstrator acceptance.
- openLink: ${output.formRules.eventLink}
- extendedWaitUntil:
    visible: ${output.formRules.name}
    timeout: 30000
- tapOn: ${output.formRules.next}
- tapOn: ${output.formRules.next}
- scrollUntilVisible:
    element: ${output.formRules.table}
    direction: DOWN
    timeout: 30000
- tapOn: ${output.formRules.table}
- scrollUntilVisible:
    element: ${output.formRules.chooseDemonstrator}
    direction: DOWN
    timeout: 30000
- tapOn: ${output.formRules.chooseDemonstrator}
- assertVisible:
    text: ${output.formRules.addGuest}
    enabled: false
- tapOn: ${output.formRules.guestName}
- inputText: "Guest Guide"
- hideKeyboard
- tapOn: ${output.formRules.addGuest}
- scrollUntilVisible:
    element: ${output.formRules.guestSelected}
    direction: DOWN
    timeout: 30000
- takeScreenshot: event-form-guest-demonstrator
- tapOn: ${output.formRules.removeDemonstrator}
- assertVisible: ${output.formRules.chooseDemonstrator}
- assertNotVisible: ${output.formRules.guestSelected}
