appId: com.bgo.boardgameorganizer.dev
name: Owned OTA consent, session postponement and retry
tags: [manual, ota, startup]
---
# Real standalone build, complete account on a main list, and a verified compatible update.
- assertTrue: ${typeof OTA_BUILD_ACK === 'string' && OTA_BUILD_ACK === 'owned-preview-build'}
- assertTrue: ${typeof OTA_CHANNEL === 'string' && /^development-pr-[1-9][0-9]*$/.test(OTA_CHANNEL)}
- assertTrue: ${typeof OTA_CASE === 'string' && /^(later|update|download-error|no-update)$/.test(OTA_CASE)}
- assertTrue: ${typeof OTA_EXPECTED_TEXT === 'string' && OTA_EXPECTED_TEXT.length > 0}
- assertTrue: ${typeof OTA_ACCOUNT_NAME === 'string' && OTA_ACCOUNT_NAME.length > 0}
- launchApp:
    clearState: false
- runFlow:
    when:
      true: ${OTA_CASE === 'no-update'}
    commands:
      - assertVisible: ${OTA_EXPECTED_TEXT}
      - assertNotVisible:
          id: ota-update-accept
- runFlow:
    when:
      true: ${OTA_CASE !== 'no-update'}
    commands:
      - extendedWaitUntil:
          visible:
            id: ota-update-accept
          timeout: 60000
      - assertVisible:
          id: ota-update-later
- runFlow:
    when:
      true: ${OTA_CASE === 'later'}
    commands:
      - tapOn:
          id: ota-update-later
      - assertNotVisible:
          id: ota-update-accept
      - pressKey: Home
      - launchApp:
          clearState: false
          stopApp: false
      - assertNotVisible:
          id: ota-update-accept
      - killApp
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible:
            id: ota-update-accept
          timeout: 60000
      - tapOn:
          id: ota-update-close
- runFlow:
    when:
      true: ${OTA_CASE === 'download-error'}
    commands:
      - setAirplaneMode: true
      - tapOn:
          id: ota-update-accept
      - extendedWaitUntil:
          visible: 'The update could not be downloaded.*|Impossibile scaricare l’aggiornamento.*'
          timeout: 120000
      - setAirplaneMode: false
- runFlow:
    when:
      true: ${OTA_CASE === 'update' || OTA_CASE === 'download-error'}
    commands:
      - tapOn:
          id: ota-update-accept
      - extendedWaitUntil:
          visible: ${OTA_EXPECTED_TEXT}
          timeout: 120000
      - assertNotVisible:
          id: ota-update-accept
- openLink: bgo-dev:///profile
- extendedWaitUntil:
    visible: ${OTA_ACCOUNT_NAME}
    timeout: 60000
