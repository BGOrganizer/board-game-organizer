appId: com.bgo.mobile
---
# 6. Match wizard: create a match via FAB → step 1 (name + date) → step 2
#    (players) → step 3 (game) → submit. The wizard requires real data on
#    every step; date picker interaction is device-specific, so the flow
#    fills the name, skips the date slot only if the platform allows, and
#    asserts the wizard structure + validation gates instead of the full
#    native date picker round-trip.
- tapOn: "Matches"
- extendedWaitUntil:
    visible: "No matches yet.*"
    timeout: 120000
- tapOn:
    id: ".*"  # FAB (no testID on the Pressable) — fall back to position
    point: "90%,92%"
- extendedWaitUntil:
    visible: "New match"
    timeout: 60000
# Step 1: name validation (short name → still blocked).
- tapOn: "Match name"
- inputText: "abc"
- assertVisible: "At least 5 characters"
- tapOn: "Match name"
- eraseText: 3
- inputText: "Friday night games"
# Date slot: open the native picker and confirm it exists (the wizard
# requires a filled date to advance — tapping Confirm on the native
# date dialog sets today).
- tapOn: "Pick date and time"
- extendedWaitUntil:
    visible: "OK|Done|Confirm|Set"
    timeout: 30000
- tapOn: "OK|Done|Confirm|Set"
# Advance to step 2 via the next FAB (bottom right).
- tapOn:
    point: "90%,92%"
- extendedWaitUntil:
    visible: "Players"
    timeout: 60000
# Step 2: min/max steppers exist; max must stay >= min.
- assertVisible: "Min"
- assertVisible: "Max"
- tapOn: "Max"
- assertVisible: "Invite friends"
# Advance to step 3 (invite slots are optional-empty; validation only
# requires the player range, which defaults valid).
- tapOn:
    point: "90%,92%"
- extendedWaitUntil:
    visible: "Board games"
    timeout: 60000
# Step 3: at least one game is required — empty state blocks the FAB.
- assertVisible: "Select a board game"
- tapOn: "Add another game"
- assertVisible:
    id: "remove-game-slot"
- tapOn:
    id: "remove-game-slot"
- assertNotVisible:
    id: "remove-game-slot"
- assertVisible: "Select a board game"
- tapOn: "Select a board game"
- tapOn: "Search board games (at least 4 characters)"
- inputText: "Cascadia"
- extendedWaitUntil:
    visible: "Select: Cascadia.*"
    timeout: 30000
- assertVisible: "2021"
- tapOn: "Select: Cascadia.*"
- extendedWaitUntil:
    visible: "Board games"
    timeout: 30000
- assertVisible: "Cascadia"

# Submit, open the match and exercise all three HeroUI tabs.
- tapOn:
    point: "90%,92%"
- assertVisible: "Match created"
- extendedWaitUntil:
    visible: "Friday night games"
    timeout: 60000
- tapOn: "Friday night games"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 30000
- assertVisible: "Possible dates"
- tapOn: "Players"
- assertVisible: "Minimum players"
- assertVisible: "Maximum players"
- assertVisible: "Participants"
- assertVisible: "Administrator"
- assertVisible: "Accepted"
- tapOn: "Games"
- assertVisible: "Cascadia"
- assertVisible: "2021"
# Admin editing reuses the same wizard and sends changes only on final save.
- tapOn: "Edit match"
- extendedWaitUntil:
    visible: "Edit match"
    timeout: 30000
- tapOn: "Match name"
- eraseText: 18
- inputText: "Updated game night"
- tapOn: "Next step"
- extendedWaitUntil:
    visible: "Players"
    timeout: 30000
- tapOn: "Next step"
- extendedWaitUntil:
    visible: "Board games"
    timeout: 30000
- tapOn: "Save changes"
- assertVisible: "Match updated"
- extendedWaitUntil:
    visible: "Updated game night"
    timeout: 30000
# Admin deletion is destructive and requires native confirmation.
- tapOn: "Delete match"
- assertVisible: "Delete match?"
- tapOn: "Delete match"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 30000
- assertNotVisible: "Updated game night"
