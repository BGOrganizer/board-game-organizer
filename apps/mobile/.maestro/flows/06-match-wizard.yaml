appId: com.bgo.mobile
tags: [ci, matches]
---
# Primary actor; clean ordinary match list. Game cafe favorite survives deletion.
- openLink: bgo:///matches
- extendedWaitUntil:
    visible: "No matches yet.*"
    timeout: 120000
- tapOn: "Table list"
- assertVisible: "The crown identifies the match administrator."
- assertVisible: "The calendar identifies a table belonging to an event."
- back
- assertNotVisible: "The crown identifies the match administrator."
- runFlow: ../helpers/match-create.yaml
- assertVisible: "Planning"
- assertVisible: "Game cafe"
- assertVisible: ".*[Rr]oma.*"
- assertVisible: "2/4"
- assertVisible: "1 game"
- assertVisible:
    id: "match-waves-image"
- assertVisible:
    id: "admin-match-badge"
- assertVisible: "Search matches"
- assertVisible: "Admin"
- assertVisible: "Invited"
- assertVisible: "Accepted"
- tapOn:
    id: "list-search-input"
- inputText: "Friday"
- assertVisible: "Friday night games"
- tapOn: "Admin"
- extendedWaitUntil:
    visible: "No matches match your filters"
    timeout: 30000
- tapOn: "Admin"
- extendedWaitUntil:
    visible: "Friday night games"
    timeout: 30000
- tapOn: "Clear search"
- assertNotVisible: "Clear search"
- tapOn: "Friday night games"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 30000
- runFlow: ../helpers/match-planning.yaml
- runFlow: ../helpers/match-edit-delete.yaml
- assertNotVisible: "Updated game night"
- assertNotVisible:
    id: "confirmation-dialog"
