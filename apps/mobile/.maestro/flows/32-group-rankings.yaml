appId: com.bgo.boardgameorganizer.dev
name: Owned Group and global rankings, role explanation and sorting
# Manual, signed-in accepted member/creator, verified Development/Preview APK.
# Run once per ADMIN/MODERATOR/MEMBER fixture with real rated Table history.
# The named game must have rated results in both group and global rankings, and
# be searchable on their first source page. The Group player is source-paged.
tags: [manual, groups, rankings]
---
- runScript: ../helpers/group-ranking-inputs.js
- launchApp:
    clearState: false
- openLink: ${output.groupRanking.link}
- extendedWaitUntil:
    visible: ${output.groupRanking.group}
    timeout: 120000
- tapOn: ${output.groupRanking.ranking}
- extendedWaitUntil:
    visible:
      id: rating-game-select-trigger
    timeout: 120000
- assertVisible: ${output.groupRanking.chooseGame}
- tapOn: ${output.groupRanking.help}
- assertVisible: "^OpenSkill .+"
- back
- tapOn:
    id: rating-game-select-trigger
- tapOn: ${output.groupRanking.search}
- inputText: ${output.groupRanking.query}
- extendedWaitUntil:
    visible: ${output.groupRanking.game}
    timeout: 120000
- assertVisible:
    id: rating-game-select-popover
- assertVisible:
    id: rating-game-select-list
- takeScreenshot: group-ranking-search-with-keyboard
- tapOn: ${output.groupRanking.game}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: ranking-sort-metric
    timeout: 120000
- tapOn:
    id: ranking-sort-metric
- tapOn: ${output.groupRanking.gamesWon}
- assertVisible:
    id: ranking-sort-direction
    text: ${output.groupRanking.ascending}
- tapOn:
    id: ranking-sort-direction
- assertVisible:
    id: ranking-sort-direction
    text: ${output.groupRanking.descending}
- scrollUntilVisible:
    element:
      id: ${output.groupRanking.row}
    direction: DOWN
    timeout: 60000
    centerElement: true
- assertVisible:
    text: ${output.groupRanking.username}
    childOf:
      id: ${output.groupRanking.row}
- assertVisible:
    text: ${output.groupRanking.role}
    childOf:
      id: ${output.groupRanking.row}
- tapOn:
    text: ${output.groupRanking.role}
    childOf:
      id: ${output.groupRanking.row}
    # Avatar badge precedes the secondary caption within this exact entity row.
    index: 0
- assertVisible: ${output.groupRanking.roles}
- assertVisible: ${output.groupRanking.role}
- takeScreenshot: group-ranking-current-role-explanation
- back
- scrollUntilVisible:
    element:
      text: ${output.groupRanking.clear}
    direction: UP
    timeout: 60000
- tapOn: ${output.groupRanking.clear}
- assertVisible: ${output.groupRanking.chooseGame}
- assertNotVisible:
    id: ranking-sort-metric
- openLink: bgo-dev:///community
- extendedWaitUntil:
    visible:
      id: community-tab-ranking
    timeout: 120000
- tapOn:
    id: community-tab-ranking
- extendedWaitUntil:
    visible: ${output.groupRanking.chooseGame}
    timeout: 120000
- tapOn:
    id: rating-game-select-trigger
- tapOn: ${output.groupRanking.search}
- inputText: ${output.groupRanking.query}
- extendedWaitUntil:
    visible: ${output.groupRanking.game}
    timeout: 120000
- tapOn: ${output.groupRanking.game}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: ranking-sort-metric
    timeout: 120000
- tapOn:
    id: ranking-sort-metric
- tapOn: ${output.groupRanking.gamesWon}
- tapOn:
    id: ranking-sort-direction
- assertVisible:
    id: ranking-sort-direction
    text: ${output.groupRanking.descending}
- takeScreenshot: community-ranking-sorted
- tapOn: ${output.groupRanking.clear}
- assertVisible: ${output.groupRanking.chooseGame}
- assertNotVisible:
    id: ranking-sort-metric
