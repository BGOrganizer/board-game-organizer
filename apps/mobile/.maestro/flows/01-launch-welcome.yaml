appId: com.bgo.mobile
tags: [ci, auth]
---
# Fixture: signed-out app, primary onboarding unset, owned address book seeded.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      contacts: deny
      notifications: deny
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- assertVisible: "Sign in / Register"
- assertNotVisible:
    id: "profile-button"
