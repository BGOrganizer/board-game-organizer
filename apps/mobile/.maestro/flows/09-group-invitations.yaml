appId: com.bgo.mobile
---
# Two provisioned users: friend request -> group invite -> acceptance -> group match picker.
# Flow 05 removes friendship; create it again here so this flow does not depend on its final state.
- tapOn: "Contacts"
- tapOn: "Search"
- tapOn: ".*[Ss]earch.*users.*"
- inputText: ${EMAIL_2}
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 90000
- tapOn: "Actions"
- tapOn: "Send friend request"
- tapOn:
    id: "confirm-friend-request-btn"
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Contacts"
- tapOn: "Friend requests"
- extendedWaitUntil:
    visible: "E2E Test"
    timeout: 60000
- tapOn:
    id: "respond-friend-request-btn"
- tapOn:
    id: "respond-accept-friend-request-btn"
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Groups"
- tapOn:
    id: "create-group-fab"
- tapOn: "Group name"
- inputText: "Shared Tabletop Club"
- tapOn: "Select a friend"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- tapOn: "Add: E2E Target"
- tapOn: "Remove invite"
- assertVisible: "Select a friend"
- tapOn: "Select a friend"
- tapOn: "Add: E2E Target"
- tapOn:
    id: "save-group-fab"
- extendedWaitUntil:
    visible: "Shared Tabletop Club"
    timeout: 30000
- assertVisible: "Invited"
- tapOn: "Open group: Shared Tabletop Club"
- extendedWaitUntil:
    visible: "Remove from group: E2E Target"
    timeout: 30000
- assertVisible: "Members"
- assertVisible: "Invitations"
- assertVisible: "Pending"
- tapOn: "Remove from group: E2E Target"
- assertVisible: "Remove from group?"
- tapOn: "Remove from group"
- assertVisible: "Person removed from group"
- assertVisible: "No invitations"
- tapOn: "Edit group"
- tapOn: "Select a friend"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- tapOn: "Add: E2E Target"
- tapOn:
    id: "save-group-fab"
- extendedWaitUntil:
    visible: "Delete group"
    timeout: 30000
- back
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn:
    id: "notifications-button"
- extendedWaitUntil:
    visible: "New group invitation"
    timeout: 30000
- back
- tapOn: "Groups"
- extendedWaitUntil:
    visible: "Shared Tabletop Club"
    timeout: 30000
- assertVisible: "Accept: Shared Tabletop Club"
- tapOn: "Open group: Shared Tabletop Club"
- assertVisible: "Members are visible after accepting the invitation"
- assertNotVisible: "Invitations"
- tapOn: "Accept"
- assertVisible: "Members"
- assertNotVisible: "Invitations"
- extendedWaitUntil:
    visible: "2 members"
    timeout: 30000
- extendedWaitUntil:
    visible: "Group admin"
    timeout: 30000
- assertVisible: "E2E Test"
- assertVisible: "E2E Target"
- tapOn: "Leave group"
- assertVisible: "Leave group?"
- tapOn: "Leave group"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
- assertNotVisible: "Could not load group details"
