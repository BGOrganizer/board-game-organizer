appId: com.bgo.mobile
---
# Re-authenticate in the same app process after Clerk sign-out.
# Guards against AuthView/native client state leaking across mounts and returning
# to the provider chooser instead of publishing the new session to Expo Router.
- runFlow:
    file: "../helpers/sign-in.yaml"
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- assertNotVisible: "Sign in / Register"
