appId: com.bgo.mobile
---
# 3. Header profile button opens API-backed profile and logout returns to welcome.
#    Clerk sign-out on a slow emulator can take a while — generous timeout.
- tapOn:
    id: "profile-button"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 120000
- assertVisible: "E2E Test"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 180000
