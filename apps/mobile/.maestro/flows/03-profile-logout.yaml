appId: com.bgo.mobile
tags: [ci, profile, auth]
---
# 05 leaves the primary actor on the tab root. Exercise header navigation, not setup.
- assertVisible: "Contacts"
- tapOn:
    id: "profile-button"
- extendedWaitUntil:
    visible: "E2E Test"
    timeout: 120000
- assertVisible: "E2E Test"
- assertVisible: "Friends"
- assertVisible: "Followers"
- assertVisible: "Following"
- assertVisible: "Matches played"
- assertVisible: "Admin groups"
- assertVisible: "Joined groups"
- scrollUntilVisible:
    element:
      text: "^Logout$"
    direction: DOWN
    timeout: 120000
- assertVisible: "Powered by BoardGameGeek"
- tapOn: "^Logout$"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 180000
- assertVisible: "Sign in / Register"
- assertNotVisible:
    id: "profile-button"
