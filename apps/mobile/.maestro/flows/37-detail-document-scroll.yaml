appId: com.bgo.boardgameorganizer.dev
name: Detail card and tabs scroll with source-paged content
tags: [manual, details, paging]
---
# Owned complete account. Repeat Group/Event/Table, EN/IT and every authorized tab.
# List cases require a row beyond the first page; static tabs use a final detail field.
# No records are created or changed.
- assertTrue: ${typeof DETAIL_SCROLL_ACK === 'string' && DETAIL_SCROLL_ACK === 'owned-preview-build'}
- assertTrue: ${typeof DETAIL_SCROLL_KIND === 'string' && /^(group|event|table)$/.test(DETAIL_SCROLL_KIND)}
- assertTrue: ${typeof DETAIL_SCROLL_ID === 'string' && /^[a-f\d]{8}(?:-[a-f\d]{4}){3}-[a-f\d]{12}$/i.test(DETAIL_SCROLL_ID)}
- assertTrue: ${DETAIL_SCROLL_KIND !== 'table' || typeof DETAIL_SCROLL_EVENT_ID === 'string' && /^[a-f\d]{8}(?:-[a-f\d]{4}){3}-[a-f\d]{12}$/i.test(DETAIL_SCROLL_EVENT_ID)}
- assertTrue: ${typeof DETAIL_SCROLL_TAB === 'string' && DETAIL_SCROLL_TAB.length > 0}
- assertTrue: ${typeof DETAIL_SCROLL_LAST_ROW === 'string' && DETAIL_SCROLL_LAST_ROW.length > 0}
- launchApp:
    clearState: false
- openLink: "${DETAIL_SCROLL_KIND === 'table' ? 'bgo-dev:///event/table?eventId=' + DETAIL_SCROLL_EVENT_ID + '&tableId=' + DETAIL_SCROLL_ID : 'bgo-dev:///' + DETAIL_SCROLL_KIND + '/' + DETAIL_SCROLL_ID}"
- extendedWaitUntil:
    visible:
      id: record-identity-card
    timeout: 60000
- tapOn: ${DETAIL_SCROLL_TAB}
- extendedWaitUntil:
    visible:
      id: record-identity-card
    timeout: 60000
- scrollUntilVisible:
    element: ${DETAIL_SCROLL_LAST_ROW}
    direction: DOWN
- assertVisible: ${DETAIL_SCROLL_LAST_ROW}
- assertNotVisible:
    id: record-identity-card
- scrollUntilVisible:
    element:
      id: record-identity-card
    direction: UP
- assertVisible:
    id: record-identity-card
- assertVisible: ${DETAIL_SCROLL_TAB}
