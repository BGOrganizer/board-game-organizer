appId: com.bgo.mobile
---
# 5. Social flow: suggestions → sent/received requests → reject/accept → friends → block.
# Requires signed-in actor session (run after flow 02-login).
- tapOn: "Contacts"
- extendedWaitUntil:
    visible: "Suggestions"
    timeout: 60000
# Phone-only address-book contact must resolve the registered target.
- tapOn: "Suggestions"
- extendedWaitUntil:
    visible: "Access contacts"
    timeout: 30000
- tapOn: "Yes"
- extendedWaitUntil:
    visible: ".*[Aa]llow.*contacts.*"
    timeout: 30000
- tapOn: "Allow"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 90000
- tapOn: "Search"
- extendedWaitUntil:
    visible: ".*[Ss]earch.*users.*"
    timeout: 30000
- tapOn: ".*[Ss]earch.*users.*"
- inputText: ${EMAIL_2}
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 90000
# Send and confirm a friend request.
- tapOn: "Actions"
- extendedWaitUntil:
    visible: "Send friend request"
    timeout: 30000
- tapOn: "Send friend request"
- extendedWaitUntil:
    visible:
      id: "confirm-friend-request-btn"
    timeout: 30000
# Cancel returns to action rows without closing the sheet.
- tapOn:
    id: "cancel-confirmation-btn"
- assertVisible: "Send friend request"
- tapOn: "Send friend request"
- tapOn:
    id: "confirm-friend-request-btn"
- extendedWaitUntil:
    notVisible:
      id: "confirm-friend-request-btn"
    timeout: 30000
# Actor sees the outgoing request.
- tapOn: "Friend requests"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- assertVisible: "Sent"

# Switch to target and reject the incoming request.
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 60000
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Contacts"
- tapOn: "Friend requests"
- extendedWaitUntil:
    visible: "E2E Test"
    timeout: 60000
- assertVisible: "Received"
- tapOn:
    id: "decline-friend-request-btn"
- extendedWaitUntil:
    notVisible: "E2E Test"
    timeout: 30000

# Switch back to actor and send the rejected request again.
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Contacts"
- tapOn: "Search"
- tapOn: ".*[Ss]earch.*users.*"
- inputText: ${EMAIL_2}
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 90000
- tapOn:
    id: "friend-request-btn"
- extendedWaitUntil:
    notVisible:
      id: "friend-request-btn"
    timeout: 30000

# Switch to target, accept, and verify the Friends tab.
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD_2}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Contacts"
- tapOn: "Friend requests"
- extendedWaitUntil:
    visible: "E2E Test"
    timeout: 60000
- tapOn:
    id: "accept-friend-request-btn"
- tapOn: "Friends"
- extendedWaitUntil:
    visible: "E2E Test"
    timeout: 30000

# Return to actor, verify friendship, then exercise follow/block cleanup.
- tapOn: "Profile"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 120000
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*[Ee]nter [Pp]assword.*"
    timeout: 60000
- tapOn: ".*[Ee]nter [Pp]assword.*"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
- tapOn: "Contacts"
- tapOn: "Friends"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
# One action removes friendship plus the actor's follow and refreshes every list.
- tapOn:
    id: "remove-friend-btn"
- extendedWaitUntil:
    notVisible: "E2E Target"
    timeout: 30000
- tapOn: "Search"
- tapOn: ".*[Ss]earch.*users.*"
- inputText: ${EMAIL_2}
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "follow-btn"
    timeout: 30000
- tapOn:
    id: "follow-btn"
- extendedWaitUntil:
    visible:
      id: "unfollow-btn"
    timeout: 30000
# Block hides the target.
- tapOn: "Actions"
- extendedWaitUntil:
    visible: "Block"
    timeout: 30000
- tapOn: "Block"
- extendedWaitUntil:
    visible:
      id: "confirm-block-btn"
    timeout: 30000
- tapOn:
    id: "confirm-block-btn"
- extendedWaitUntil:
    notVisible: "E2E Target"
    timeout: 30000
- tapOn: "Blocked"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- tapOn: "Actions"
- extendedWaitUntil:
    visible: "Unblock"
    timeout: 30000
- tapOn: "Unblock"
- extendedWaitUntil:
    notVisible: "E2E Target"
    timeout: 30000
