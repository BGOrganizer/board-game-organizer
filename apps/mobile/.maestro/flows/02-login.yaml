appId: com.bgo.mobile
---
# 2. Sign-in with the provisioned E2E test user (username + password via Clerk AuthView)
- tapOn: "Accedi / Registrati"
- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
- tapOn: "Username"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 60000
