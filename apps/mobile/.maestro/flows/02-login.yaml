appId: com.bgo.mobile
---
# 2. Sign-in with the provisioned E2E test user (email + password via Clerk AuthView)
- tapOn: "Accedi / Registrati"
- extendedWaitUntil:
    visible: "Email address"
    timeout: 30000
- tapOn: "Email address"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 60000
