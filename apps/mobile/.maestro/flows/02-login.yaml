appId: com.bgo.mobile
---
# 2. Sign-in with the provisioned E2E test user.
#    Clerk's sign-in is multi-step: identifier → Continue → password → Continue.
- runFlow:
    file: "../helpers/sign-in.yaml"
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible: "Mobile number|Matches"
    timeout: 120000
- runFlow:
    when:
      visible: "Mobile number"
    commands:
      - tapOn:
          id: "country-calling-code-select"
      - tapOn: "Search countries by name or code"
      # Maestro #395: burst input can drop characters during native rerenders.
      # Acknowledge each real keystroke; never accept a shortened search value.
      - inputText: "z"
      - assertVisible: "^z$"
      - inputText: "z"
      - assertVisible: "^zz$"
      - inputText: "z"
      - assertVisible: "^zzz$"
      - inputText: "z"
      - assertVisible: "^zzzz$"
      - assertVisible: "No countries found"
      - tapOn: "Clear search"
      - inputText: "D"
      - assertVisible: "^D$"
      - inputText: "E"
      - assertVisible: "^DE$"
      - tapOn: "Germany"
      - assertVisible: "^Country calling code: Germany \\+49$"
      - tapOn:
          id: "country-calling-code-select"
      - tapOn: "Search countries by name or code"
      - inputText: "I"
      - assertVisible: "^I$"
      - inputText: "T"
      - assertVisible: "^IT$"
      - tapOn: "Italy"
      - assertVisible: "^Country calling code: Italy \\+39$"
      - tapOn:
          id: "mobile-number-input"
      - inputText: "not a formatted phone"
      # Exercise submission with the keyboard open; the form must remain scrollable.
      - scrollUntilVisible:
          element:
            text: "Continue"
          direction: DOWN
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
