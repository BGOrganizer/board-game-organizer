appId: com.bgo.mobile
---
# 2. Sign-in with the provisioned E2E test user.
#    Clerk's sign-in is multi-step: identifier → Continue → password → Continue.
- runFlow:
    file: "../helpers/sign-in.yaml"
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible: "Mobile number|Matches"
    timeout: 120000
- runFlow:
    when:
      visible: "Mobile number"
    commands:
      - tapOn:
          id: "country-calling-code-select"
      - tapOn: "Search countries by name or code"
      - inputText: "zzzz"
      - assertVisible: "No countries found"
      - tapOn: "Clear search"
      - inputText: "DE"
      - tapOn: "Germany"
      - assertVisible: "+49"
      - tapOn:
          id: "country-calling-code-select"
      - tapOn: "Search countries by name or code"
      - inputText: "IT"
      - tapOn: "Italy"
      - assertVisible: "+39"
      - tapOn:
          id: "mobile-number-input"
      - inputText: "not a formatted phone"
      # Exercise submission with the keyboard open; the form must remain scrollable.
      - scrollUntilVisible:
          element:
            text: "Continue"
          direction: DOWN
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
