appId: com.bgo.mobile
---
# 2. Sign-in with the provisioned E2E test user (username + password via Clerk AuthView)
- tapOn: "Accedi / Registrati"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- tapOn: ".*[Ee]mail.*|.*[Uu]sername.*"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Matches"
    timeout: 120000
