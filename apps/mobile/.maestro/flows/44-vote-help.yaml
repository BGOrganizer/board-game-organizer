appId: com.bgo.boardgameorganizer.dev
name: Details voting and Table participation help
# Read-only, authenticated Development. Run for EN/IT and light/dark.
# VOTE_HELP_ACK=owned-development-resources; VOTE_HELP_LOCALE=en|it
# VOTE_HELP_FIXTURES=[{eventId,tableId,eventName,tableName,multiple:false},
#                     {eventId,tableId,eventName,tableName,multiple:true}]
# Fixtures are PRIVATE PLANNING; all three categories must match `multiple`.
# Add {eventId,tableId,eventName,tableName,multiple:false,repoll:true} to also
# cover a changed singleton in each category with an accepted participant.
tags: [manual, events, voting]
---
- runScript: ../helpers/vote-help-inputs.js
- launchApp:
    clearState: false
- repeat:
    times: ${output.voteHelp.cases.length}
    commands:
      - evalScript: ${output.voteHelp.current = output.voteHelp.cases[output.voteHelp.index]}
      - openLink: ${output.voteHelp.current.link}
      - extendedWaitUntil:
          visible: ${output.voteHelp.current.name}
          timeout: 120000
      - runFlow:
          when:
            true: ${output.voteHelp.current.dates && output.voteHelp.current.multiple}
          commands:
            - tapOn: ${output.voteHelp.eventDetailsHelp}
            - scrollUntilVisible:
                element: ${output.voteHelp.combined}
                direction: DOWN
                timeout: 20000
            - assertVisible: ${output.voteHelp.combined}
            - back
      - runFlow:
          when:
            true: ${output.voteHelp.current.table}
          commands:
            - tapOn:
                id: table-participants-tab
            - tapOn: ${output.voteHelp.tableParticipantsHelp}
            - assertVisible: ${output.voteHelp.queueRule}
            - back
            - tapOn:
                id: table-overview-tab
            - assertNotVisible: ${output.voteHelp.current.oldTrigger}
      - scrollUntilVisible:
          element: ${output.voteHelp.current.heading}
          direction: DOWN
          timeout: 20000
      - runFlow:
          when:
            true: ${output.voteHelp.current.multiple}
          commands:
            - scrollUntilVisible:
                element: ${output.voteHelp.current.trigger}
                direction: UP
                timeout: 20000
            - tapOn: ${output.voteHelp.current.trigger}
            - assertVisible: ${output.voteHelp.yes}
            - assertVisible: ${output.voteHelp.needed}
            - assertVisible: ${output.voteHelp.no}
            - assertVisible: ${output.voteHelp.current.participation}
            - assertVisible: ${output.voteHelp.positive}
            - assertNotVisible: ${output.voteHelp.obsolete}
            - takeScreenshot: vote-help-${output.voteHelp.index}
            - back
            - runFlow:
                when:
                  true: ${output.voteHelp.current.table}
                commands:
                  - scrollUntilVisible:
                      element: ${output.voteHelp.current.heading}
                      direction: DOWN
                      timeout: 20000
            - tapOn:
                text: ${output.voteHelp.voteAction}
                below:
                  text: ${output.voteHelp.current.heading}
            - runFlow:
                when:
                  visible: ${output.voteHelp.choose}
                commands:
                  - tapOn: ${output.voteHelp.show}
            - assertVisible: ${output.voteHelp.votes}
            - assertVisible:
                id: top-tab-YES
                selected: true
            - tapOn:
                id: top-tab-IF_NEEDED
            - assertVisible:
                id: top-tab-IF_NEEDED
                selected: true
            - tapOn:
                id: top-tab-NO
            - assertVisible:
                id: top-tab-NO
                selected: true
            - back
      - runFlow:
          when:
            true: ${output.voteHelp.current.repoll}
          commands:
            - scrollUntilVisible:
                element: ${output.voteHelp.current.trigger}
                direction: UP
                timeout: 20000
            - tapOn: ${output.voteHelp.current.trigger}
            - assertVisible: ${output.voteHelp.revote}
            - assertNotVisible: ${output.voteHelp.positive}
            - back
            - scrollUntilVisible:
                element: ${output.voteHelp.current.heading}
                direction: DOWN
                timeout: 20000
            - tapOn:
                text: ${output.voteHelp.revoteAction}
                below:
                  text: ${output.voteHelp.current.heading}
            - assertVisible: ${output.voteHelp.choose}
            - assertVisible:
                text: ${output.voteHelp.no}
                enabled: true
            - back
      - runFlow:
          when:
            true: ${!output.voteHelp.current.multiple && !output.voteHelp.current.repoll && !output.voteHelp.current.table}
          commands:
            - assertNotVisible: ${output.voteHelp.current.trigger}
      - runFlow:
          when:
            true: ${!output.voteHelp.current.multiple && !output.voteHelp.current.repoll && output.voteHelp.current.table}
          commands:
            - scrollUntilVisible:
                element: ${output.voteHelp.current.trigger}
                direction: UP
                timeout: 20000
            - tapOn: ${output.voteHelp.current.trigger}
            - assertNotVisible: ${output.voteHelp.current.participation}
            - back
      - evalScript: ${output.voteHelp.index = output.voteHelp.index + 1}
