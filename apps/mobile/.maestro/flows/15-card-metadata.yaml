appId: com.bgo.mobile
name: Group Event and Table card metadata
# Explicit existing PRIVATE fixture; actor already signed in, same fixture as web manual scenario.
# Two Event dates/venues, two Table games. No setup, consent shortcuts, resets or mocked responses.
tags: [manual, cards]
---
- runScript: ../helpers/card-inputs.js
- launchApp:
    clearState: false
- openLink: bgo:///groups
- extendedWaitUntil:
    visible:
      id: "list-search-input"
    timeout: 120000
- tapOn:
    id: "list-search-input"
- eraseText: 120
- inputText: ${output.cardGroupName}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.cardGroup}
    timeout: 120000
- takeScreenshot: card-group-metadata
- openLink: bgo:///events
- tapOn:
    id: "list-search-input"
- eraseText: 120
- inputText: ${output.cardEventName}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.cardEvent}
    timeout: 120000
- assertVisible: ${output.cardGroupParent}
- assertVisible: ${output.cardEventTableCount}
- assertVisible: ${output.cardEventAccepted}
- takeScreenshot: card-event-horizontal-metadata
- tapOn:
    text: ${output.cardEventState}
    below:
      text: ${output.cardGroupParent}
- assertVisible: ${output.cardDate}
- assertVisible: ${output.cardTime}
- assertVisible: ${output.cardVenue}
- assertVisible: ${output.cardDateCount}
- assertVisible: ${output.cardLocationCount}
- takeScreenshot: card-event-status-metadata
- back
- openLink: bgo:///tables
- tapOn:
    id: "list-search-input"
- eraseText: 120
- inputText: ${output.cardTableName}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.cardTable}
    timeout: 120000
- assertVisible: ${output.cardEventParent}
- assertVisible: ${output.cardGroupParent}
- assertVisible: ${output.cardRatio}
- takeScreenshot: card-table-horizontal-metadata
- tapOn: ${output.cardDatesPopover}
- assertVisible: ${output.cardDate}
- assertVisible: ${output.cardTime}
- takeScreenshot: card-table-dates-popover
- back
- tapOn: ${output.cardLocationsPopover}
- assertVisible: ${output.cardVenue}
- takeScreenshot: card-table-locations-popover
- back
- tapOn: ${output.cardGamesPopover}
- assertVisible: ${output.cardGamesTitle}
- assertNotVisible: ${output.cardNoGames}
- takeScreenshot: card-table-games-popover
- back
- openLink: bgo:///events
- extendedWaitUntil:
    visible: ${output.cardEvent}
    timeout: 120000
- tapOn: ${output.cardEvent}
- tapOn: ${output.cardTables}
- scrollUntilVisible:
    element:
      text: ${output.cardTable}
    direction: DOWN
    timeout: 120000
- assertVisible: ${output.cardTable}
- takeScreenshot: card-table-in-event
# Same Table composition in both feeds. Inspect actual image height, icon frames and large text
# in screenshots; syntax/VM assertions do not establish native geometry or touch acceptance.
- assertVisible: ${output.cardEventParent}
- assertVisible: ${output.cardGroupParent}
- assertVisible: ${output.cardDatesPopover}
- assertVisible: ${output.cardLocationsPopover}
- assertVisible: ${output.cardGamesPopover}
