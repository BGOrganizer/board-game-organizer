appId: com.bgo.boardgameorganizer.dev
name: Encrypted query cache cold restart and same-process account switching
tags: [manual, cache]
onFlowComplete:
  - setAirplaneMode: disabled
---
# Manual, isolated fixture. No resets, provider setup or domain writes.
# Actor A already authenticated; CACHE_TABLE_NAME/GROUP_NAME/EVENT_NAME are unique,
# visible first-page rows (History Tables require finalized played participation). Actor B (EMAIL_2/PASSWORD_2) has empty Tables/Private Groups/Participation Events.
# Both actors use EN. Verify the MMKV-capable Development build and tested bundle first.
- runScript: ../helpers/cache-inputs.js
- setAirplaneMode: disabled
- launchApp:
    clearState: false
- openLink: bgo-dev:///profile
- extendedWaitUntil:
    visible: ${output.cacheOwnerPattern}
    timeout: 120000
- openLink: bgo-dev:///tables
- extendedWaitUntil:
    visible: ${output.cacheTablePattern}
    timeout: 120000
- openLink: bgo-dev:///groups
- extendedWaitUntil:
    visible: ${output.cacheGroupPattern}
    timeout: 120000
- takeScreenshot: cache-groups-reference
- openLink: bgo-dev:///events
- assertVisible: ${output.registeredLabel}
- assertVisible: ${output.availableLabel}
- extendedWaitUntil:
    visible: ${output.cacheEventPattern}
    timeout: 120000
- takeScreenshot: cache-events-tabs
- openLink: bgo-dev:///contacts
- assertVisible: ${output.connectionsLabel}
- tapOn: "Requests"
- tapOn: "Search"
- assertVisible:
    id: contact-search-input
- tapOn: "Connections"
- takeScreenshot: cache-contacts-tabs
# Actual process death + offline native launch: RAM cannot satisfy these rows.
- setAirplaneMode: enabled
- stopApp
- launchApp:
    clearState: false
- openLink: bgo-dev:///tables
- extendedWaitUntil:
    visible: ${output.cacheTablePattern}
    timeout: 15000
- openLink: bgo-dev:///groups
- assertVisible: ${output.cacheGroupPattern}
- openLink: bgo-dev:///events
- assertVisible: ${output.cacheEventPattern}
- setAirplaneMode: disabled
- stopApp
- launchApp:
    clearState: false
- openLink: bgo-dev:///tables
- extendedWaitUntil:
    visible: ${output.cacheTablePattern}
    timeout: 120000
# No process stop/restart below: foreground callbacks must be safe before another account signs in.
- runFlow: ../helpers/logout.yaml
- pressKey: Home
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: "Sign in / Register"
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      AUTH_EMAIL: ${EMAIL_2}
      AUTH_PASSWORD: ${PASSWORD_2}
- openLink: bgo-dev:///profile
- extendedWaitUntil:
    visible: ${output.cacheOtherOwnerPattern}
    timeout: 120000
- openLink: bgo-dev:///tables
- extendedWaitUntil:
    visible: ${output.noTablesLabel}
    timeout: 120000
- assertNotVisible: ${output.cacheTablePattern}
- openLink: bgo-dev:///groups
- extendedWaitUntil:
    visible: "No groups found"
    timeout: 120000
- assertNotVisible: ${output.cacheGroupPattern}
- openLink: bgo-dev:///events
- extendedWaitUntil:
    visible: "No events found"
    timeout: 120000
- assertNotVisible: ${output.cacheEventPattern}

# B -> logout -> A repeats the lifecycle without restarting the native process.
- pressKey: Home
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: "No events found"
- runFlow: ../helpers/logout.yaml
- pressKey: Home
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: "Sign in / Register"
- runFlow:
    file: ../helpers/sign-in.yaml
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- openLink: bgo-dev:///profile
- extendedWaitUntil:
    visible: ${output.cacheOwnerPattern}
    timeout: 120000
- openLink: bgo-dev:///tables
- extendedWaitUntil:
    visible: ${output.cacheTablePattern}
    timeout: 120000
- pressKey: Home
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: ${output.cacheTablePattern}
- takeScreenshot: cache-same-process-account-switch
