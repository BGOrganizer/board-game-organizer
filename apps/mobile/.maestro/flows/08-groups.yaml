appId: com.bgo.mobile
---
# Group flow mirrors match list -> wizard -> detail -> edit and invite-picker navigation.
- tapOn: "Groups and organizations"
- tapOn:
    id: "community-tab-groups"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
- tapOn:
    id: "create-group-fab"
- assertVisible: "New group"
- assertVisible: "Group name"
- assertVisible: "Public group"
# Group wizard uses the same native Stack header as the match wizard.
- back
- assertVisible: "No groups yet"
- tapOn:
    id: "create-group-fab"
- tapOn: "Group name"
- inputText: "abc"
- assertVisible: "At least 5 characters"
- tapOn: "Group name"
- eraseText: 3
- inputText: "Tabletop Friends"
- hideKeyboard
- tapOn:
    id: "group-public-switch"
- assertVisible: "Select a friend"
- tapOn: "Remove invite"
- assertVisible: "Select a friend"
- tapOn: "Select a friend"
- assertVisible: "Search users"
- back
- tapOn:
    id: "save-group-fab"
- extendedWaitUntil:
    visible: "Tabletop Friends"
    timeout: 30000
- assertVisible: "Public"
- assertVisible: "1 member"
- assertVisible: "Group admin"
- assertVisible: "Search groups"
- assertVisible: "Admin"
- assertVisible: "Invited"
- assertVisible: "Accepted"
- tapOn:
    id: "list-search-input"
- inputText: "Tabletop"
- assertVisible: "Tabletop Friends"
- tapOn: "Admin"
- extendedWaitUntil:
    visible: "No groups match your filters"
    timeout: 30000
- tapOn: "Admin"
- extendedWaitUntil:
    visible: "Tabletop Friends"
    timeout: 30000
- tapOn: "Clear search"
- tapOn: "Open group: Tabletop Friends"
- assertVisible: "Settings"
- tapOn: "Leaderboards"
- assertVisible: "No matches played in this group yet"
- assertNotVisible: "Board game"
- tapOn: "Settings"
- assertVisible:
    id: "group-detail-scroll"
- assertVisible: "Members"
- assertVisible: "Invitations"
- scrollUntilVisible:
    element: "No invitations"
    direction: DOWN
    timeout: 30000
- assertVisible: "No invitations"
- assertVisible: "Group admin"
- tapOn: "Edit group"
- assertVisible: "Edit group"
- back
- assertVisible: "Members"
- tapOn: "Edit group"
- assertVisible: "Tabletop Friends"
- tapOn: "Group name"
- eraseText: 16
- inputText: "Weekend Games"
- hideKeyboard
- tapOn:
    id: "group-public-switch"
- tapOn:
    id: "save-group-fab"
- extendedWaitUntil:
    visible:
      id: "group-detail-scroll"
    timeout: 30000
- assertVisible: "Weekend Games"
- assertVisible: "Private"
- back
# Optional group appears on first match-wizard step; leave draft unsaved.
- tapOn: "Matches"
- tapOn:
    id: "create-match-fab"
- extendedWaitUntil:
    visible: "New match"
    timeout: 30000
- assertVisible: "Group (optional)"
- assertVisible: "No group"
- tapOn: "No group"
- tapOn: "Weekend Games"
- assertVisible: "Weekend Games"
- back
- tapOn: "Groups and organizations"
- tapOn:
    id: "community-tab-groups"
- tapOn: "Open group: Weekend Games"
- tapOn: "Delete group"
- assertVisible: "Delete group?"
- tapOn: "Delete group"
- extendedWaitUntil:
    notVisible: "Delete group?"
    timeout: 30000
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
- tapOn:
    id: "community-tab-organizations"
- extendedWaitUntil:
    visible: "No organizations yet"
    timeout: 30000
