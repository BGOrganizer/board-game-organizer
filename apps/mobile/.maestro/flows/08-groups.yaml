appId: com.bgo.mobile
---
# Group creation/edit/archive and planning match group selection on Android.
- tapOn: "Groups"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
- tapOn:
    id: "create-group-fab"
- assertVisible: "Group name"
- assertVisible: "Public group"
- tapOn: "Group name"
- inputText: "abc"
- assertVisible: "At least 5 characters"
- tapOn: "Group name"
- eraseText: 3
- inputText: "Tabletop Friends"
- tapOn: "Public group"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "Tabletop Friends"
    timeout: 30000
- assertVisible: "Public"
- assertVisible: "1 member"
- assertVisible: "Group admin"
- tapOn: "Edit group"
- assertVisible: "Tabletop Friends"
- tapOn: "Group name"
- eraseText: 16
- inputText: "Weekend Games"
- tapOn: "Public group"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Weekend Games"
    timeout: 30000
- assertVisible: "Private"
# The optional group appears on first match-wizard step; leave the draft unsaved.
- tapOn: "Matches"
- tapOn:
    point: "90%,92%"
- extendedWaitUntil:
    visible: "New match"
    timeout: 30000
- assertVisible: "Group (optional)"
- assertVisible: "No group"
- tapOn: "Weekend Games"
- assertVisible: "Weekend Games"
- back
- tapOn: "Groups"
- tapOn: "Delete group"
- assertVisible: "Delete group?"
- tapOn: "Delete group"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
