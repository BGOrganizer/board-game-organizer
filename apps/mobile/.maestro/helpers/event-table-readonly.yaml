appId: com.bgo.boardgameorganizer.dev
---
- tapOn:
    id: "event-tab-tables"
- assertVisible:
    id: "edit-event-fab"
- assertNotVisible: "Edit table: Table #1"
- assertNotVisible: "Remove table: Table #1"
- tapOn: "Open table: Table #1"
- assertVisible: "Table #1"
- assertNotVisible: "Table name"
- assertVisible: "Table schedule"
- assertNotVisible: "Table location help"
- assertVisible: "Board games"
- assertVisible: "Cascadia"
- assertNotVisible: "Open event table"
- tapOn: "Table details help"
- extendedWaitUntil:
    visible: "See the schedule and board games for this table below."
    timeout: 30000
- back
- assertNotVisible: "See the schedule and board games for this table below."
- assertVisible:
    id: "edit-event-table-fab"
- tapOn:
    id: "edit-event-table-fab"
- assertVisible:
    id: "event-table-header-back"
- tapOn:
    id: "event-table-header-back"
- tapOn:
    id: "table-players-tab"
- assertVisible:
    id: "event-table-players"
- assertVisible: "Empty place"
- assertVisible: "Seats list"
- tapOn: "Table participants help"
- extendedWaitUntil:
    visible: "Accepted player"
    timeout: 30000
- assertVisible: "Invitation pending"
- assertVisible: "Player on the waiting list"
- back
- assertNotVisible: "Player on the waiting list"
- assertNotVisible: "Invite organization members"
- assertNotVisible: "Request a place"
- back
- tapOn:
    id: "event-tab-details"
- assertVisible:
    id: "edit-event-fab"
