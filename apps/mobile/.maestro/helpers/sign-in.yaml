appId: com.bgo.mobile
---
# AuthView may show its provider chooser again after logout. Select the email
# method if present, then target the input placeholder, never a method button.
- tapOn: "Sign in / Register"
- extendedWaitUntil:
    visible: ".*[Ee]mail.*|.*[Uu]sername.*"
    timeout: 120000
- runFlow:
    when:
      visible: "^Email address$"
    commands:
      - tapOn: "^Email address$"
- extendedWaitUntil:
    visible: ".*[Ee]nter your [Ee]mail.*|.*[Ee]mail or username.*"
    timeout: 120000
- tapOn: ".*[Ee]nter your [Ee]mail.*|.*[Ee]mail or username.*"
# The floating label focuses a remembered field with the caret in the middle.
# Select the whole old fixture email before deleting, not only its prefix.
- runFlow:
    when:
      visible: "Last used"
    commands:
      - longPressOn: ".*clerk_test@gmail.com$"
      - runFlow:
          when:
            notVisible: "[Ss]elect [Aa]ll"
          commands:
            - runFlow:
                when:
                  visible: "More options"
                commands:
                  - tapOn: "More options"
      # Android may already select the entire email, omitting Select all.
      - runFlow:
          when:
            visible: "[Ss]elect [Aa]ll"
          commands:
            - tapOn: "[Ss]elect [Aa]ll"
      - eraseText: 1
- inputText: ${AUTH_EMAIL}
- assertVisible: ${"^" + AUTH_EMAIL.replace(/[.+]/g, "\\$&") + "$"}
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "^[Ee]nter your [Pp]assword$"
    timeout: 60000
# The heading and account hint also contain "password"; only the input says "your".
- tapOn: "^[Ee]nter your [Pp]assword$"
- eraseText: 100
- inputText: ${AUTH_PASSWORD}
- tapOn: "Continue"
- runFlow: "verify-clerk-device.yaml"
