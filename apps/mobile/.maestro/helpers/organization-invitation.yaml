appId: com.bgo.mobile
---
# Isolated fixture: sign in as the invited recipient, not the organization admin.
# Requires ORGANIZATION_LINK, DECISION (Accept or Reject), EXPECTED_ACTION
# (Leave organization or Request membership). Missing fixtures fail; no skips.
- openLink: ${ORGANIZATION_LINK}
- tapOn:
    id: "organization-tab-members"
- assertVisible: "Organization members are visible only to confirmed members."
- tapOn: "Respond to organization invitation"
- assertVisible: "Accept"
- assertVisible: "Reject"
- assertNotVisible: "Ban from organization"
- tapOn: "Cancel"
- tapOn: "Respond to organization invitation"
- tapOn: ${DECISION}
- tapOn:
    id: "organization-tab-details"
- assertVisible: ${EXPECTED_ACTION}
