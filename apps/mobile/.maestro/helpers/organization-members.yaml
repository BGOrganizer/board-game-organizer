appId: com.bgo.mobile
tags: [isolated-fixture, organizations]
---
# Approved owned ORGANIZATION_LINK; genuinely signed-in creator.
# MEMBER_NAME and REMOVE_MEMBER_NAME: distinct accepted nonfriends.
# REQUEST_NAME, REJECT_NAME, BAN_REQUEST_NAME: distinct pending requesters.
# FRIEND_USERNAME and INVITED_NAME: eligible friend's username and display name.
# Every participant belongs to this isolated fixture; no production mutation.
- assertTrue: ${ORGANIZATION_LINK.startsWith("bgo://") && ORGANIZATION_LINK.includes("/organization/")}
- openLink: ${ORGANIZATION_LINK}
- extendedWaitUntil:
    visible:
      id: "edit-organization-fab"
    timeout: 30000
- tapOn:
    id: "organization-tab-members"
- assertVisible: "Invite friends"
- assertVisible: "Organization admin"
- tapOn: "Respond to membership request: ${REQUEST_NAME}"
- assertVisible: "Ban"
- tapOn:
    id: "confirmation-cancel"
- assertNotVisible:
    id: "confirmation-dialog"
- assertVisible: "Respond to membership request: ${REQUEST_NAME}"
- tapOn: "Respond to membership request: ${REQUEST_NAME}"
- tapOn:
    id: "confirmation-action-0"
- extendedWaitUntil:
    notVisible: "Respond to membership request: ${REQUEST_NAME}"
    timeout: 30000
- tapOn: "Respond to membership request: ${REJECT_NAME}"
- tapOn:
    id: "confirmation-action-1"
- extendedWaitUntil:
    notVisible: ${REJECT_NAME}
    timeout: 30000
- tapOn: "Respond to membership request: ${BAN_REQUEST_NAME}"
- tapOn:
    id: "confirmation-action-2"
- extendedWaitUntil:
    visible: "Revoke exclusion: ${BAN_REQUEST_NAME}"
    timeout: 30000
- tapOn: "Actions: ${MEMBER_NAME}"
- tapOn: "Follow"
- extendedWaitUntil:
    notVisible: "^Follow$"
    timeout: 30000
- tapOn: "Actions: ${MEMBER_NAME}"
- assertVisible: "Unfollow"
- tapOn: "Block user globally"
- assertVisible: "Block contact"
- tapOn:
    id: "confirm-block-btn"
- extendedWaitUntil:
    notVisible:
      id: "confirmation-dialog"
    timeout: 30000
- assertVisible: "Remove member: ${MEMBER_NAME}"
- runFlow:
    file: contact-action.yaml
    env:
      CONTACT_ACTIONS: "Actions: ${MEMBER_NAME}"
      ACTION_LABEL: "^Unblock$"
      CONFIRM_ID: "confirm-unblock-btn"
- tapOn: "Remove member: ${MEMBER_NAME}"
- tapOn:
    id: "confirmation-cancel"
- assertVisible: ${MEMBER_NAME}
- tapOn: "Remove member: ${MEMBER_NAME}"
- tapOn:
    id: "confirmation-action-1"
- scrollUntilVisible:
    element: "Revoke exclusion: ${MEMBER_NAME}"
    direction: DOWN
    timeout: 30000
- tapOn: "Revoke exclusion: ${MEMBER_NAME}"
- extendedWaitUntil:
    notVisible: ${MEMBER_NAME}
    timeout: 30000
- scrollUntilVisible:
    element: "Remove member: ${REMOVE_MEMBER_NAME}"
    direction: UP
    timeout: 30000
- tapOn: "Remove member: ${REMOVE_MEMBER_NAME}"
- tapOn:
    id: "confirmation-action-0"
- extendedWaitUntil:
    notVisible: ${REMOVE_MEMBER_NAME}
    timeout: 30000
- scrollUntilVisible:
    element: "Invite friends"
    direction: UP
    timeout: 30000
- tapOn: "Invite friends"
- tapOn: ${FRIEND_USERNAME}
- extendedWaitUntil:
    visible: "Invited"
    timeout: 30000
- assertVisible: "Invite friends"
- tapOn: "Cancel organization invitation: ${INVITED_NAME}"
- tapOn:
    id: "confirmation-cancel"
- assertVisible: "Invited"
- tapOn: "Cancel organization invitation: ${INVITED_NAME}"
- tapOn:
    id: "confirmation-action-0"
- extendedWaitUntil:
    notVisible: "Invited"
    timeout: 30000
- tapOn:
    id: "organization-tab-events"
- assertVisible:
    id: "events-scroll"
- assertVisible:
    id: "new-organization-event-fab"
- tapOn:
    id: "organization-tab-details"
- assertVisible:
    id: "edit-organization-fab"
