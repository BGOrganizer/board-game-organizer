appId: com.bgo.mobile
---
- assertVisible: "Date selection"
- assertVisible:
    id: "confirm-match-unavailable"
- assertNotVisible:
    id: "open-match-results"
- tapOn:
    id: "confirm-match-unavailable"
- assertVisible: "Cannot confirm match"
- assertVisible: ".*Not enough accepted players.*"
- tapOn: "Date selection"
- tapOn:
    id: "choose-date"
- assertVisible: "^Choose date$"
- tapOn: "^Yes$"
- extendedWaitUntil:
    notVisible: "^Choose date$"
    timeout: 30000
- assertVisible: "Choose date: Yes"
- extendedWaitUntil:
    visible: "Yes: 1, No: 0, If needed: 0, Not chosen: 0"
    timeout: 30000
- tapOn: "Vote count legend"
- assertVisible: "^- Not chosen$"
- back
- assertNotVisible: "^- Not chosen$"
- tapOn: "Players"
- assertVisible:
    id: "match-detail-scroll"
- scrollUntilVisible:
    element: "Participants"
    direction: DOWN
    timeout: 30000
- assertVisible: "Minimum players"
- assertVisible: "Maximum players"
- assertVisible: "Participants"
- assertVisible: "Administrator"
- assertVisible: "Accepted"
- tapOn: "Overview"
- assertVisible: "Game selection"
- assertVisible: "Cascadia"
- assertVisible: "2021"
- assertVisible: ".*7[.]83.*"
- assertVisible: ".*Rank: 42.*"
- tapOn:
    id: "choose-game"
- assertVisible: "^Choose game$"
- tapOn: "^If I have to$"
- extendedWaitUntil:
    notVisible: "^Choose game$"
    timeout: 30000
- assertVisible: "Choose game: If I have to"
- tapOn:
    id: "choose-location"
- assertVisible: "^Choose location$"
- tapOn: "^Yes$"
- extendedWaitUntil:
    notVisible: "^Choose location$"
    timeout: 30000
- assertVisible: "Choose location: Yes"
- tapOn: "Remove location from favorites"
- extendedWaitUntil:
    visible: "Add location to favorites"
    timeout: 30000
- assertVisible: "Choose location: Yes"
- tapOn: "Add location to favorites"
- extendedWaitUntil:
    visible: "Remove location from favorites"
    timeout: 30000
- assertVisible: "Choose location: Yes"
- tapOn: "Leaderboards"
- assertVisible: "Board game"
- tapOn: "Select a board game"
- tapOn: "Cascadia"
- extendedWaitUntil:
    visible: "500.00"
    timeout: 30000
- scrollUntilVisible:
    element: "Games played"
    direction: DOWN
    timeout: 30000
- assertVisible: "Games played"
- assertVisible: "Games won"
- assertVisible: "ND"
- tapOn: "Overview"
- assertVisible: "Date selection"
