appId: com.bgo.mobile
---
# Android system date -> time dialogs, as used by match creation. DATE is MM/DD/YYYY.
# Called only after tapping the single event calendar row. No conditional skips.
- tapOn: "Switch to text input mode|Switch to keyboard input"
- tapOn:
    id: "android:id/edit_text"
- eraseText
- inputText: ${DATE}
- tapOn: "OK"
- tapOn: "Switch to text input mode|Switch to keyboard input"
- tapOn:
    id: "android:id/input_hour"
- eraseText
- inputText: ${HOUR}
- tapOn:
    id: "android:id/input_minute"
- eraseText
- inputText: ${MINUTE}
- tapOn: "OK"
