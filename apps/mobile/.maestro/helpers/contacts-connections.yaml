appId: com.bgo.boardgameorganizer.dev
---
- runFlow:
    file: switch-actor.yaml
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- tapOn:
    id: "notifications-button"
- extendedWaitUntil:
    visible: "Friend request accepted"
    timeout: 30000
- tapOn: "Friend request accepted"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- assertVisible: "Friends"
- assertVisible: "^@[^ ]+$"
# Switching tabs keeps the cached friendship visible when returning.
- tapOn: "Requests"
- assertVisible: "No friend requests"
- tapOn: "Connections"
- assertVisible: "E2E Target"
- assertVisible: "Friends"
# Reopen the persisted account after another client changed the social graph.
- stopApp
- launchApp:
    clearState: false
- openLink: bgo-dev:///contacts?tab=connections
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- assertVisible: "Friends"
- assertVisible: "^@[^ ]+$"
- runFlow:
    file: contact-action.yaml
    env:
      CONTACT_ACTIONS: "^Actions: E2E Target$"
      ACTION_LABEL: "^Remove friend$"
      CONFIRM_ID: "confirm-unfriend-btn"
- extendedWaitUntil:
    notVisible: "Friends"
    timeout: 30000
- assertVisible: "Followers"
- runFlow:
    file: contact-search.yaml
    env:
      CONTACT_EMAIL: ${EMAIL_2}
      CONTACT_ACTIONS: "^No users found$"
- assertNotVisible: "E2E Target"
- tapOn: "Back"
- tapOn: "Connections"
- tapOn: "^Actions: E2E Target$"
- extendedWaitUntil:
    visible: "^Follow$"
    timeout: 30000
- tapOn: "^Follow$"
- extendedWaitUntil:
    notVisible: "^Follow$"
    timeout: 30000
- extendedWaitUntil:
    visible: "Following"
    timeout: 30000
- assertVisible: "E2E Target"
- assertVisible: "^@[^ ]+$"
- tapOn: "^Actions: E2E Target$"
- extendedWaitUntil:
    visible: "^Unfollow$"
    timeout: 30000
- tapOn: "^Unfollow$"
- extendedWaitUntil:
    notVisible: "^Unfollow$"
    timeout: 30000
- runFlow:
    file: contact-action.yaml
    env:
      CONTACT_ACTIONS: "^Actions: E2E Target$"
      ACTION_LABEL: "^Block$"
      CONFIRM_ID: "confirm-block-btn"
- extendedWaitUntil:
    visible: "Blocked"
    timeout: 30000
- tapOn: "Requests"
- assertNotVisible: "E2E Target"
- tapOn: "Connections"
- extendedWaitUntil:
    visible: "E2E Target"
    timeout: 30000
- assertVisible: "Blocked"
- runFlow:
    file: contact-action.yaml
    env:
      CONTACT_ACTIONS: "^Actions: E2E Target$"
      ACTION_LABEL: "^Unblock$"
      CONFIRM_ID: "confirm-unblock-btn"
- assertNotVisible: "Blocked"
- assertVisible: "Followers"
# Remove the remaining follow from the actor who owns it.
- runFlow:
    file: switch-actor.yaml
    env:
      AUTH_EMAIL: ${EMAIL_2}
      AUTH_PASSWORD: ${PASSWORD_2}
- openLink: bgo-dev:///contacts?tab=connections
- tapOn: "^Actions: E2E Test$"
- tapOn: "^Unfollow$"
- extendedWaitUntil:
    notVisible: "E2E Test"
    timeout: 30000
- runFlow:
    file: switch-actor.yaml
    env:
      AUTH_EMAIL: ${EMAIL}
      AUTH_PASSWORD: ${PASSWORD}
- runFlow:
    file: contact-search.yaml
    env:
      CONTACT_EMAIL: ${EMAIL_2}
      CONTACT_ACTIONS: "^Actions: E2E Target$"
- tapOn: "Back"
- tapOn: "Connections"
