appId: com.bgo.boardgameorganizer.dev
---
- runFlow:
    file: check-list-status.yaml
    env:
      SECTION: history
      ROW_LABEL: ${output.status.historyCard}
      OTHER_ROW_LABEL: ${output.status.scheduledCard}
      EMPTY_TEXT: ${output.status.emptyTables}
      FAILURE_TEXT: ${output.status.failedTables}
- scrollUntilVisible:
    element: ${output.status.filter}
    direction: UP
    timeout: 60000
- tapOn: ${output.status.filter}
- eraseText: 120
- inputText: ${output.status.names.history.name}
- hideKeyboard
- extendedWaitUntil:
    visible: ${output.status.historyCard}
    timeout: 120000
- runFlow: check-finished-table-popovers.yaml
- takeScreenshot: history-table-list-card
- tapOn: ${output.status.historyCard}
- extendedWaitUntil:
    visible: ${output.status.tableStatus}
    timeout: 120000
- runFlow: check-finished-table-popovers.yaml
- takeScreenshot: history-table-detail-card
- back
