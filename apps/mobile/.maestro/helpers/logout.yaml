appId: com.bgo.boardgameorganizer.dev
---
# Setup navigation uses a real route. Profile-button navigation is tested in 03.
# Never tap Logout while a previous confirmation or route is still active.
- extendedWaitUntil:
    notVisible:
      id: "confirmation-dialog"
    timeout: 30000
- openLink: bgo-dev:///profile
- extendedWaitUntil:
    visible: "^Activities$|^Sign out of your account$"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "^Sign out of your account$"
    direction: DOWN
    timeout: 60000
- tapOn: "^Sign out of your account$"
- assertVisible:
    id: "confirmation-dialog"
- assertVisible: '^Sign out of your account\?$'
- tapOn:
    id: "confirmation-action-0"
- extendedWaitUntil:
    visible: "Welcome to Board Game Organizer"
    timeout: 180000
- assertVisible: "Sign in / Register"
- assertNotVisible:
    id: "profile-button"
