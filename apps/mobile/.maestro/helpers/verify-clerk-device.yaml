appId: com.bgo.mobile
---
# Provisioning uses development-only +clerk_test emails. Clerk keeps Device Trust
# enabled; its documented test OTP completes the real native verification UI.
- extendedWaitUntil:
    visible: "Check your email|Mobile number|Matches"
    timeout: 120000
- runFlow:
    when:
      visible: "Check your email"
    commands:
      - inputText: "424242"
      - extendedWaitUntil:
          visible: "Mobile number|Matches"
          timeout: 120000
