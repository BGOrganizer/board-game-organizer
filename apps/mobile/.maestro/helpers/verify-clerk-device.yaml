appId: com.bgo.boardgameorganizer.dev
---
- assertTrue: ${typeof AUTH_READY_PATTERN === "undefined" || (typeof AUTH_READY_PATTERN === "string" && AUTH_READY_PATTERN.length > 0)}
- extendedWaitUntil:
    visible: '${"Check your email|Mobile number|" + (typeof AUTH_READY_PATTERN === "undefined" ? "^History$" : AUTH_READY_PATTERN)}'
    timeout: 120000
# Device Trust remains enabled. Only Clerk's Development test OTP is used.
- runFlow:
    when:
      visible: "Check your email"
    commands:
      - inputText: "424242"
      - extendedWaitUntil:
          visible: '${"Mobile number|" + (typeof AUTH_READY_PATTERN === "undefined" ? "^History$" : AUTH_READY_PATTERN)}'
          timeout: 120000
- assertNotVisible: "Check your email"
