appId: com.bgo.mobile
---
- extendedWaitUntil:
    visible: "Check your email|Mobile number|Matches"
    timeout: 120000
# Device Trust remains enabled. Only Clerk's Development test OTP is used.
- runFlow:
    when:
      visible: "Check your email"
    commands:
      - inputText: "424242"
      - extendedWaitUntil:
          visible: "Mobile number|Matches"
          timeout: 120000
- assertNotVisible: "Check your email"
