name: Vercel Deploy
description: Deploys an app to Vercel (preview or production) using the prebuilt output.

inputs:
  app-name:
    description: Human-readable app name for comments
    required: true
  app-path:
    description: App root inside the monorepo (Vercel rootDirectory)
    required: true
  vercel-environment:
    description: Vercel environment to pull (preview or production)
    required: true
  production:
    description: Build/deploy with --prod (true/false as string)
    required: true
  status-context:
    description: Commit status context for production deploys
    required: false
    default: vercel/production
  vercel-token:
    description: Vercel token (secret)
    required: true
  vercel-org-id:
    description: Vercel org ID (secret)
    required: true
  vercel-project-id:
    description: Vercel project ID (secret)
    required: true

outputs:
  deployment-url:
    description: Deployment URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🧰 Setup workspace
      uses: ./.github/actions/setup-pnpm
      with:
        install: 'false'

    - name: 📦 Install Vercel CLI
      shell: bash
      run: npm i -g vercel@latest

    - name: 🔗 Stage Vercel project link
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_APP_PATH: ${{ inputs.app-path }}
      run: |
        node <<'NODE'
        const fs = require('fs');
        const path = '.vercel/project.json';
        fs.mkdirSync('.vercel', { recursive: true });
        const current = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
        const next = {
          ...current,
          orgId: process.env.VERCEL_ORG_ID,
          projectId: process.env.VERCEL_PROJECT_ID,
          settings: {
            ...(current.settings || {}),
            rootDirectory: process.env.VERCEL_APP_PATH,
          },
        };
        fs.writeFileSync(path, JSON.stringify(next, null, 2));
        console.log(`Vercel rootDirectory=${next.settings.rootDirectory}`);
        NODE

    - name: 🔗 Pull Vercel environment
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ENVIRONMENT: ${{ inputs.vercel-environment }}
      run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"

    - name: 🩹 Force Vercel monorepo root
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_APP_PATH: ${{ inputs.app-path }}
      run: |
        node <<'NODE'
        const fs = require('fs');
        const path = '.vercel/project.json';
        const current = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
        const next = {
          ...current,
          orgId: process.env.VERCEL_ORG_ID,
          projectId: process.env.VERCEL_PROJECT_ID,
          settings: {
            ...(current.settings || {}),
            rootDirectory: process.env.VERCEL_APP_PATH,
          },
        };
        fs.writeFileSync(path, JSON.stringify(next, null, 2));
        console.log(`Vercel rootDirectory=${next.settings.rootDirectory}`);
        NODE

    - name: 🔨 Build
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        prod_flag=''
        if [ '${{ inputs.production }}' = 'true' ]; then
          prod_flag='--prod'
        fi
        vercel build $prod_flag --token="$VERCEL_TOKEN"

    - name: 🚀 Deploy
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        prod_flag=''
        if [ '${{ inputs.production }}' = 'true' ]; then
          prod_flag='--prod'
        fi
        url=$(vercel deploy --prebuilt $prod_flag --token="$VERCEL_TOKEN")
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: 📝 Comment Preview URL
      if: ${{ inputs.production == 'false' }}
      uses: actions/github-script@v7
      env:
        APP_NAME: ${{ inputs.app-name }}
      with:
        script: |
          const url = '${{ steps.deploy.outputs.url }}';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **${process.env.APP_NAME} Preview Deployed**\n\n🔗 **Preview URL:** ${url}\n\n_Triggered by PR #${context.issue.number}_`
          });

    - name: 📝 Post Production URL
      if: ${{ inputs.production == 'true' }}
      uses: actions/github-script@v7
      env:
        APP_NAME: ${{ inputs.app-name }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
      with:
        script: |
          const url = '${{ steps.deploy.outputs.url }}';
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            target_url: url,
            description: 'Deployed to production',
            context: process.env.STATUS_CONTEXT
          });
