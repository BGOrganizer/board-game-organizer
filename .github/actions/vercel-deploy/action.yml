name: Vercel Deploy
description: Builds and deploys source on Vercel, preserving Infisical-synced Secrets.

inputs:
  app-name:
    description: Human-readable app name for comments
    required: true
  app-path:
    description: App root inside the monorepo (Vercel rootDirectory)
    required: true
  vercel-environment:
    description: Vercel deployment environment (preview or production)
    required: true
  production:
    description: Build/deploy with --prod (true/false as string)
    required: true
  status-context:
    description: Commit status context for production deploys
    required: false
    default: vercel/production
  vercel-token:
    description: Vercel token (secret)
    required: true
  vercel-org-id:
    description: Vercel org ID (secret)
    required: true
  vercel-project-id:
    description: Vercel project ID (secret)
    required: true
  extra-env:
    description: >-
      Optional multi-line KEY=value overrides scoped to this deployment's build
      and runtime (e.g. NEXT_PUBLIC_API_URL); never updates project variables.
    required: false
    default: ''
  ci-db-name:
    description: Ephemeral E2E database; validates base webhook routing before build override, and overrides runtime.
    required: false
    default: ''

outputs:
  deployment-url:
    description: Deployment URL
    value: ${{ steps.deploy.outputs.url }}
  ci-db-name:
    description: Isolated database tied to this deployment, including on partial reruns
    value: ${{ inputs.ci-db-name }}

runs:
  using: composite
  steps:
    - name: 🧰 Setup workspace
      uses: ./.github/actions/setup-pnpm
      with:
        install: 'false'

    - name: 📦 Install Vercel CLI
      shell: bash
      run: npm i -g vercel@latest

    - name: 🔗 Stage Vercel project link
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_APP_PATH: ${{ inputs.app-path }}
      run: |
        node <<'NODE'
        const fs = require('fs');
        const path = '.vercel/project.json';
        fs.mkdirSync('.vercel', { recursive: true });
        const current = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
        const next = {
          ...current,
          orgId: process.env.VERCEL_ORG_ID,
          projectId: process.env.VERCEL_PROJECT_ID,
          settings: {
            ...(current.settings || {}),
            rootDirectory: process.env.VERCEL_APP_PATH,
          },
        };
        fs.writeFileSync(path, JSON.stringify(next, null, 2));
        console.log(`Vercel rootDirectory=${next.settings.rootDirectory}`);
        NODE

    - name: 🚀 Deploy
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ENVIRONMENT: ${{ inputs.vercel-environment }}
        PRODUCTION: ${{ inputs.production }}
        APP_PATH: ${{ inputs.app-path }}
        CI_DB_NAME: ${{ inputs.ci-db-name }}
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        set -euo pipefail
        flags=(--yes --token "$VERCEL_TOKEN")
        if [ "$PRODUCTION" = 'true' ]; then
          test "$VERCEL_ENVIRONMENT" = 'production'
          flags+=(--prod)
        else
          test "$PRODUCTION" = 'false'
          test "$VERCEL_ENVIRONMENT" = 'preview'
        fi
        if [ -n "$CI_DB_NAME" ]; then
          test "$PRODUCTION" = 'false'
          test "$APP_PATH" = 'apps/api'
          [[ "$CI_DB_NAME" =~ ^bgo_ci_[1-9][0-9]*_[1-9][0-9]*$ ]] || exit 1
          # The remote API build validates Infisical's base DB/webhook pair first.
          flags+=(--build-env "BGO_CI_DB_NAME=$CI_DB_NAME" --env "MONGODB_DB_NAME=$CI_DB_NAME")
        fi
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          [[ "$line" =~ ^([A-Z][A-Z0-9_]*)=(.+)$ ]] || exit 1
          key="${BASH_REMATCH[1]}"
          value="${BASH_REMATCH[2]}"
          test "$key" != 'BGO_CI_DB_NAME'
          test "$value" != '[SENSITIVE]'
          if [ -n "$CI_DB_NAME" ]; then test "$key" != 'MONGODB_DB_NAME'; fi
          flags+=(--build-env "$key=$value" --env "$key=$value")
        done <<< "$EXTRA_ENV"
        url=$(vercel deploy "${flags[@]}")
        echo "url=$url" >> "$GITHUB_OUTPUT"

    - name: 📝 Comment Preview URL
      if: ${{ inputs.production == 'false' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        APP_NAME: ${{ inputs.app-name }}
      with:
        script: |
          const url = '${{ steps.deploy.outputs.url }}';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **${process.env.APP_NAME} Preview Deployed**\n\n🔗 **Preview URL:** ${url}\n\n_Triggered by PR #${context.issue.number}_`
          });

    - name: 📝 Post Production URL
      if: ${{ inputs.production == 'true' }}
      uses: actions/github-script@v7
      env:
        APP_NAME: ${{ inputs.app-name }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
      with:
        script: |
          const url = '${{ steps.deploy.outputs.url }}';
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            target_url: url,
            description: 'Deployed to production',
            context: process.env.STATUS_CONTEXT
          });
