name: Publish / update PR Development draft release
description: >-
  Publishes the verified Development APK and matching Web/API links independently
  of Internal/E2E status. Only the latest trusted PR head may update the draft.

inputs:
  github-token:
    description: Token with contents write and pull-requests read
    required: true
  version:
    description: Current app version
    required: true
  pr-number:
    description: Pull request number
    required: true
  pr-title:
    description: Pull request title, treated as data
    required: true
  base-sha:
    description: PR base SHA for changelog
    required: true
  head-sha:
    description: Verified PR head SHA
    required: true
  apk-path:
    description: Path of the verified Development APK
    required: true
  apk-name:
    description: Development APK base name; revision/run suffix is added safely
    required: true
  eas-build-url:
    description: Optional EAS link; empty only for the existing exhausted-quota exception
    required: false
    default: ''
  web-preview-url:
    description: Immutable Development Web URL, never the CI Web deployment
    required: true
  api-preview-url:
    description: Immutable Development API URL embedded in this APK and Web
    required: true
outputs:
  release_url:
    description: Draft release URL
    value: ${{ steps.release.outputs.release_url }}
  release_id:
    description: Draft release ID
    value: ${{ steps.release.outputs.release_id }}
  apk_url:
    description: Download URL of the verified revision-named Development APK
    value: ${{ steps.release.outputs.apk_url }}
runs:
  using: composite
  steps:
    - name: 📦 Create/update Development draft and attach verified APK
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_VERSION: ${{ inputs.version }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BASE_SHA: ${{ inputs.base-sha }}
        PR_HEAD_SHA: ${{ inputs.head-sha }}
        APK_PATH: ${{ inputs.apk-path }}
        APK_NAME: ${{ inputs.apk-name }}
        EAS_BUILD_URL: ${{ inputs.eas-build-url }}
        DEVELOPMENT_WEB_URL: ${{ inputs.web-preview-url }}
        DEVELOPMENT_API_URL: ${{ inputs.api-preview-url }}
      run: node .github/scripts/publish-pr-draft.mjs
