name: Deploy BGO to Netlify
description: Deploy the tested source to the matching Netlify projects.
inputs:
  target:
    description: Netlify project environment, development or production
    required: true
  source-sha:
    description: Verified commit to deploy
    required: true
  release-sha:
    description: Prepared release commit, when the Main run created a version
    required: false
  netlify-token:
    description: Netlify credential for the BGO team
    required: true
  clerk-secret-key:
    description: Matching Clerk secret for API runtime attestation
    required: true
  clerk-publishable-key:
    description: Matching Clerk publishable key
    required: true
  gateway-pr:
    description: PR allowed to publish the stable Development MCP gateway
    required: false
runs:
  using: composite
  steps:
    - name: Set up workspace
      uses: ./.github/actions/setup-bun

    - name: Install Netlify CLI
      shell: bash
      run: npm install --global netlify-cli@27.20.1

    - name: Verify source and deploy to Netlify
      shell: bash
      env:
        NETLIFY_AUTH_TOKEN: ${{ inputs.netlify-token }}
        NETLIFY_CLI_TELEMETRY_DISABLED: '1'
        CLERK_SECRET_KEY: ${{ inputs.clerk-secret-key }}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        BGO_NETLIFY_STAGE: ${{ inputs.target }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        RELEASE_SHA: ${{ inputs.release-sha }}
        GATEWAY_PR: ${{ inputs.gateway-pr }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ github.token }}
      run: bash .github/actions/netlify-deploy/deploy.sh
