name: Tests
description: Installs workspace dependencies and runs the Vitest test suite of a project.
# Requires the calling job to have run actions/checkout first.

inputs:
  project-name:
    description: pnpm filter name (mobile, web, api)
    required: true

runs:
  using: composite
  steps:
    - name: 🧰 Setup workspace
      uses: ./.github/actions/setup-pnpm

    - name: 🧪 Run tests
      shell: bash
      run: pnpm --filter ${{ inputs.project-name }} test
