name: Verified Android OTA
description: Publish a Hermes update only after its APK, configuration, runtime and source pass checks.
inputs:
  source-sha:
    description: Exact checked-out source commit of the verified APK
    required: true
  app-environment:
    description: development or production
    required: true
  update-channel:
    description: development or production
    required: true
  expo-token:
    description: Scoped EXPO_TOKEN
    required: true
  api-url:
    description: Same verified API URL as this publication's APK
    required: true
  clerk-publishable-key:
    description: Same Clerk public key as the APK
    required: true
  maptiler-api-key:
    description: Same public map key as the APK
    required: true
  sentry-dsn:
    description: Same Mobile Sentry DSN as the APK
    required: false
    default: ''
  google-services-json:
    description: Same optional Firebase configuration document as the APK
    required: false
    default: ''
  protection-bypass:
    description: Same Preview protection bypass as the APK
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Verify and publish Android OTA
      shell: bash
      env:
        OTA_SOURCE_SHA: ${{ inputs.source-sha }}
        OTA_ARTIFACT_DIR: ${{ github.workspace }}/apk
        APP_VARIANT: ${{ inputs.app-environment }}
        EXPO_UPDATE_CHANNEL: ${{ inputs.update-channel }}
        MOBILE_BUILD_PROFILE: internal
        EXPO_TOKEN: ${{ inputs.expo-token }}
        EXPO_PUBLIC_API_URL: ${{ inputs.api-url }}
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        EXPO_PUBLIC_MAPTILER_API_KEY: ${{ inputs.maptiler-api-key }}
        EXPO_PUBLIC_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        EXPO_PUBLIC_VERCEL_PROTECTION_BYPASS: ${{ inputs.protection-bypass }}
        GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.google-services-json }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EXPO_NO_DOTENV: '1'
        SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      run: node .github/scripts/publish-mobile-update.mjs
