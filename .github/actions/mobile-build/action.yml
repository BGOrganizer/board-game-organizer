name: Mobile APK (EAS local build)
description: >-
  Builds one Android APK profile locally with EAS and exposes artifact metadata.
  The calling workflow selects the API environment; this action owns workspace
  setup, native toolchains, build caches and APK checksums.

inputs:
  app-environment:
    description: Android application variant (development or production), independent of EAS profile
    required: true
  update-channel:
    description: OTA destination (ci-pr-N, development, or production)
    required: true
  install-dependencies:
    description: Install the workspace; disable only when the caller already installed this checkout
    required: false
    default: 'true'
  profile:
    description: 'EAS profile to build (must match an eas.json profile): development or internal'
    required: true
  expo-token:
    description: Expo/EAS token (EXPO_TOKEN secret)
    required: true
  clerk-publishable-key:
    description: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
    required: false
    default: ''
  api-url:
    description: EXPO_PUBLIC_API_URL
    required: false
    default: ''
  maptiler-api-key:
    description: Public MapTiler map key supplied by the calling workflow
    required: true
  sentry-dsn:
    description: EXPO_PUBLIC_SENTRY_DSN
    required: false
    default: ''
  google-services-json:
    description: Optional google-services.json content from a GitHub Actions secret
    required: false
    default: ''
  protection-bypass:
    description: EXPO_PUBLIC_VERCEL_PROTECTION_BYPASS (preview API bypass token)
    required: false
    default: ''

outputs:
  version:
    description: App version read from apps/mobile/app.config.js
    value: ${{ steps.meta.outputs.version }}
  build-number:
    description: Unique build number (timestamp)
    value: ${{ steps.meta.outputs.build-number }}
  artifact-name:
    description: APK file name
    value: ${{ steps.meta.outputs.artifact-name }}
  artifact-path:
    description: Path to the built APK (repo root relative)
    value: ${{ steps.meta.outputs.artifact-path }}

runs:
  using: composite
  steps:
    - name: Select Android app variant
      shell: bash
      env:
        APP_VARIANT: ${{ inputs.app-environment }}
        EXPO_UPDATE_CHANNEL: ${{ inputs.update-channel }}
      run: |
        case "$APP_VARIANT" in
          development) [[ "$EXPO_UPDATE_CHANNEL" =~ ^(development|ci-pr-[1-9][0-9]*)$ ]] ;;
          production) [[ "$EXPO_UPDATE_CHANNEL" == production ]] ;;
          *) false ;;
        esac || { echo "::error::Invalid app variant or OTA channel"; exit 1; }
        printf 'APP_VARIANT=%s\nEXPO_UPDATE_CHANNEL=%s\n' "$APP_VARIANT" "$EXPO_UPDATE_CHANNEL" >> "$GITHUB_ENV"

    - name: 🗺️ Verify MapTiler key
      shell: bash
      env:
        EXPO_PUBLIC_MAPTILER_API_KEY: ${{ inputs.maptiler-api-key }}
      run: |
        if [ -z "$EXPO_PUBLIC_MAPTILER_API_KEY" ]; then
          echo "::error::Set EXPO_PUBLIC_MAPTILER_API_KEY repository variable before building mobile maps"
          exit 1
        fi
    - name: 🧹 Free disk space
      shell: bash
      run: |
        # Hosted runners carry unused toolchains/images; /opt/ghc alone misses current GHC installs.
        # Preserve the entire Android SDK/NDK: EAS checks the runner's NDK path before Gradle runs.
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
          /usr/share/swift /usr/local/share/powershell \
          /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/Python \
          /opt/hostedtoolcache/Ruby
        docker image prune --all --force
        df -h / | tail -1

    - name: 🧰 Setup workspace
      uses: ./.github/actions/setup-bun
      with:
        install: ${{ inputs.install-dependencies }}

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: ⚡ Install EAS CLI
      shell: bash
      run: bun add --global eas-cli@27.7.2

    - name: ⚡ Verify EAS CLI installation
      shell: bash
      run: eas --version

    - name: 🩺 Check locked Expo SDK compatibility
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_OFFLINE: '1'
      run: bunx --no-install expo install --check

    - name: 🩺 Expo doctor
      shell: bash
      working-directory: apps/mobile
      env:
        # Compatibility was checked against the installed SDK above, not a moving remote matrix.
        EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
      run: bunx --no-install expo-doctor

    - name: 📦 Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/package.json', 'bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🧠 Configure Gradle for cold native builds
      shell: bash
      run: |
        GRADLE_CONFIG_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$GRADLE_CONFIG_HOME"
        # User-home properties override generated project defaults. Keep this
        # configuration outside cached dependency/wrapper directories.
        printf '%s\n' \
          'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' \
          'org.gradle.workers.max=2' >> "$GRADLE_CONFIG_HOME/gradle.properties"

    - name: 🏷️ Extract version & build metadata
      id: meta
      shell: bash
      run: |
        VERSION=$(node -p "require('./apps/mobile/app.config.js').expo.version")
        BUILD_NUMBER=$(date +%Y%m%d%H%M%S)
        ARTIFACT_NAME="board-game-organizer-${VERSION}-${BUILD_NUMBER}-${{ inputs.profile }}.apk"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        echo "artifact-path=apps/mobile/build-output/$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        echo "✅ Version: $VERSION | Build: $BUILD_NUMBER | Profile: ${{ inputs.profile }}"

    - name: 📱 Build ${{ inputs.profile }} APK (eas build --local)
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        MOBILE_BUILD_PROFILE: ${{ inputs.profile }}
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        EXPO_PUBLIC_API_URL: ${{ inputs.api-url }}
        EXPO_PUBLIC_MAPTILER_API_KEY: ${{ inputs.maptiler-api-key }}
        EXPO_PUBLIC_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        EXPO_PUBLIC_VERCEL_PROTECTION_BYPASS: ${{ inputs.protection-bypass }}
        GOOGLE_SERVICES_JSON_CONTENT: ${{ inputs.google-services-json }}
        NODE_ENV: ${{ inputs.profile == 'development' && 'development' || 'production' }}
        NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096
        # Gradle wrapper client defaults to 64 MiB, separate from the build daemon.
        JAVA_OPTS: -Xmx512m
        # EAS repeats Doctor; keep the same mandatory installed-SDK compatibility gate above.
        EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
          GOOGLE_SERVICES_PATH="$RUNNER_TEMP/google-services.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > "$GOOGLE_SERVICES_PATH"
          chmod 600 "$GOOGLE_SERVICES_PATH"
          export GOOGLE_SERVICES_JSON="$GOOGLE_SERVICES_PATH"
          trap 'rm -f "$GOOGLE_SERVICES_PATH"' EXIT
        fi
        mkdir -p build-output
        eas build \
          --platform android \
          --profile ${{ inputs.profile }} \
          --local \
          --non-interactive \
          --output "./build-output/${{ steps.meta.outputs.artifact-name }}"
        node ../../.github/scripts/mobile-build-inputs.mjs > build-output/build-inputs.sha256
        printf '%s\n' "$EXPO_UPDATE_CHANNEL" > build-output/update-channel.txt
        (cd build-output && sha256sum -- *.apk > apk.sha256)
        echo "✅ ${{ inputs.profile }} APK built:"
        ls -lh build-output/

    - name: 💽 Report build disk usage
      if: ${{ always() }}
      shell: bash
      run: |
        df -h / /tmp
        df -i / /tmp
        # Sizes only: never emit build inputs, credentials or generated environment files.
        du -sh "$HOME/.gradle" "$RUNNER_TEMP" /tmp/runner 2>/dev/null || true
