name: Mobile APK (EAS local build — both profiles)
description: >
  Builds Android APKs locally on the runner with `eas build --local`
  (no EAS cloud credits needed), following the expo-react-native-cicd
  pipeline: one build per profile. Produces BOTH the `development` APK
  (dev client, for testing) and the `internal` APK (release, for
  distribution). Exposes version/build metadata and artifact paths.

inputs:
  expo-token:
    description: Expo/EAS token (EXPO_TOKEN secret)
    required: true
  clerk-publishable-key:
    description: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
    required: false
    default: ''
  api-url:
    description: EXPO_PUBLIC_API_URL
    required: false
    default: ''
  sentry-dsn:
    description: EXPO_PUBLIC_SENTRY_DSN
    required: false
    default: ''

outputs:
  version:
    description: App version read from apps/mobile/app.config.js
    value: ${{ steps.meta.outputs.version }}
  build-number:
    description: Unique build number (timestamp)
    value: ${{ steps.meta.outputs.build-number }}
  development-artifact-name:
    description: Development APK file name
    value: ${{ steps.meta.outputs.development-artifact-name }}
  development-artifact-path:
    description: Path to the development APK (repo root relative)
    value: ${{ steps.meta.outputs.development-artifact-path }}
  internal-artifact-name:
    description: Internal APK file name
    value: ${{ steps.meta.outputs.internal-artifact-name }}
  internal-artifact-path:
    description: Path to the internal APK (repo root relative)
    value: ${{ steps.meta.outputs.internal-artifact-path }}

runs:
  using: composite
  steps:
    - name: 🧰 Setup workspace
      uses: ./.github/actions/setup-pnpm

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: ⚡ Install EAS CLI
      shell: bash
      run: npm install -g eas-cli@latest

    - name: 🔄 Verify EAS CLI installation
      shell: bash
      run: eas --version

    - name: 📦 Cache EAS local build
      uses: actions/cache@v4
      with:
        path: ~/.eas-build-local
        key: ${{ runner.os }}-eas-build-local-${{ hashFiles('apps/mobile/package.json', 'apps/mobile/eas.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-eas-build-local-

    - name: 📦 Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🏷️ Extract version & build metadata
      id: meta
      shell: bash
      run: |
        VERSION=$(node -p "require('./apps/mobile/app.config.js').expo.version")
        BUILD_NUMBER=$(date +%Y%m%d%H%M%S)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        echo "development-artifact-name=board-game-organizer-${VERSION}-${BUILD_NUMBER}-development.apk" >> "$GITHUB_OUTPUT"
        echo "development-artifact-path=apps/mobile/build-output/board-game-organizer-${VERSION}-${BUILD_NUMBER}-development.apk" >> "$GITHUB_OUTPUT"
        echo "internal-artifact-name=board-game-organizer-${VERSION}-${BUILD_NUMBER}-internal.apk" >> "$GITHUB_OUTPUT"
        echo "internal-artifact-path=apps/mobile/build-output/board-game-organizer-${VERSION}-${BUILD_NUMBER}-internal.apk" >> "$GITHUB_OUTPUT"
        echo "✅ Version: $VERSION | Build: $BUILD_NUMBER"

    - name: 📱 Build Development APK
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        EXPO_PUBLIC_API_URL: ${{ inputs.api-url }}
        EXPO_PUBLIC_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        NODE_ENV: development
        NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096
      run: |
        mkdir -p build-output
        eas build \
          --platform android \
          --profile development \
          --local \
          --non-interactive \
          --output "./build-output/${{ steps.meta.outputs.development-artifact-name }}"
        echo "✅ Development APK built:"
        ls -lh build-output/

    - name: 📱 Build Internal APK
      shell: bash
      working-directory: apps/mobile
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk-publishable-key }}
        EXPO_PUBLIC_API_URL: ${{ inputs.api-url }}
        EXPO_PUBLIC_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        NODE_ENV: production
        NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096
      run: |
        eas build \
          --platform android \
          --profile internal \
          --local \
          --non-interactive \
          --output "./build-output/${{ steps.meta.outputs.internal-artifact-name }}"
        echo "✅ Internal APK built:"
        ls -lh build-output/
