name: Deploy MCP gateway
description: Publish the prebuilt MCP gateway to its dedicated Vercel project.
inputs:
  target:
    description: BGO deployment environment
    required: true
  project-id:
    description: The dedicated Vercel Gateway project ID. An empty value disables deployment.
    required: false
  development-pr:
    description: The only pull request allowed to update the Development gateway
    required: false
  base-sha:
    description: The source commit before this change
    required: true
  vercel-org-id:
    description: Vercel organization ID
    required: true
  vercel-token:
    description: Vercel token
    required: true
runs:
  using: composite
  steps:
    - name: Select relevant gateway changes
      id: changes
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PROJECT_ID: ${{ inputs.project-id }}
        DEVELOPMENT_PR: ${{ inputs.development-pr }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        set -euo pipefail
        if [ -z "$PROJECT_ID" ]; then
          echo 'MCP gateway deployment is disabled for this environment.'
          exit 0
        fi
        [[ "$PROJECT_ID" =~ ^prj_[a-zA-Z0-9]+$ ]]
        case "$TARGET" in
          development)
            test "$GITHUB_EVENT_NAME" = pull_request
            if [ -z "$DEVELOPMENT_PR" ]; then
              echo 'No pull request is selected for the Development gateway.'
              exit 0
            fi
            [[ "$DEVELOPMENT_PR" =~ ^[1-9][0-9]*$ ]]
            if [ "$PR_NUMBER" != "$DEVELOPMENT_PR" ]; then
              echo 'The Development gateway targets another pull request.'
              exit 0
            fi
            ;;
          production)
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            ;;
          *) exit 1 ;;
        esac
        [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
          .github/actions/mcp-gateway-deploy \
          apps/mcp/gateway-build.mts apps/mcp/development-gateway.mts \
          apps/mcp/src/developmentGateway.ts packages/shared/src/common/api.ts; then
          echo 'No gateway deployment inputs changed.'
        else
          test "$?" = 1
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
        fi

    - name: Set up gateway build tooling
      if: steps.changes.outputs.deploy == 'true'
      uses: ./.github/actions/setup-bun
      with:
        install: 'false'

    - name: Build gateway and install Vercel CLI
      if: steps.changes.outputs.deploy == 'true'
      id: build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        stage=$(mktemp -d "$RUNNER_TEMP/bgo-mcp-gateway.XXXXXX")
        bun apps/mcp/gateway-build.mts "$stage/.vercel/output" "$TARGET"
        bun add --global vercel@65.14.0
        printf 'stage=%s\n' "$stage" >> "$GITHUB_OUTPUT"

    - name: Deploy and promote the verified gateway
      if: steps.changes.outputs.deploy == 'true'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        STAGE: ${{ steps.build.outputs.stage }}
        PROJECT_ID: ${{ inputs.project-id }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ github.token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: |
        set -euo pipefail
        function check_current_source() {
          if [ "$TARGET" = development ]; then
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" || return 1
            node .github/scripts/ci-current-pr.mjs
          else
            node --input-type=module <<'JS'
        import { inspectMainRelease } from './.github/scripts/main-release-preparation.mjs';
        if (inspectMainRelease({ sourceSha: process.env.GITHUB_SHA, requireTag: false }).mode === 'superseded') {
          console.log('A newer main commit is available. Skipping gateway promotion.');
          process.exitCode = 3;
        }
        JS
          fi
        }
        function require_current_source() {
          local status=0
          check_current_source || status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          return "$status"
        }

        project_name="bgo-mcp-$TARGET"
        provider=(--scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN")
        vercel api "/v9/projects/$PROJECT_ID" --raw "${provider[@]}" \
          | jq -e --arg id "$PROJECT_ID" --arg owner "$VERCEL_ORG_ID" --arg name "$project_name" \
            '.id == $id and .accountId == $owner and .name == $name' >/dev/null
        jq -n --arg projectId "$PROJECT_ID" --arg orgId "$VERCEL_ORG_ID" --arg projectName "$project_name" \
          '{projectId: $projectId, orgId: $orgId, projectName: $projectName}' > "$STAGE/.vercel/project.json"
        export VERCEL_PROJECT_ID="$PROJECT_ID"

        if [ "$TARGET" = development ]; then
          upstream="https://api-development-pr-$PR_NUMBER-board-game-organizers-projects.vercel.app"
        else
          upstream=https://api.board-game-organizer.com
        fi
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
        deployment_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        require_current_source
        (cd "$STAGE" && vercel deploy --prebuilt --prod --skip-domain --yes \
          --meta "bgoGatewaySourceSha=$GITHUB_SHA" --meta "bgoGatewayRun=$deployment_key" \
          --env "BGO_MCP_UPSTREAM_URL=$upstream" "${provider[@]}") >/dev/null

        # The CLI can omit the URL on stdout for staged deploys in CI.
        deployment_path="/v6/deployments?projectId=$PROJECT_ID&meta-bgoGatewayRun=$deployment_key&limit=2"
        url=$(vercel api "$deployment_path" --raw "${provider[@]}" \
          | jq -er --arg project "$PROJECT_ID" --arg source "$GITHUB_SHA" --arg run "$deployment_key" \
            '.deployments | if length == 1 then .[0] else empty end
            | select(.projectId == $project and .target == "production" and .readyState == "READY"
                and .meta.bgoGatewaySourceSha == $source and .meta.bgoGatewayRun == $run) | .url') || {
          echo 'No unique READY gateway matches this run and source.' >&2
          exit 1
        }
        [[ "$url" =~ ^[a-zA-Z0-9-]+\.vercel\.app$ ]]
        require_current_source
        vercel promote "https://$url" --yes "${provider[@]}"
