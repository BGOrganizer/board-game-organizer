name: Maestro E2E phase
description: Run one preparation phase or Maestro flow on the job's shared emulator.

inputs:
  phase:
    description: install, warm, seed, flow, verify or cleanup
    required: true
  flow:
    description: Maestro flow name (phase flow only)
    required: false
    default: ""
  apk-path:
    description: Internal APK path (phase install only)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run Maestro phase
      shell: bash
      env:
        MAESTRO_PHASE: ${{ inputs.phase }}
        MAESTRO_FLOW: ${{ inputs.flow }}
        E2E_APK: ${{ inputs.apk-path }}
      run: bash -e -o pipefail .github/scripts/maestro-e2e.sh "$MAESTRO_PHASE" "$MAESTRO_FLOW"
