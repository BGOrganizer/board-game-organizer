name: Android Emulator (KVM-accelerated)
description: Install SDK, create AVD or boot a job-scoped emulator shared by subsequent steps.

inputs:
  phase:
    description: sdk, avd or boot
    required: true

runs:
  using: composite
  steps:
    - name: Validate emulator phase
      shell: bash
      env:
        EMULATOR_PHASE: ${{ inputs.phase }}
      run: |
        case "$EMULATOR_PHASE" in
          sdk|avd|boot) ;;
          *) echo "Unknown emulator phase" >&2; exit 2 ;;
        esac
    - name: Resolve SDK cache path
      if: inputs.phase == 'sdk'
      shell: bash
      run: |
        : "${ANDROID_HOME:?ANDROID_HOME is required}"
        # Preinstalled SDK directories can be root-owned. Cache tar must be able
        # to restore timestamps/modes, not just download/extract the image.
        for path in "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" \
                    "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools"; do
          if [[ -d "$path" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$path"
          fi
        done
        echo "BGO_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

    - name: ♻️ Restore Android SDK image and tools
      if: inputs.phase == 'sdk'
      id: sdk-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ env.BGO_ANDROID_SDK }}/system-images/android-34/google_apis/x86_64
          ${{ env.BGO_ANDROID_SDK }}/emulator
          ${{ env.BGO_ANDROID_SDK }}/platform-tools
        key: ${{ runner.os }}-${{ runner.arch }}-android-34-google_apis-x86_64-v1-${{ hashFiles('.github/actions/android-emulator/action.yml') }}

    - name: 🛠️ Install SDK components
      if: inputs.phase == 'sdk'
      shell: bash
      run: |
        SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        yes | "$SDKMGR" --licenses > /dev/null || true
        "$SDKMGR" "platform-tools" "emulator" > /dev/null
        # Expo Location requires Google Play Services' FusedLocation provider.
        # Use a rendering-enabled Google APIs image, never ATD.
        "$SDKMGR" "system-images;android-34;google_apis;x86_64" > /dev/null
        ls "$ANDROID_HOME/system-images/android-34" 2>/dev/null || true

    # Save immediately after SDK setup, even if later native acceptance fails.
    # Never cache AVD userdata, accounts, permissions, snapshots or test fixtures.
    - name: 💾 Save Android SDK image and tools
      if: inputs.phase == 'sdk' && steps.sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.BGO_ANDROID_SDK }}/system-images/android-34/google_apis/x86_64
          ${{ env.BGO_ANDROID_SDK }}/emulator
          ${{ env.BGO_ANDROID_SDK }}/platform-tools
        key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

    - name: 🚀 Create AVD
      if: inputs.phase == 'avd'
      shell: bash
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        IMG=google_apis
        echo "using system image: $IMG"
        mkdir -p "$HOME/.android/avd"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
        echo no | avdmanager create avd --force -n test \
          --package "system-images;android-34;$IMG;x86_64" --device pixel_6 \
          2>&1 | tee /tmp/avd-create.log
        avdmanager list avd
        test -f "$ANDROID_AVD_HOME/test.ini" || {
          echo "AVD CREATION FAILED"; cat /tmp/avd-create.log; exit 1; }

    - name: 📱 Boot emulator
      if: inputs.phase == 'boot'
      shell: bash
      run: |
        export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
        # Fail early if this runner cannot provide hardware acceleration.
        test -c /dev/kvm || { echo "KVM device unavailable on this runner" >&2; exit 1; }
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        # Trigger is asynchronous by default: wait for this device's rules before
        # checking permissions. Do not fall back to software CPU emulation.
        sudo udevadm trigger --name-match=kvm --settle
        if ! test -r /dev/kvm || ! test -w /dev/kvm; then
          echo "KVM device exists but runner lacks read/write permission after udev settlement" >&2
          ls -l /dev/kvm >&2
          id >&2
          exit 1
        fi
        "$ANDROID_HOME/emulator/emulator" -accel-check
        # Keep the same emulator across job steps, not across jobs. Disconnect
        # shell streams so returning from this step does not wait for the daemon.
        nohup "$ANDROID_HOME/emulator/emulator" -avd test \
          -no-window -no-audio -no-boot-anim -no-snapshot \
          -gpu swiftshader_indirect -memory 3072 -cores 4 -accel on \
          -port 5554 > /tmp/emulator.log 2>&1 < /dev/null &
        EMU_PID=$!
        EMULATOR_READY=0
        trap 'if [ "$EMULATOR_READY" != "1" ]; then kill "$EMU_PID" 2>/dev/null || true; fi' EXIT
        timeout 300 adb wait-for-device || { echo "NO DEVICE"; tail -20 /tmp/emulator.log; exit 1; }
        BOOTED=0
        for i in $(seq 1 150); do
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
            BOOTED=1; echo "booted after ~$((i*10))s"; break
          fi
          sleep 10
        done
        if [ "$BOOTED" != "1" ]; then
          echo "EMULATOR FAILED TO BOOT"; tail -30 /tmp/emulator.log; exit 1
        fi
        # Fail before acceptance if the required native location provider is absent.
        adb shell pm path com.google.android.gms | grep -q '^package:' || {
          echo "Google Play Services unavailable: Expo Location cannot resolve GPS" >&2; exit 1; }
        sleep 45 # let the input service settle before interacting
        adb shell input keyevent 82 || true
        # Acceptance exercises normal motion and exposes Android crash/ANR dialogs.
        adb shell settings put global window_animation_scale 1.0
        adb shell settings put global transition_animation_scale 1.0
        adb shell settings put global animator_duration_scale 1.0
        adb shell settings put global hide_error_dialogs 0
        free -m
        adb logcat -c
        echo "BGO_EMULATOR_PID=$EMU_PID" >> "$GITHUB_ENV"
        EMULATOR_READY=1
