name: Send Telegram release notification
description: >-
  Sends the release/PR notification to the configured Telegram channel using
  scripts/release/telegram-notify.mjs with shared English release metadata,
  linked commits and a bounded changelog excerpt.

inputs:
  bot-token:
    description: Telegram bot token (TELEGRAM_BOT_TOKEN secret)
    required: true
  chat-id:
    description: Telegram channel id (TELEGRAM_CHAT_ID secret)
    required: true
  app-environment:
    description: Development or Production publication target
    required: true
  version:
    description: Published application version
    required: true
  pr-number:
    description: PR being previewed, or the merged PR that triggered Production
    required: false
    default: ''
  release-url:
    description: Verified GitHub release with the complete changelog
    required: true
  apk-url:
    description: Direct download URL of the verified APK
    required: true
  web-url:
    description: Published web application URL
    required: true
  changelog-file:
    description: Path to the Conventional Commit changelog, excluding release metadata
    required: true

runs:
  using: composite
  steps:
    - name: 📤 Send Telegram message
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
        APP_ENVIRONMENT: ${{ inputs.app-environment }}
        APP_VERSION: ${{ inputs.version }}
        PR_NUMBER: ${{ inputs.pr-number }}
        RELEASE_URL: ${{ inputs.release-url }}
        APK_URL: ${{ inputs.apk-url }}
        WEB_URL: ${{ inputs.web-url }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
      run: |
        node scripts/release/telegram-notify.mjs \
          --changelog "$CHANGELOG_FILE"
