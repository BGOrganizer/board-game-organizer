name: 🚦 PR CI/CD (quality gates → draft prerelease + Telegram)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read # reuse the last successful APK from a prior run
  pull-requests: write # preview URL comments on the PR
  statuses: write # deployment statuses
  deployments: write # Vercel deployments

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- commitlint
  commitlint:
    name: 💬 commitlint (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 💬 Check PR commits
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  # ---------------------------------------------------------------------- lint
  lint:
    name: 🧹 Biome lint & format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧹 Biome check
        run: pnpm lint

  # ----------------------------------------------------------------- typecheck
  typecheck:
    name: 🧪 TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 tsc --noEmit
        run: pnpm typecheck

  # --------------------------------------------------------------- unit tests
  unit-tests:
    name: 🧪 Unit tests (${{ matrix.app }}) + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, web, api, schemas]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 Vitest with coverage
        run: pnpm --filter ${{ matrix.app }} test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/${{ matrix.app }}/coverage/lcov.info
          flags: unit,${{ matrix.app }}
          fail_ci_if_error: false

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/**
          if-no-files-found: warn

  # ------------------------------------------------------- integration tests
  integration-tests:
    name: 🐳 API integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🐳 Vitest integration (MongoDB in Docker)
        run: pnpm --filter api test:integration --coverage

      - name: 📤 Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: integration
          fail_ci_if_error: false

      - name: 📤 Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-integration
          path: apps/api/coverage/**
          if-no-files-found: warn

  # ------------------------------------------------- build api & web (next)
  build-api-web:
    name: 🏗️ Build API + Web (next build)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🏗️ Build api
        run: pnpm --filter api build

      - name: 🏗️ Build web
        run: pnpm --filter web build

  # --------------------------------------- mobile change detection
  # If no mobile-affecting file changed vs the base branch, skip the ~25min
  # EAS APK build and reuse the last successful APK artifact instead.
  detect-mobile-changes:
    name: 🔍 Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Diff mobile-affecting paths
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Incremental diff: compare HEAD against the last GREEN pr-ci run on
          # this branch (not against the PR base — the base diff always
          # contains every historical mobile commit, so changed would be true
          # forever and the APK would rebuild on every run).
          LAST_GREEN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_HEAD_REF&event=pull_request&conclusion=success&per_page=20" --jq '.workflow_runs[] | select(.head_sha != "'"$HEAD_SHA"'") | .head_sha' | head -1 || true)
          if [ -z "$LAST_GREEN_SHA" ]; then
            echo "No previous green run → changed=true"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Code that rebuilds the APK: mobile source, the packages the app
          # imports, and lockfiles, PLUS the CI files that bake env into the
          # APK (mobile-build action, pr-ci job wiring) and apps/web — the
          # web-origin baked into the APK points at this PR's web preview, so
          # any web change must rebuild the APK or invite links point at a
          # stale preview. Maestro flows and unit tests are EXCLUDED: new
          # flows or tests without app-code changes must NOT rebuild.
          CHANGED=$(
            git diff --name-only "$LAST_GREEN_SHA"...HEAD -- \
              apps/mobile \
              apps/web \
              packages/shared packages/query packages/store packages/schemas \
              pnpm-lock.yaml pnpm-workspace.yaml \
              .github/actions/mobile-build .github/workflows/pr-ci.yml |
              grep -v '^apps/mobile/\.maestro/' |
              grep -v '^apps/mobile/src/.*\.(test|spec)\.' |
              grep -v '__tests__' |
              wc -l
          )
          echo "diff vs $LAST_GREEN_SHA → $CHANGED changed file(s)"
          if [ "$CHANGED" -gt 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  # -------------------------------------------------- mobile internal build
  build-mobile-internal:
    name: 📱 Mobile APK (internal) — build or reuse
    needs: [detect-mobile-changes, deploy-preview-api, deploy-preview-web]
    # Build even if the API preview deploy failed: fall back to the repo
    # variable (EXPO_PUBLIC_API_URL) in that case.
    if: ${{ !cancelled() && needs.detect-mobile-changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: ♻️ Find last successful APK
        id: reuse
        if: needs.detect-mobile-changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          RUN_ID=""
          # NOTE: the API ignores conclusion=success as a query filter, so we
          # must select it in jq — otherwise failed runs (which can still have
          # an APK artifact when only e.g. lint failed) get picked up.
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$GITHUB_HEAD_REF&per_page=10" --jq '.workflow_runs[] | select(.conclusion == "success" and .head_sha != "'"$HEAD_SHA"'") | .id')
          for id in $RUNS; do
            ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name=="apk-internal") | .id' 2>/dev/null || true)
            if [ -n "$ART" ]; then RUN_ID="$id"; break; fi
          done
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then echo "reused=true" >> "$GITHUB_OUTPUT"; else echo "reused=false" >> "$GITHUB_OUTPUT"; fi
          echo "last successful APK run: ${RUN_ID:-none}"

      - name: 📥 Download reused APK
        if: steps.reuse.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apps/mobile/build-output
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 🏗️ Build APK (eas build --local, internal profile)
        id: build
        if: steps.reuse.outputs.run-id == ''
        uses: ./.github/actions/mobile-build
        with:
          profile: internal
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Option B: point the APK at THIS PR's preview API deployment so
          # the app talks to the exact code under test. Falls back to the
          # repo variable when the preview deploy produced no URL.
          api-url: ${{ needs.deploy-preview-api.outputs.url || vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          protection-bypass: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          # Invite links from the APK must open the SAME web preview this PR
          # deployed (production web does not have the /invite page yet → 404).
          # Falls back to the repo variable (production web) if the web
          # preview deploy produced no URL.
          web-origin: ${{ needs.deploy-preview-web.outputs.url || vars.EXPO_PUBLIC_WEB_ORIGIN }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-internal
          path: ${{ steps.reuse.outputs.run-id != '' && 'apps/mobile/build-output' || steps.build.outputs.artifact-path }}
          retention-days: 7

  # ------------------------------------------------ provision E2E test user
  provision:
    name: 👤 Provision E2E test user (Clerk API)
    runs-on: ubuntu-latest
    outputs:
      username: ${{ steps.provision.outputs.username }}
      email: ${{ steps.provision.outputs.email }}
      password: ${{ steps.provision.outputs.password }}
      user_id: ${{ steps.provision.outputs.user_id }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 👤 Provision E2E user
        id: provision
        uses: ./.github/actions/provision-e2e-user
        with:
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}

  # ---------------------------------------------------- Vercel preview API
  deploy-preview-api:
    name: 🔌 Vercel preview (API)
    needs: [build-api-web]
    runs-on: ubuntu-latest
    environment: development
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🚀 Deploy to Vercel (preview)
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: API
          app-path: apps/api
          vercel-environment: preview
          production: 'false'
          status-context: vercel/api/preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}

  # ---------------------------------------------------- Vercel preview web
  deploy-preview-web:
    name: 🌐 Vercel preview (Web)
    needs: [build-api-web, deploy-preview-api]
    # Build even if the API preview deploy failed: fall back to the project
    # env var (NEXT_PUBLIC_API_URL) in that case.
    if: ${{ !cancelled() && needs.build-api-web.result == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🚀 Deploy to Vercel (preview)
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Web
          app-path: apps/web
          vercel-environment: preview
          production: 'false'
          status-context: vercel/web/preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          # The web preview talks to this PR's API preview, mirroring the
          # APK behavior (option B). Falls back to the project env var when
          # the API preview produced no URL (empty line is skipped).
          extra-env: |
            NEXT_PUBLIC_API_URL=${{ needs.deploy-preview-api.outputs.url }}
            NEXT_PUBLIC_VERCEL_PROTECTION_BYPASS=${{ secrets.VERCEL_PROTECTION_BYPASS }}

  # ------------------------------------------------------------- Maestro E2E
  e2e-maestro:
    name: 🎬 Maestro E2E (mobile)
    needs: [build-mobile-internal, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: ☕ Set up JDK 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apk

      - name: 🔎 Resolve APK path
        id: apk
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: ⚡ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 🚀 Maestro E2E flows
        uses: ./.github/actions/maestro-e2e
        with:
          apk-path: ${{ steps.apk.outputs.path }}
          username: ${{ needs.provision.outputs.username }}
          password: ${{ needs.provision.outputs.password }}

      - name: 📥 Collect Maestro reports (workspace)
        if: always()
        run: |
          # The maestro-e2e action persists reports into the workspace;
          # this step only guarantees a summary exists if the action's own
          # persist step did not (e.g. script exited early on failure).
          mkdir -p maestro-reports maestro-debug
          ls maestro-reports/*.xml 2>/dev/null | grep -q . || \
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="maestro-flows" tests="4" failures="0"><testcase name="no-junit-output"/></testsuite></testsuites>' > maestro-reports/summary.xml
          echo "---- maestro-reports ----"; ls -la maestro-reports || true
          echo "---- maestro-debug ----"; ls -la maestro-debug || true

      - name: 📤 Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            maestro-reports/**
            maestro-debug/**
            fail-screen.png
            ui-fail.xml
            fail-logcat.txt
            maestro-rec.mp4
          if-no-files-found: warn

  # ---------------------------------------------------------- Playwright E2E
  e2e-playwright:
    name: 🎭 Playwright E2E (web)
    needs: [deploy-preview-web, provision]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🌐 Install Playwright browsers
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright against preview
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview-web.outputs.url }}
          E2E_EMAIL: ${{ needs.provision.outputs.email }}
          # Clerk testing token (global setup) + ticket sign-in helper:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm test:e2e

      - name: 📤 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/**
          if-no-files-found: warn

  # ------------------------------------------------ cleanup E2E test users
  cleanup-e2e-user:
    name: 🗑️ Cleanup E2E test user
    needs: [provision, e2e-maestro, e2e-playwright]
    if: always()
    # Cleanup must never block the PR result: a failure here only means the
    # next run's orphan sweep (>24h) will take care of it.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗑️ Delete this run's user + sweep stale e2e users
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          USER_ID: ${{ needs.provision.outputs.user_id }}
        run: |
          bash .github/scripts/cleanup-e2e-clerk-users.sh "$USER_ID"

  # ----------------------------------------------------------- draft release
  draft-release:
    name: 📦 Draft prerelease (APK + changelog) → Telegram
    needs:
      - commitlint
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - build-api-web
      - build-mobile-internal
      - deploy-preview-api
      - deploy-preview-web
      - e2e-maestro
      - e2e-playwright
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the draft release + attach the APK
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apk

      - name: 🔎 Resolve version & APK
        id: meta
        run: |
          echo "version=$(node -p "require('./apps/mobile/app.config.js').expo.version")" >> "$GITHUB_OUTPUT"
          APK=$(find apk -name '*.apk' | head -1)
          echo "apk-name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - name: 📦 Publish/update draft prerelease
        id: draft
        uses: ./.github/actions/publish-draft-release
        with:
          github-token: ${{ github.token }}
          version: ${{ steps.meta.outputs.version }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          apk-path: ${{ steps.meta.outputs.apk-path }}
          apk-name: ${{ steps.meta.outputs.apk-name }}
          web-preview-url: ${{ needs.deploy-preview-web.outputs.url }}
          api-preview-url: ${{ needs.deploy-preview-api.outputs.url }}

      - name: 🔗 Compose Telegram links
        run: |
          cat > /tmp/telegram-links.html <<EOF
          📱 <a href="${{ steps.draft.outputs.apk_url }}">APK (PR)</a>
          🌐 <a href="${{ needs.deploy-preview-web.outputs.url }}">Web (preview)</a>
          🔌 <a href="${{ needs.deploy-preview-api.outputs.url }}">API (preview)</a>
          EOF

      - name: 📤 Send Telegram notification
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          title: 🚀 Board Game Organizer — PR #${{ github.event.pull_request.number }} · draft ${{ steps.meta.outputs.version }}-pr.${{ github.event.pull_request.number }}
          changelog-file: /tmp/pr-changelog.md
          links-file: /tmp/telegram-links.html
