name: 🚦 PR CI/CD (quality gates → draft prerelease + Telegram)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read # reuse the last successful APK from a prior run
  pull-requests: write # preview URL comments on the PR
  statuses: write # deployment statuses
  deployments: write # Vercel deployments

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- commitlint
  commitlint:
    name: 💬 commitlint (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 💬 Check PR commits
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  # ---------------------------------------------------------------------- lint
  lint:
    name: 🧹 Biome lint & format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧹 Biome check
        run: pnpm lint

  # ----------------------------------------------------------------- typecheck
  typecheck:
    name: 🧪 TypeScript typecheck
    needs: [commitlint, lint]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 tsc --noEmit
        run: pnpm typecheck

  # --------------------------------------------------------------- unit tests
  unit-tests:
    name: 🧪 Unit tests (${{ matrix.app }}) + coverage
    needs: [commitlint, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [mobile, web, api, schemas, shared]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 Vitest with coverage
        run: pnpm --filter ${{ matrix.app }} test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/${{ matrix.app }}/coverage/lcov.info
          flags: unit,${{ matrix.app }}
          fail_ci_if_error: false

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage/**
          if-no-files-found: warn

  # ------------------------------------------------------- integration tests
  integration-tests:
    name: 🐳 API integration tests (testcontainers)
    needs: [commitlint, lint]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🐳 Vitest integration (MongoDB in Docker)
        run: pnpm --filter api test:integration --coverage

      - name: 📤 Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: integration
          fail_ci_if_error: false

      - name: 📤 Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-integration
          path: apps/api/coverage/**
          if-no-files-found: warn

  # ------------------------------------------------- build api & web (next)
  build-api-web:
    name: 🏗️ Build API + Web (next build)
    needs: [commitlint, lint, typecheck, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🏗️ Build api
        run: pnpm --filter api build

      - name: 🏗️ Build web
        run: pnpm --filter web build

  # --------------------------------------- mobile change detection
  # Compare against the last successful PR run; ignore unrelated web/API edits.
  # Reuse APK only when the artifact's own mobile inputs also match HEAD.
  detect-mobile-changes:
    name: 🔍 Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 Check APK change detection
        run: node --test .github/scripts/mobile-build-changed.test.mjs

      - name: 🔍 Diff mobile-affecting paths
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Incremental diff: compare HEAD against the last GREEN pr-ci run on
          # this branch (not against the PR base — the base diff always
          # contains every historical mobile commit, so changed would be true
          # forever and the APK would rebuild on every run).
          RUNS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_HEAD_REF&event=pull_request&per_page=100" 2>/dev/null) || RUNS_JSON='{}'
          LAST_GREEN_SHA=$(echo "$RUNS_JSON" | jq -r --argjson pr "${{ github.event.pull_request.number }}" \
            '[.workflow_runs[]? | select(.path == ".github/workflows/pr-ci.yml" and .conclusion == "success" and any(.pull_requests[]?; .number == $pr)) | .head_sha][0] // empty') || LAST_GREEN_SHA=''
          if [ -z "$LAST_GREEN_SHA" ] || ! git cat-file -e "$LAST_GREEN_SHA^{commit}" 2>/dev/null; then
            echo "No diffable previous green run → changed=true"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: any comparison error triggers a fresh APK.
          if CHANGED=$(node .github/scripts/mobile-build-changed.mjs "$LAST_GREEN_SHA" "$HEAD_SHA"); then
            echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------- mobile internal build
  build-mobile-internal:
    name: 📱 Mobile APK (internal) — build or reuse
    needs: [detect-mobile-changes, deploy-preview-api]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      reused: ${{ steps.verify-apk.outputs.reused || steps.reuse.outputs.reused }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          # Reuse compares prior run SHAs; shallow tips have no diffable ancestry.
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: ♻️ Find last successful APK
        id: reuse
        if: needs.detect-mobile-changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          RUN_ID=""
          # NOTE: the API ignores conclusion=success as a query filter, so we
          # must select it in jq — otherwise failed runs (which can still have
          # an APK artifact when only e.g. lint failed) get picked up.
          RUNS_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_HEAD_REF&event=pull_request&per_page=100" 2>/dev/null) || RUNS_JSON='{}'
          RUNS=$(echo "$RUNS_JSON" | jq -r --argjson pr "${{ github.event.pull_request.number }}" \
            '.workflow_runs[]? | select(.path == ".github/workflows/pr-ci.yml" and .conclusion == "success" and any(.pull_requests[]?; .number == $pr)) | .id') || RUNS=''
          # ONLY reuse an APK whose SHA has ZERO mobile-relevant diff vs HEAD.
          # A success run with an APK can be OLDER than the last green SHA the
          # detect step diffed against (interleaved cancelled/failed runs never
          # produce an APK), and reusing it would ship stale code silently.
          for id in $RUNS; do
            RUN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.head_sha' 2>/dev/null) || continue
            # A rewritten/rebased SHA may no longer exist → skip the candidate
            # instead of crashing the whole job.
            git cat-file -e "$RUN_SHA^{commit}" 2>/dev/null || continue
            CHANGED=$(node .github/scripts/mobile-build-changed.mjs "$RUN_SHA" "$HEAD_SHA") || continue
            if [ "$CHANGED" = 'true' ]; then
              echo "APK run $id ($RUN_SHA) has stale mobile inputs — skipping"
              continue
            fi
            ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name=="apk-internal") | .id' 2>/dev/null || true)
            if [ -n "$ART" ]; then RUN_ID="$id"; break; fi
          done
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then echo "reused=true" >> "$GITHUB_OUTPUT"; else echo "reused=false" >> "$GITHUB_OUTPUT"; fi
          echo "last reusable APK run: ${RUN_ID:-none}"

      - name: 📥 Download reused APK
        if: steps.reuse.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apps/mobile/build-output
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: 🔎 Verify reused APK targets this PR branch
        id: verify-apk
        if: steps.reuse.outputs.run-id != ''
        env:
          EXPECTED_API_URL: ${{ needs.deploy-preview-api.outputs.branch-url }}
        run: |
          if [ -n "$EXPECTED_API_URL" ] && [ "$(cat apps/mobile/build-output/api-url.txt 2>/dev/null)" = "$EXPECTED_API_URL" ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            rm -rf apps/mobile/build-output
            echo "APK provenance missing or stale; rebuilding"
          fi

      - name: 🏗️ Build APK (eas build --local, internal profile)
        id: build
        if: steps.reuse.outputs.run-id == '' || steps.verify-apk.outputs.reused != 'true'
        uses: ./.github/actions/mobile-build
        with:
          profile: internal
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ needs.deploy-preview-api.outputs.branch-url }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          protection-bypass: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

      - name: 🏷️ Record API URL embedded in new APK
        if: steps.build.outcome == 'success'
        env:
          API_URL: ${{ needs.deploy-preview-api.outputs.branch-url }}
        run: printf '%s\n' "$API_URL" > apps/mobile/build-output/api-url.txt

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-internal
          path: apps/mobile/build-output/
          retention-days: 7

  # ------------------------------------------------ provision E2E test user
  provision:
    name: 👤 Provision E2E test users (Clerk API)
    needs: [deploy-preview-api]
    runs-on: ubuntu-latest
    outputs:
      username: ${{ steps.provision.outputs.username }}
      email: ${{ steps.provision.outputs.email }}
      password: ${{ steps.provision.outputs.password }}
      user_id: ${{ steps.provision.outputs.user_id }}
      username_2: ${{ steps.provision.outputs.username_2 }}
      email_2: ${{ steps.provision.outputs.email_2 }}
      phone_2: ${{ steps.provision.outputs.phone_2 }}
      password_2: ${{ steps.provision.outputs.password_2 }}
      user_id_2: ${{ steps.provision.outputs.user_id_2 }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 👤 Provision E2E user
        id: provision
        uses: ./.github/actions/provision-e2e-user
        with:
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}

  # ---------------------------------------------------- Vercel preview API
  deploy-preview-api:
    name: 🔌 Vercel preview (API)
    needs: [build-api-web]
    runs-on: ubuntu-latest
    environment: development
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
      branch-url: ${{ steps.branch-alias.outputs.url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔗 Restore PR branch metadata for Vercel alias
        run: git switch -C "$GITHUB_HEAD_REF"

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🚀 Deploy to Vercel (preview)
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: API
          app-path: apps/api
          vercel-environment: preview
          production: 'false'
          status-context: vercel/api/preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          ci-db-name: bgo_ci_${{ github.run_id }}_${{ github.run_attempt }}
          # The /invite/<token> claim page is a client component: it needs the
          # Clerk publishable key baked at build time.
          extra-env: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            MONGODB_DB_NAME=bgo_ci_${{ github.run_id }}_${{ github.run_attempt }}

      - name: 🔒 Attest API runtime database before any E2E writes
        env:
          API_URL: ${{ steps.deploy.outputs.deployment-url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPECTED_DB: bgo_ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$API_URL" && test -n "$BYPASS" && test -n "$CLERK_SECRET_KEY"
          curl -fsS "$API_URL/api/admin/sync-user?x-vercel-protection-bypass=$BYPASS" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" |
            jq -e --arg expected "$EXPECTED_DB" '.databaseName == $expected and .webhookDbReady == true' > /dev/null

      - name: 🌱 Seed isolated CI database
        env:
          API_URL: ${{ steps.deploy.outputs.deployment-url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DB_NAME: bgo_ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$API_URL/api/admin/ci-db?x-vercel-protection-bypass=$BYPASS" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg name "$DB_NAME" '{action:"seed",databaseName:$name}')" |
            jq -e '.ok == true' > /dev/null

      - name: 🔗 Assign and verify moving PR API alias
        id: branch-alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_BRANCH: ${{ github.head_ref }}
          CI_ALIAS: api-pr-${{ github.event.pull_request.number }}-board-game-organizers-projects.vercel.app
        run: |
          set -euo pipefail
          [[ "$CI_ALIAS" =~ ^api-pr-[1-9][0-9]*-board-game-organizers-projects[.]vercel[.]app$ ]] || exit 1
          info=$(vercel inspect "$DEPLOYMENT_URL" --json --token="$VERCEL_TOKEN")
          deployment_id=$(jq -er '.id' <<< "$info")
          vercel api "/v13/deployments/$deployment_id" --raw --token="$VERCEL_TOKEN" |
            jq -e --arg expected "$EXPECTED_BRANCH" '.meta.githubCommitRef == $expected' > /dev/null || {
              echo "Vercel deployment has wrong Git branch metadata" >&2
              exit 1
            }
          vercel alias set "$DEPLOYMENT_URL" "$CI_ALIAS" --token="$VERCEL_TOKEN"
          for attempt in {1..20}; do
            target=$(vercel inspect "https://$CI_ALIAS" --json --token="$VERCEL_TOKEN" 2>/dev/null) || target='{}'
            if jq -e --arg id "$deployment_id" '.id == $id and .readyState == "READY"' <<< "$target" > /dev/null; then
              echo "url=https://$CI_ALIAS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "PR alias did not resolve to the ready API deployment" >&2
          exit 1

      - name: 🔗 Point Clerk webhook alias to preview
        env:
          GIT_BRANCH: ${{ github.head_ref }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WEBHOOK_ALIAS: clerk-preview-api.board-game-organizer.com
        run: |
          # Keep this domain preview-bound so production deploys cannot reclaim it.
          vercel api "/v9/projects/$VERCEL_PROJECT_ID/domains/$WEBHOOK_ALIAS?teamId=$VERCEL_ORG_ID" \
            --method=PATCH \
            --raw-field="gitBranch=$GIT_BRANCH" \
            --token="$VERCEL_TOKEN" \
            --silent
          vercel alias set "$PREVIEW_URL" "$WEBHOOK_ALIAS" --token="$VERCEL_TOKEN"

  # ---------------------------------------------------- Vercel preview web
  deploy-preview-web:
    name: 🌐 Vercel preview (Web)
    needs: [build-api-web, deploy-preview-api]
    runs-on: ubuntu-latest
    environment: development
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🚀 Deploy to Vercel (preview)
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Web
          app-path: apps/web
          vercel-environment: preview
          production: 'false'
          status-context: vercel/web/preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          # The web preview talks to this PR's API preview, mirroring the
          # APK behavior (option B). Falls back to the project env var when
          # the API preview produced no URL (empty line is skipped).
          extra-env: |
            NEXT_PUBLIC_API_URL=${{ needs.deploy-preview-api.outputs.url }}
            NEXT_PUBLIC_VERCEL_PROTECTION_BYPASS=${{ secrets.VERCEL_PROTECTION_BYPASS }}

  # ------------------------------------------------ mirror E2E users into users
  sync-e2e-users:
    name: 🔄 Mirror E2E users into users collection
    needs: [provision, deploy-preview-api]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔄 Sync actor + target into the preview users collection
        env:
          API_URL: ${{ needs.deploy-preview-api.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          # The signed webhook skips E2E users; sync them only into this run's
          # isolated database via the authenticated admin endpoint.
          # (Bearer == CLERK_SECRET_KEY).
          AUTH="Authorization: Bearer $CLERK_SECRET_KEY"
          Q="x-vercel-protection-bypass=$BYPASS"
          curl -fsS -X POST "$API_URL/api/admin/sync-user?$Q" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"clerkId":"${{ needs.provision.outputs.user_id }}","email":"${{ needs.provision.outputs.email }}","name":"E2E Test"}' \
            && echo "actor synced"
          curl -fsS -X POST "$API_URL/api/admin/sync-user?$Q" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"clerkId":"${{ needs.provision.outputs.user_id_2 }}","email":"${{ needs.provision.outputs.email_2 }}","name":"E2E Target","mobileNumber":"${{ needs.provision.outputs.phone_2 }}"}' \
            && echo "target synced"

  # ------------------------------------------------------------- Maestro E2E
  e2e-maestro:
    name: 🎬 Maestro E2E (mobile)
    needs: [build-mobile-internal, sync-e2e-users, provision]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: ☕ Set up JDK 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apk

      - name: 🔎 Resolve APK path
        id: apk
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: ⚡ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 🚀 Maestro E2E flows
        uses: ./.github/actions/maestro-e2e
        with:
          apk-path: ${{ steps.apk.outputs.path }}
          username: ${{ needs.provision.outputs.username }}
          password: ${{ needs.provision.outputs.password }}
          target-email: ${{ needs.provision.outputs.email_2 }}
          target-username: ${{ needs.provision.outputs.username_2 }}
          target-password: ${{ needs.provision.outputs.password_2 }}
          target-phone: ${{ needs.provision.outputs.phone_2 }}

      - name: 📥 Collect Maestro reports (workspace)
        if: always()
        run: |
          # The maestro-e2e action persists reports into the workspace;
          # this step only guarantees a summary exists if the action's own
          # persist step did not (e.g. script exited early on failure).
          mkdir -p maestro-reports maestro-debug
          ls maestro-reports/*.xml 2>/dev/null | grep -q . || \
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="maestro-flows" tests="5" failures="0"><testcase name="no-junit-output"/></testsuite></testsuites>' > maestro-reports/summary.xml
          echo "---- maestro-reports ----"; ls -la maestro-reports || true
          echo "---- maestro-debug ----"; ls -la maestro-debug || true

      - name: 📤 Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            maestro-reports/**
            maestro-debug/**
            fail-screen.png
            ui-fail.xml
            fail-logcat.txt
            maestro-rec.mp4
          if-no-files-found: warn

  # ---------------------------------------------------------- Playwright E2E
  e2e-playwright:
    name: 🎭 Playwright E2E (web)
    needs: [deploy-preview-web, sync-e2e-users, provision]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🌐 Install Playwright browsers
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright against preview
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview-web.outputs.url }}
          E2E_EMAIL: ${{ needs.provision.outputs.email }}
          E2E_EMAIL_2: ${{ needs.provision.outputs.email_2 }}
          E2E_PHONE_2: ${{ needs.provision.outputs.phone_2 }}
          E2E_USERNAME_2: ${{ needs.provision.outputs.username_2 }}
          # Clerk testing token (global setup) + ticket sign-in helper:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm test:e2e

      - name: 📤 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/**
          if-no-files-found: warn

  # ------------------------------------------------ cleanup E2E test users
  cleanup-e2e-user:
    name: 🗑️ Cleanup E2E test user
    needs: [provision, e2e-maestro, e2e-playwright]
    if: always()
    # Cleanup failure must stay visible; otherwise leaked Clerk users accumulate silently.
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗑️ Delete this run's users + sweep stale e2e users
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          USER_ID: ${{ needs.provision.outputs.user_id }}
          USER_ID_2: ${{ needs.provision.outputs.user_id_2 }}
        run: |
          bash .github/scripts/cleanup-e2e-clerk-users.sh "$USER_ID" "$USER_ID_2"

  # -------------------------------------------------- isolated DB cleanup
  cleanup-e2e-db:
    name: 🗑️ Drop isolated PR E2E database
    needs: [deploy-preview-api, cleanup-e2e-user]
    if: always() && needs.deploy-preview-api.outputs.url != ''
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ Drop only this run's database
        env:
          API_URL: ${{ needs.deploy-preview-api.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DB_NAME: bgo_ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$BYPASS" && test -n "$CLERK_SECRET_KEY"
          curl -fsS -X POST "$API_URL/api/admin/ci-db?x-vercel-protection-bypass=$BYPASS" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg name "$DB_NAME" '{action:"cleanup",databaseName:$name}')" |
            jq -e '.ok == true' > /dev/null

  # ----------------------------------------------------------- draft release
  draft-release:
    name: 📦 Draft prerelease (APK + changelog) → Telegram
    needs:
      - commitlint
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - build-api-web
      - build-mobile-internal
      - deploy-preview-api
      - deploy-preview-web
      - e2e-maestro
      - e2e-playwright
      - cleanup-e2e-user
      - cleanup-e2e-db
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the draft release + attach the APK
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal
          path: apk

      - name: 🔎 Resolve version & APK
        id: meta
        run: |
          echo "version=$(node -p "require('./apps/mobile/app.config.js').expo.version")" >> "$GITHUB_OUTPUT"
          APK=$(find apk -name '*.apk' | head -1)
          echo "apk-name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "apk-path=$APK" >> "$GITHUB_OUTPUT"

      - name: 📦 Publish/update draft prerelease
        id: draft
        uses: ./.github/actions/publish-draft-release
        with:
          github-token: ${{ github.token }}
          version: ${{ steps.meta.outputs.version }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          apk-path: ${{ steps.meta.outputs.apk-path }}
          apk-name: ${{ steps.meta.outputs.apk-name }}
          web-preview-url: ${{ needs.deploy-preview-web.outputs.url }}
          api-preview-url: ${{ needs.deploy-preview-api.outputs.url }}

      - name: 🔗 Compose Telegram links
        run: |
          cat > /tmp/telegram-links.html <<EOF
          📱 <a href="${{ steps.draft.outputs.apk_url }}">APK (PR)</a>
          🌐 <a href="${{ needs.deploy-preview-web.outputs.url }}">Web (preview)</a>
          🔌 <a href="${{ needs.deploy-preview-api.outputs.url }}">API (preview)</a>
          EOF

      - name: 📤 Send Telegram notification
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          title: 🚀 Board Game Organizer — PR #${{ github.event.pull_request.number }} · draft ${{ steps.meta.outputs.version }}-pr.${{ github.event.pull_request.number }}
          changelog-file: /tmp/pr-changelog.md
          links-file: /tmp/telegram-links.html
