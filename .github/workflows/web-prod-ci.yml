name: Web Production CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: web-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: 🔍 Conventional Commits
    uses: ./.github/workflows/reusable-conventional-commits.yml

  test:
    name: 🧪 Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      project-name: web

  vercel-production:
    name: 🚀 Vercel Production
    runs-on: ubuntu-latest
    needs: [conventional-commits, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Production)
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: 📝 Post Production URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.preview-url }}';
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: url.includes('://') ? url : `https://${url}`,
              description: 'Web deployed to production',
              context: 'vercel/production'
            });