name: 🧪 Tests

on:
  workflow_call:
    inputs:
      project-name:
        description: pnpm filter name (mobile, web, api)
        required: true
        type: string

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 Run tests
        run: pnpm --filter ${{ inputs.project-name }} test
