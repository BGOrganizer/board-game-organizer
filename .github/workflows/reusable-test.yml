name: 🧪 Tests

on:
  workflow_call:
    inputs:
      project-name:
        description: 'The pnpm filter name (e.g. mobile, web, api)'
        required: true
        type: string

jobs:
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: 🧩 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm --filter ${{ inputs.project-name }} test