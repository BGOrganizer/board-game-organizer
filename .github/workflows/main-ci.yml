name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-vercel:
    name: Check Vercel deploy availability
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    timeout-minutes: 2
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Check Vercel account
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node .github/scripts/vercel-deploy-preflight.mjs

  # Every merged commit gets its own verification run; only release preparation
  # is serialized. GitHub can replace a pending run in a concurrency group.
  quality:
    name: Lint, typecheck and CI contracts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun

      - name: 🧹 Biome
        run: bun run lint

      - name: 🧪 TypeScript
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: 🔒 CI isolation contract
        if: ${{ !cancelled() }}
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/release/*format.mjs' --test-coverage-lines=90 --test-coverage-functions=90 --test-coverage-branches=90 .github/scripts/__tests__/*.test.mjs

  coverage:
    name: Unit tests and coverage (${{ matrix.app }})
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ (matrix.app == 'schemas' || matrix.app == 'shared' || matrix.app == 'mcp') && format('@board-game-organizer/{0}', matrix.app) || matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, web, api, schemas, shared, mcp]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun

      - name: 🧪 Vitest with coverage
        run: bun run --filter "$WORKSPACE" test:coverage

      - name: 🔏 Verify Codecov signing key
        id: codecov-key
        run: bash .github/scripts/prepare-codecov-key.sh

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          disable_search: true
          files: ${{ (matrix.app == 'schemas' || matrix.app == 'shared') && format('packages/{0}/coverage/lcov.info', matrix.app) || format('apps/{0}/coverage/lcov.info', matrix.app) }}
          flags: unit,${{ matrix.app }}
          fail_ci_if_error: true
      - name: 📤 Preserve unit coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}-main
          path: ${{ (matrix.app == 'schemas' || matrix.app == 'shared') && format('packages/{0}/coverage/**', matrix.app) || format('apps/{0}/coverage/**', matrix.app) }}
          if-no-files-found: warn

  native-tooling:
    name: Native tooling and flow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: ☕ Set up pinned CLI's Java 17 runtime
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 🔎 Validate tracked Bash and Python syntax
        if: ${{ !cancelled() }}
        run: |
          result=0
          while IFS= read -r -d '' script; do
            bash -n "$script" || result=1
          done < <(git ls-files -z '*.sh')
          python3 - <<'PYTHON'
          import ast
          import pathlib
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.py']).decode().split('\0')
          errors = []
          for file in filter(None, files):
              try:
                  ast.parse(pathlib.Path(file).read_text(), filename=file)
              except SyntaxError as error:
                  errors.append(str(error))
          if errors:
              raise SystemExit('\n'.join(errors))
          PYTHON
          exit "$result"
      - name: 📥 Install the project-pinned Maestro CLI
        id: maestro
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        run: bash scripts/maestro.sh --install
      - name: 🧪 Parse every Maestro flow without executing E2E
        if: ${{ !cancelled() && steps.maestro.outcome == 'success' }}
        run: bash .github/scripts/check-maestro-syntax.sh
      - name: 🔎 Verify the project-pinned Perfetto CLI
        if: ${{ !cancelled() }}
        run: |
          bash scripts/performance/perfetto.sh --install
          bash scripts/performance/perfetto.sh --version

  render-performance:
    name: React render performance (${{ matrix.app }})
    # Reassure measurements are paused by explicit operator request; retain the full definition.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, mobile]
    env:
      WORKSPACE: ${{ matrix.app }}
      BASELINE_CHECKOUT_REF: ${{ github.event.before }}
      CANDIDATE_SHA: ${{ github.sha }}
      RENDER_RUNNER_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun
      - name: 📥 Checkout approved render baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASELINE_CHECKOUT_REF }}
          path: .perf-baseline
          persist-credentials: false
          fetch-depth: 1
      - name: 📦 Prepare baseline dependencies before measuring
        working-directory: .perf-baseline
        run: |
          if [ -f "apps/$WORKSPACE/performance/vitest.config.ts" ] || [ -f "apps/$WORKSPACE/performance/vitest.config.mts" ]; then
            bun install --frozen-lockfile
          fi
      - name: 🧪 Reassure full render suite
        if: ${{ !cancelled() }}
        run: |
          BASELINE_ROOT="$GITHUB_WORKSPACE/.perf-baseline"
          BASELINE_SHA="$(git -C "$BASELINE_ROOT" rev-parse HEAD)"
          node scripts/performance/run-render-pair.mjs \
            --candidate-root "$GITHUB_WORKSPACE" \
            --baseline-root "$BASELINE_ROOT" \
            --app "$WORKSPACE" \
            --baseline-ref "$BASELINE_SHA" \
            --current-ref "$CANDIDATE_SHA" \
            --output-dir "$GITHUB_WORKSPACE/.reassure-pair/$WORKSPACE" \
            --runner-id "$RENDER_RUNNER_ID"
      - name: 📤 Preserve actual render measurements
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: reassure-${{ matrix.app }}-main
          path: |
            .reassure-pair/${{ matrix.app }}/**
            apps/${{ matrix.app }}/.reassure/current.perf
            apps/${{ matrix.app }}/.reassure/*.rows.json
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: Integration tests (API)
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun

      - name: 🐳 Run API integration tests
        run: bun run --filter api test:integration --coverage
      - name: 🔏 Verify Codecov signing key
        run: bash .github/scripts/prepare-codecov-key.sh
      - name: 📤 Upload integration coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          disable_search: true
          files: apps/api/coverage/lcov.info
          flags: integration
          fail_ci_if_error: true
      - name: 📤 Preserve integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-integration-main
          path: apps/api/coverage/**
          if-no-files-found: warn
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app:
          - api
          - web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun
      - name: 🏗️ Verify app build
        run: bun run --filter ${{ matrix.app }} build

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun
      - name: 🧪 Site unit tests and coverage
        run: bun run --filter site test:coverage
      - name: 🏗️ Build Site
        run: bun run --filter site build

  deploy-production-site:
    name: Deploy Site to Vercel (Production)
    needs: [quality, build-site, check-vercel]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' && needs.build-site.result == 'success'
        && needs.check-vercel.outputs.status != 'blocked' }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    outputs:
      site-url: ${{ steps.deploy.outputs.deployment-url }}
      ready: ${{ steps.smoke.outputs.ready }}
    concurrency:
      group: production-site
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - name: 📥 Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 🚀 Deploy Site to Vercel (production)
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Site
          app-path: apps/site
          vercel-environment: production
          production: 'true'
          status-context: vercel/site/production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
          extra-env: NEXT_PUBLIC_BGO_WEB_ORIGIN=https://app.board-game-organizer.com

      - name: Verify this Vercel Site deployment
        id: smoke
        if: steps.deploy.outputs.deployment-url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          [[ "$SITE_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          auth=()
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            auth+=(--get --data-urlencode "x-vercel-protection-bypass=$VERCEL_PROTECTION_BYPASS")
          fi
          status=$(curl --silent --show-error --max-time 30 --retry 2 --output /dev/null \
            --write-out '%{http_code}' "${auth[@]}" "$SITE_URL/")
          [[ "$status" =~ ^2[0-9]{2}$ ]]
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

  deploy-production-mcp-gateway:
    name: Deploy MCP gateway to Vercel (Production)
    needs: [quality, coverage, check-vercel]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' && needs.coverage.result == 'success'
        && needs.check-vercel.outputs.status != 'blocked' }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    outputs:
      failed: ${{ steps.deploy.outcome == 'failure' }}
    concurrency:
      group: production-mcp-gateway
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout verified Main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🚀 Deploy Production gateway
        id: deploy
        uses: ./.github/actions/mcp-gateway-deploy
        with:
          target: production
          project-id: ${{ vars.VERCEL_MCP_GATEWAY_PROJECT_ID }}
          base-sha: ${{ github.event.before }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

  # Release bump/tag only after every merged-code quality, coverage and build gate succeeds.
  release:
    name: Prepare version and tag
    environment: production
    needs:
      - quality
      - coverage
      - integration-tests
      - native-tooling
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: main-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      published: ${{ steps.meta.outputs.published }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: 📥 Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun

      - name: 🔒 Release only latest validated main commit
        id: current
        run: node .github/scripts/main-release-preparation.mjs

      - name: 🔑 Configure push credentials (release PAT bypasses branch protection)
        if: steps.current.outputs.mode == 'prepare'
        # actions/checkout sets an Authorization extraheader that OVERRIDES the
        # credentials embedded in the URL — the push would authenticate as the
        # workflow bot (no bypass). Remove it and set the remote URL with the
        # admin RELEASE_PAT so semantic-release's push is attributed to it.
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          test -n "$RELEASE_PAT"
          test "$(GH_TOKEN="$RELEASE_PAT" gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.admin')" = true
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@bgo.dev"

      - name: 🚀 Run semantic-release (SKIP_PUBLISH — release created after the gates)
        if: steps.current.outputs.mode == 'prepare'
        env:
          # Git authentication retries must use the same release identity as origin.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          SKIP_PUBLISH: "true"
        run: bun run release

      - name: 🔎 Resolve release info
        id: meta
        run: node .github/scripts/main-release-preparation.mjs
    permissions:
      contents: write

  deploy-netlify-production-api:
    name: Deploy API to Netlify (Production)
    needs: [release, check-vercel, deploy-production-web, deploy-production-mcp-gateway]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.sha != ''
        && (needs.check-vercel.outputs.status == 'blocked'
          || needs.deploy-production-mcp-gateway.outputs.failed == 'true'
          || needs.deploy-production-mcp-gateway.result == 'failure'
          || (needs.release.outputs.published == 'true' && needs.deploy-production-web.outputs.ready != 'true')) }}
    uses: ./.github/workflows/netlify-deploy.yml
    with:
      target: production
      component: api
      source-sha: ${{ github.sha }}
      release-sha: ${{ needs.release.outputs.published == 'true' && needs.release.outputs.sha || '' }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  deploy-netlify-production-web:
    name: Deploy Web to Netlify (Production)
    needs: [release, check-vercel, deploy-production-web, deploy-netlify-production-api]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.deploy-netlify-production-api.outputs.api-url != ''
        && (needs.check-vercel.outputs.status == 'blocked'
          || (needs.release.outputs.published == 'true' && needs.deploy-production-web.outputs.ready != 'true')) }}
    uses: ./.github/workflows/netlify-deploy.yml
    with:
      target: production
      component: web
      source-sha: ${{ github.sha }}
      release-sha: ${{ needs.release.outputs.published == 'true' && needs.release.outputs.sha || '' }}
      api-url: ${{ needs.deploy-netlify-production-api.outputs.api-url }}
      api-client-url: ${{ needs.deploy-netlify-production-api.outputs.api-client-url }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-netlify-production-site:
    name: Deploy Site to Netlify (Production)
    needs: [quality, build-site, deploy-production-site]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' && needs.build-site.result == 'success'
        && needs.deploy-production-site.outputs.ready != 'true' }}
    uses: ./.github/workflows/netlify-deploy.yml
    with:
      target: production
      component: site
      source-sha: ${{ github.sha }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-netlify-production-mcp:
    name: Deploy MCP gateway to Netlify (Production)
    needs: [release, check-vercel, deploy-production-web, deploy-production-mcp-gateway, deploy-netlify-production-api]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.deploy-netlify-production-api.outputs.api-url != ''
        && (needs.check-vercel.outputs.status == 'blocked'
          || needs.deploy-production-mcp-gateway.outputs.failed == 'true'
          || needs.deploy-production-mcp-gateway.result == 'failure'
          || (needs.release.outputs.published == 'true' && needs.deploy-production-web.outputs.ready != 'true')) }}
    uses: ./.github/workflows/netlify-deploy.yml
    with:
      target: production
      component: mcp
      source-sha: ${{ github.sha }}
      release-sha: ${{ needs.release.outputs.published == 'true' && needs.release.outputs.sha || '' }}
      api-url: ${{ needs.deploy-netlify-production-api.outputs.api-url }}
      api-client-url: ${{ needs.deploy-netlify-production-api.outputs.api-client-url }}
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  build-apk:
    name: Build APK (Production)
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # A fresh eas build --local from a cold cache (cache key changes after the
    # semantic-release bump touches package.json) takes ~1.5h on GitHub
    # runners — 90 minutes was too tight and cancelled the build during
    # packageRelease. 180 minutes gives the cold build headroom; follow-up
    # builds reuse the EAS/gradle caches and finish much faster.
    timeout-minutes: 180
    steps:
      - name: 📥 Checkout pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: 🔒 Require the Production Clerk public key
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { requireClerkTarget } from './.github/scripts/clerk-target.mjs';
          requireClerkTarget('production', process.env.CLERK_PUBLISHABLE_KEY, 'pk');
          if (process.env.API_URL !== 'https://api.board-game-organizer.com') {
            throw new Error('Production API must use its canonical public URL');
          }
          NODE
      - name: 🏗️ Build APK (eas build --local, internal profile)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          profile: internal
          app-environment: production
          update-channel: production
          expo-token: ${{ secrets.EXPO_TOKEN }}
          # Production build: the released APK must talk to the LIVE Clerk
          # instance (pk_live). The pk_test variable stays for preview builds
          # (PR builds).
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          maptiler-api-key: ${{ vars.EXPO_PUBLIC_MAPTILER_API_KEY }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - name: 🔒 Record production APK provenance
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          printf '%s\n' "$RELEASE_SHA" > apps/mobile/build-output/source-head.txt
          printf '%s\n' https://api.board-game-organizer.com > apps/mobile/build-output/api-url.txt
          (cd apps/mobile/build-output && sha256sum --check apk.sha256)

      - name: 📤 Upload verified production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-internal-main
          path: apps/mobile/build-output/
          retention-days: 7
          if-no-files-found: error
    environment: production

  deploy-production-api:
    name: Deploy API to Vercel (Production)
    needs: [release, build-apk, check-vercel]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.build-apk.result == 'success'
        && needs.release.outputs.published == 'true' && needs.check-vercel.outputs.status != 'blocked' }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    outputs:
      api-url: ${{ steps.deploy.outcome == 'success' && steps.deploy.outputs.deployment-url || '' }}
    steps:
      - name: 📥 Checkout pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: 🔒 Ensure this release is still latest
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: 🚀 Deploy Production API to Vercel
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: API
          app-path: apps/api
          vercel-environment: production
          production: 'true'
          status-context: vercel/api/production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
    permissions:
      contents: read
      statuses: write

  deploy-production-web:
    name: Deploy Web to Vercel (Production)
    needs: [release, build-apk, check-vercel, deploy-production-api]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.build-apk.result == 'success'
        && needs.release.outputs.published == 'true' && needs.check-vercel.outputs.status != 'blocked'
        && needs.deploy-production-api.outputs.api-url != '' }}
    runs-on: ubuntu-latest
    environment: production
    continue-on-error: true
    outputs:
      web-url: ${{ steps.smoke.outputs.provider == 'vercel' && steps.deploy.outputs.deployment-url || '' }}
      ready: ${{ steps.smoke.outputs.provider == 'vercel' }}
    steps:
      - name: 📥 Checkout pinned release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: 🔒 Ensure this release is still latest
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: 🚀 Deploy Production Web to Vercel
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Web
          app-path: apps/web
          vercel-environment: production
          production: 'true'
          status-context: vercel/web/production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          extra-env: NEXT_PUBLIC_API_URL=https://api.board-game-organizer.com
      - name: 🔎 Read-only Vercel Production smoke
        id: smoke
        env:
          TARGET: production
          VERCEL_API_URL: ${{ needs.deploy-production-api.outputs.api-url }}
          VERCEL_WEB_URL: ${{ steps.deploy.outputs.deployment-url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: node .github/scripts/select-deploy-provider.mjs
    permissions:
      contents: read
      statuses: write

  select-production-deployment:
    name: Verify selected Production deployment
    needs: [release, check-vercel, deploy-production-api, deploy-production-web, deploy-netlify-production-api, deploy-netlify-production-web]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.sha != ''
        && (needs.release.outputs.published == 'true' || needs.check-vercel.outputs.status == 'blocked') }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      provider: ${{ steps.select.outputs.provider }}
      api-url: ${{ steps.select.outputs.api-url }}
      web-url: ${{ steps.select.outputs.web-url }}
    steps:
      - name: 📥 Checkout pinned Main source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: 🔎 Select Production provider and run read-only smoke
        id: select
        env:
          TARGET: production
          VERCEL_API_URL: ${{ needs.deploy-production-api.outputs.api-url }}
          VERCEL_WEB_URL: ${{ needs.deploy-production-web.outputs.web-url }}
          VERCEL_VERIFIED: ${{ needs.deploy-production-web.outputs.ready }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          NETLIFY_API_URL: ${{ needs.deploy-netlify-production-api.outputs.api-url }}
          NETLIFY_API_CLIENT_URL: ${{ needs.deploy-netlify-production-api.outputs.api-client-url }}
          NETLIFY_WEB_URL: ${{ needs.deploy-netlify-production-web.outputs.web-url }}
          NETLIFY_WEB_CLIENT_URL: ${{ needs.deploy-netlify-production-web.outputs.web-client-url }}
        run: node .github/scripts/select-deploy-provider.mjs

  select-production-site:
    name: Verify selected Production Site
    needs: [quality, build-site, deploy-production-site, deploy-netlify-production-site]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.build-site.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      provider: ${{ steps.select.outputs.provider }}
      url: ${{ steps.select.outputs.url }}
    steps:
      - name: 📥 Checkout merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: 🔎 Check Site on Vercel, then Netlify if needed
        id: select
        env:
          VERCEL_SITE_URL: ${{ needs.deploy-production-site.outputs.site-url }}
          VERCEL_SITE_READY: ${{ needs.deploy-production-site.outputs.ready }}
          NETLIFY_SITE_URL: ${{ needs.deploy-netlify-production-site.outputs.site-url }}
        run: |
          set -euo pipefail
          result=0
          node .github/scripts/check-site-main.mjs "$GITHUB_REF" "$GITHUB_SHA" || result=$?
          if [ "$result" = 3 ]; then exit 0; fi
          test "$result" = 0
          if [ "$VERCEL_SITE_READY" = true ] && [[ "$VERCEL_SITE_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
            printf 'provider=vercel\nurl=%s\n' "$VERCEL_SITE_URL" >> "$GITHUB_OUTPUT"
            printf 'Production Site verified on Vercel at %s\n' "$VERCEL_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$NETLIFY_SITE_URL" =~ ^https://[a-f0-9]{24}--bgo-site-production\.netlify\.app$ ]]; then
            printf 'provider=netlify\nurl=%s\n' "$NETLIFY_SITE_URL" >> "$GITHUB_OUTPUT"
            printf 'Production Site verified on Netlify at %s\n' "$NETLIFY_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No current Production Site deploy passed smoke.\n' >&2
            exit 1
          fi

  switch-production-dns:
    name: Route verified Production deployments in Cloudflare
    needs: [release, select-production-deployment, select-production-site]
    if: >-
      ${{ !cancelled()
        && needs.release.result == 'success' && needs.release.outputs.sha != ''
        && needs.select-production-deployment.result == 'success'
        && needs.select-production-deployment.outputs.provider != ''
        && needs.select-production-deployment.outputs.api-url != ''
        && needs.select-production-deployment.outputs.web-url != ''
        && needs.select-production-site.result == 'success'
        && needs.select-production-site.outputs.provider != ''
        && needs.select-production-site.outputs.url != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-dns
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout validated Main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - name: Verify and route current Production deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PRODUCTION_PROVIDER: ${{ needs.select-production-deployment.outputs.provider }}
          PRODUCTION_API_URL: ${{ needs.select-production-deployment.outputs.api-url }}
          PRODUCTION_WEB_URL: ${{ needs.select-production-deployment.outputs.web-url }}
          PRODUCTION_SITE_PROVIDER: ${{ needs.select-production-site.outputs.provider }}
          PRODUCTION_SITE_URL: ${{ needs.select-production-site.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          VERCEL_SITE_PROJECT_ID: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TEAM_SLUG: ${{ vars.NETLIFY_TEAM_SLUG }}
        run: |
          set -euo pipefail
          result=0
          node .github/scripts/check-site-main.mjs "$GITHUB_REF" "$GITHUB_SHA" || result=$?
          if [ "$result" = 3 ]; then exit 0; fi
          test "$result" = 0
          node .github/scripts/switch-production-dns.mjs

  publish-release:
    name: Publish release v${{ needs.release.outputs.version }}
    needs:
      - release
      - build-apk
      - select-production-deployment
    if: >-
      ${{ !cancelled()
        && needs.release.result == 'success'
        && needs.build-apk.result == 'success'
        && needs.select-production-deployment.result == 'success'
        && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-publication-${{ needs.release.outputs.sha }}
      cancel-in-progress: false
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      apk_url: ${{ steps.publish.outputs.apk_url }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
      eas_build_url: ${{ steps.eas.outputs.url }}
    steps:
      - name: 📥 Checkout pinned release commit (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal-main
          path: apk
      - name: 🔒 Verify production APK provenance and current release
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(cat apk/source-head.txt)" = "$RELEASE_SHA"
          test "$(cat apk/api-url.txt)" = https://api.board-game-organizer.com
          test "$(find apk -maxdepth 1 -name '*.apk' | wc -l)" = 1
          (cd apk && sha256sum --check apk.sha256)

      - name: ☁️ Upload verified production APK to EAS
        id: eas
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_UPDATE_CHANNEL: production
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          APK=$(find "$GITHUB_WORKSPACE/apk" -name '*.apk' -print -quit)
          test -n "$APK"
          bun add --global eas-cli@27.7.2
          node ../../.github/scripts/eas-upload.mjs "$APK"

      - name: 📦 Stage release notes, verified APK and MCP package before OTA
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          EAS_BUILD_URL: ${{ steps.eas.outputs.url }}
        run: node .github/scripts/main-release-publication.mjs stage

      - name: 📡 Publish verified Production OTA
        if: steps.prepare.outputs.already_published != 'true'
        uses: ./.github/actions/mobile-update
        with:
          source-sha: ${{ needs.release.outputs.sha }}
          app-environment: production
          update-channel: production
          expo-token: ${{ secrets.EXPO_TOKEN }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          maptiler-api-key: ${{ vars.EXPO_PUBLIC_MAPTILER_API_KEY }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: 🚀 Publish verified production release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          EAS_BUILD_URL: ${{ steps.eas.outputs.url }}
        run: node .github/scripts/main-release-publication.mjs publish

      - name: 🗑️ Delete the merged PR draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # HEAD~1 is the merge commit of the PR that triggered this run.
          MSG=$(git log -1 --format=%s HEAD~1)
          PR=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$PR" ]; then echo "No PR number in merge message — skip draft deletion"; exit 0; fi
          FOUND=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r --arg suffix "-pr.$PR" '.[] | select(.draft == true and (.tag_name | endswith($suffix))) | .id')
          if [ -n "$FOUND" ]; then
            for rel_id in $FOUND; do
              echo "Deleting draft $rel_id (merged PR #$PR)"
              curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id" -w "HTTP %{http_code}\n"
            done
          else
            echo "No draft for PR #$PR — nothing to delete"
          fi
    permissions:
      contents: write
      pull-requests: read
    environment: production

  notify-telegram:
    name: Notify Telegram
    needs: [release, publish-release, select-production-deployment]
    if: >-
      ${{ !cancelled()
        && needs.release.result == 'success'
        && needs.publish-release.result == 'success'
        && needs.select-production-deployment.result == 'success'
        && needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.release.outputs.sha }}

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-bun
        with:
          install: 'false'

      - name: 🔒 Notify only the current production release
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: 📖 Read pinned release changelog
        run: |
          set -euo pipefail
          git log -1 --format=%b > /tmp/changelog.md

      - name: 📤 Send Telegram notification
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app-environment: production
          version: ${{ needs.release.outputs.version }}
          pr-number: ${{ needs.publish-release.outputs.pr_number }}
          release-url: ${{ needs.publish-release.outputs.release_url }}
          apk-url: ${{ needs.publish-release.outputs.apk_url }}
          web-url: https://board-game-organizer.com
          changelog-file: /tmp/changelog.md
    environment: production
