name: 🚀 Main CI/CD (bump → build → E2E → publish release → Telegram)

on:
  push:
    branches: [main]

permissions:
  contents: write # semantic-release commits the bump; publish-release creates the release
  statuses: write # vercel-deploy / github-script sets commit status for production

concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------- bump (no release)
  release:
    name: 📦 semantic-release (bump + changelog, no publish)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      published: ${{ steps.meta.outputs.published }}
    steps:
      - name: 📥 Checkout (full history for semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔑 Configure push credentials (release PAT bypasses branch protection)
        # actions/checkout sets an Authorization extraheader that OVERRIDES the
        # credentials embedded in the URL — the push would authenticate as the
        # workflow bot (no bypass). Remove it and set the remote URL with the
        # admin RELEASE_PAT so semantic-release's push is attributed to it.
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@bgo.dev"

      - name: 🚀 Run semantic-release (SKIP_PUBLISH — release created after the gates)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_PUBLISH: "true"
        run: pnpm release

      - name: 🔎 Resolve release info
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.config.js').expo.version")
          LAST=$(git log -1 --format=%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$LAST" | grep -q '^chore(release):'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new version: $VERSION (bump committed: $LAST)"

  # -------------------------------------------------- coverage upload (Codecov)
  coverage:
    name: 📊 Coverage upload (Codecov)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, web, api]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🧪 Vitest with coverage
        run: pnpm --filter ${{ matrix.app }} test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/${{ matrix.app }}/coverage/lcov.info
          flags: unit,${{ matrix.app }}
          fail_ci_if_error: false

  # -------------------------------------------------- mobile internal APK (build only)
  build-apk:
    name: 📱 Build APK (internal)
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # A fresh eas build --local from a cold cache (cache key changes after the
    # semantic-release bump touches package.json) takes ~1.5h on GitHub
    # runners — 90 minutes was too tight and cancelled the build during
    # packageRelease. 180 minutes gives the cold build headroom; follow-up
    # builds reuse the EAS/gradle caches and finish much faster.
    timeout-minutes: 180
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔄 Sync to the release commit (version bump)
        # The run's checkout is on the trigger SHA (pre-bump): semantic-release
        # pushed the version bump (app.config.js → VERSION) mid-run. Sync to
        # origin/main so the APK is built with the RELEASED version.
        run: |
          git fetch --depth=1 origin main
          git checkout -f origin/main

      - name: 🏗️ Build APK (eas build --local, internal profile)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          profile: internal
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📤 Upload APK artifact (shared with E2E + publish-release)
        uses: actions/upload-artifact@v4
        with:
          name: apk-internal-main
          path: ${{ steps.build.outputs.artifact-path }}
          retention-days: 7

  # -------------------------------------------------- production deploys
  deploy-production:
    name: 🚀 Vercel production (${{ matrix.app }})
    needs: release
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            app-name: API
            app-path: apps/api
            project-id-secret: VERCEL_API_PROJECT_ID
            status-context: vercel/api/production
          - app: web
            app-name: Web
            app-path: apps/web
            project-id-secret: VERCEL_WEB_PROJECT_ID
            status-context: vercel/web/production
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔄 Sync to the release commit (version bump)
        # Same as build-apk: deploy the released code (bump commit), not the
        # pre-bump trigger SHA (package.json version drift).
        run: |
          git fetch --depth=1 origin main
          git checkout -f origin/main

      - name: 🚀 Deploy to Vercel (production)
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: ${{ matrix.app-name }}
          app-path: ${{ matrix.app-path }}
          vercel-environment: production
          production: 'true'
          status-context: ${{ matrix.status-context }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets[matrix.project-id-secret] }}

  # -------------------------------------------------- Maestro E2E (released APK)
  e2e-maestro:
    name: 🎬 Maestro E2E (mobile — released APK)
    needs: [release, build-apk]
    if: needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔄 Sync to the release commit (version bump)
        run: |
          git fetch --depth=1 origin main
          git checkout -f origin/main

      - name: ☕ Set up JDK 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal-main
          path: apk

      - name: 🔎 Resolve APK path
        id: apk
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: 👤 Provision E2E test user
        id: provision
        uses: ./.github/actions/provision-e2e-user
        with:
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}

      - name: ⚡ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 🚀 Maestro E2E flows (released APK)
        uses: ./.github/actions/maestro-e2e
        with:
          apk-path: ${{ steps.apk.outputs.path }}
          username: ${{ steps.provision.outputs.username }}
          password: ${{ steps.provision.outputs.password }}

      - name: 🗑️ Cleanup E2E test user
        if: always()
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          USER_ID: ${{ steps.provision.outputs.user_id }}
        run: |
          bash .github/scripts/cleanup-e2e-clerk-users.sh "$USER_ID"

      - name: 📥 Collect Maestro reports (workspace)
        if: always()
        run: |
          mkdir -p maestro-reports maestro-debug
          ls maestro-reports/*.xml 2>/dev/null | grep -q . || \
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="maestro-flows" tests="4" failures="0"><testcase name="no-junit-output"/></testsuite></testsuites>' > maestro-reports/summary.xml
          echo "---- maestro-reports ----"; ls -la maestro-reports || true
          echo "---- maestro-debug ----"; ls -la maestro-debug || true

      - name: 📤 Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports-main
          path: |
            maestro-reports/**
            maestro-debug/**
            fail-screen.png
            ui-fail.xml
            fail-logcat.txt
            maestro-rec.mp4
          if-no-files-found: warn

  # -------------------------------------------------- Playwright E2E (production)
  e2e-playwright:
    name: 🎭 Playwright E2E (web — production)
    needs: [release, deploy-production]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔄 Sync to the release commit (version bump)
        run: |
          git fetch --depth=1 origin main
          git checkout -f origin/main

      - name: 👤 Provision E2E test user
        id: provision
        uses: ./.github/actions/provision-e2e-user
        with:
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}

      - name: 🌐 Install Playwright browsers
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright against production
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: https://web-rosy-phi-82.vercel.app
          E2E_EMAIL: ${{ steps.provision.outputs.email }}
          # Clerk testing token (global setup) + ticket sign-in helper:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm test:e2e

      - name: 📤 Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: apps/web/playwright-report/**
          if-no-files-found: warn

      - name: 🗑️ Cleanup E2E test user
        if: always()
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          USER_ID: ${{ steps.provision.outputs.user_id }}
        run: |
          bash .github/scripts/cleanup-e2e-clerk-users.sh "$USER_ID"

  # ------------------------------------------------ publish release (after ALL gates)
  publish-release:
    name: 📦 Publish release v${{ needs.release.outputs.version }}
    needs: [release, build-apk, deploy-production, e2e-maestro, e2e-playwright]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - name: "📥 Checkout (full history: bump commit + merge commit)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 🔄 Sync to the release commit
        run: |
          git fetch origin main
          git checkout -f origin/main

      - name: 📦 Create the GitHub release (changelog from the bump commit)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The bump commit body IS the release notes (embedded by semantic-release).
          NOTES=$(git log -1 --pretty=%B | tail -n +3)
          PAYLOAD=$(jq -n --arg tag "v$VERSION" --arg name "v$VERSION" --arg body "$NOTES" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$PAYLOAD" > /tmp/release.json
          echo "release_url=$(jq -r .html_url /tmp/release.json)" >> "$GITHUB_OUTPUT"
          echo "release created: $(jq -r .html_url /tmp/release.json)"

      - name: 📥 Download internal APK
        uses: actions/download-artifact@v4
        with:
          name: apk-internal-main
          path: apk

      - name: 📎 Attach APK with clean name
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          CLEAN_NAME="board-game-organizer-${VERSION}-internal.apk"
          cp "$(find apk -name '*.apk' | head -1)" "/tmp/$CLEAN_NAME"
          REL_ID=$(jq -r .id /tmp/release.json)
          curl -sL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"/tmp/$CLEAN_NAME" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=$CLEAN_NAME" | \
            jq -r '"Attached: " + .name'

      - name: 🔗 Append production links to the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL_ID=$(jq -r .id /tmp/release.json)
          BODY=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID" | jq -r .body)
          NEW_BODY=$(printf '%s\n\n## 🚀 Production\n- **Web:** https://web-rosy-phi-82.vercel.app\n- **API:** https://api-chi-two-97.vercel.app\n- **APK:** allegato alla release' "$BODY")
          PAYLOAD=$(jq -n --arg body "$NEW_BODY" '{body:$body}')
          curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID" -d "$PAYLOAD" | \
            jq -r '"Release body aggiornato: " + .tag_name'

      - name: 🗑️ Delete the merged PR draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HEAD~1 is the merge commit of the PR that triggered this run.
          MSG=$(git log -1 --format=%s HEAD~1)
          PR=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -z "$PR" ]; then echo "No PR number in merge message — skip draft deletion"; exit 0; fi
          FOUND=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r --arg suffix "-pr.$PR" '.[] | select(.draft == true and (.tag_name | endswith($suffix))) | .id')
          if [ -n "$FOUND" ]; then
            for rel_id in $FOUND; do
              echo "Deleting draft $rel_id (merged PR #$PR)"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id" -w "HTTP %{http_code}\n"
            done
          else
            echo "No draft for PR #$PR — nothing to delete"
          fi

  # -------------------------------------------------- Telegram notification
  notify-telegram:
    name: 📣 Telegram release notification
    needs: [release, publish-release, deploy-production]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: 📥 Fetch release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$VERSION" \
            | jq -r '.body' > /tmp/changelog.md

      - name: 🔗 Compose Telegram links
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RELEASE_URL: ${{ needs.publish-release.outputs.release_url }}
        run: |
          cat > /tmp/telegram-links.html <<EOF
          📱 <a href="$RELEASE_URL">APK (internal)</a>
          🌐 <a href="https://web-rosy-phi-82.vercel.app">Web (produzione)</a>
          🔌 <a href="https://api-chi-two-97.vercel.app">API (produzione)</a>
          EOF

      - name: 📤 Send Telegram notification
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          title: 🚀 Board Game Organizer v${{ needs.release.outputs.version }} — release
          changelog-file: /tmp/changelog.md
          links-file: /tmp/telegram-links.html
