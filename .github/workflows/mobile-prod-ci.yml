name: Mobile Production CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: mobile-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: 🔍 Conventional Commits
    uses: ./.github/workflows/reusable-conventional-commits.yml

  test:
    name: 🧪 Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      project-name: mobile

  eas-build:
    name: 🏗️ EAS Build Production
    runs-on: ubuntu-latest
    needs: [conventional-commits, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup EAS & Build
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          command: eas build --platform android --profile production --non-interactive