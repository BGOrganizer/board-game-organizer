name: 🎬 Maestro E2E Tests (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/mobile/.maestro/**
      - .github/actions/android-emulator/**
      - .github/workflows/maestro.yml

permissions:
  contents: read

jobs:
  maestro:
    name: 🎬 Maestro E2E on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm

      - name: ☕ Set up JDK 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🔗 Resolve latest internal APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
            jq -r '[.[] | .assets[] | select(.name | contains("internal"))][0].url')
          echo "Resolved APK asset URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 📦 Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.apk "${{ steps.apk.outputs.url }}"
          ls -lh app.apk

      - name: 👤 Provision E2E test user
        id: provision
        uses: ./.github/actions/provision-e2e-user
        with:
          clerk-secret-key: ${{ secrets.CLERK_SECRET_KEY }}

      - name: ⚡ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 🚀 Maestro E2E flows
        uses: ./.github/actions/maestro-e2e
        with:
          apk-path: app.apk
          username: ${{ steps.provision.outputs.username }}
          password: ${{ steps.provision.outputs.password }}

      - name: 🗑️ Cleanup E2E test user
        if: always()
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          USER_ID: ${{ steps.provision.outputs.user_id }}
        run: |
          bash .github/scripts/cleanup-e2e-clerk-users.sh "$USER_ID"

      - name: 📤 Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            /tmp/maestro-reports/**
            /tmp/maestro-debug/**
            /tmp/emulator.log
            /tmp/prewarm-screen.png
            /tmp/ui-pre.xml
            /tmp/fail-screen.png
            /tmp/ui-fail.xml
            /tmp/fail-logcat.txt
          if-no-files-found: warn
