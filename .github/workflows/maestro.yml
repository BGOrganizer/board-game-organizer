name: 🎬 Maestro E2E Tests (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/mobile/.maestro/**
      - .github/actions/android-emulator/**
      - .github/workflows/maestro.yml

permissions:
  contents: read

jobs:
  maestro:
    name: 🎬 Maestro E2E on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Maestro requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🔗 Resolve latest internal APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
            jq -r '[.[] | .assets[] | select(.name | contains("internal"))][0].url')
          echo "Resolved APK asset URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 📦 Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.apk "${{ steps.apk.outputs.url }}"
          ls -lh app.apk

      - name: 👤 Provision Maestro test user (Clerk API)
        id: provision
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          TS=$(date +%s)
          USERNAME="e2e_$TS"
          EMAIL="e2e.$TS@gmail.com"
          PASSWORD="E2eTestPass!2026"
          STATUS=$(curl -s -o /tmp/clerk-user.json -w "%{http_code}" \
            -X POST "https://api.clerk.com/v1/users" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$USERNAME\",\"email_address\":[\"$EMAIL\"],\"password\":\"$PASSWORD\",\"first_name\":\"E2E Test\",\"public_metadata\":{\"e2e\":true}}")
          echo "Clerk create user → HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "409" ]; then
            cat /tmp/clerk-user.json; exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: ⚡ Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: 🚀 Boot emulator & run Maestro flows
        uses: ./.github/actions/android-emulator
        with:
          script: |
            set +e
            export PATH="$ANDROID_HOME/platform-tools:$HOME/.maestro/bin:$PATH"
            # Software-rendered emulators are slow: give the Maestro driver time to start
            export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            export MAESTRO_CLI_NO_ANALYTICS=1
            adb install -r app.apk || { sleep 30; adb install -r app.apk; }
            adb shell pm clear com.bgo.mobile || true   # fresh state: no session
            # Pre-warm the app (first cold start on a software emulator is very slow)
            adb shell am start -n com.bgo.mobile/.MainActivity || true
            sleep 60
            # Diagnostics: what does the app actually show after pre-warm?
            adb exec-out screencap -p > /tmp/prewarm-screen.png || true
            adb shell uiautomator dump /sdcard/ui-pre.xml > /dev/null 2>&1 && adb pull /sdcard/ui-pre.xml /tmp/ui-pre.xml > /dev/null 2>&1 || true
            adb shell am force-stop com.bgo.mobile || true
            set -e
            maestro test --format junit --output /tmp/maestro-reports \
              --debug-output /tmp/maestro-debug \
              apps/mobile/.maestro/flows/01-launch-welcome.yaml \
              || { echo "=== FLOW 01 FAILED — capture diagnostics ==="; adb exec-out screencap -p > /tmp/fail-screen.png || true; adb shell uiautomator dump /sdcard/ui-fail.xml > /dev/null 2>&1 && adb pull /sdcard/ui-fail.xml /tmp/ui-fail.xml > /dev/null 2>&1 || true; exit 1; }
            maestro test --format junit --output /tmp/maestro-reports \
              --debug-output /tmp/maestro-debug \
              -e USERNAME=${{ steps.provision.outputs.username }} \
              -e PASSWORD=${{ steps.provision.outputs.password }} \
              apps/mobile/.maestro/flows/02-login.yaml
            maestro test --format junit --output /tmp/maestro-reports \
              --debug-output /tmp/maestro-debug \
              -e USERNAME=${{ steps.provision.outputs.username }} \
              apps/mobile/.maestro/flows/03-profile-logout.yaml
            # Dark mode: switch the emulator to dark, relaunch and verify the UI still renders
            adb shell cmd uimode night yes || true
            maestro test --format junit --output /tmp/maestro-reports \
              apps/mobile/.maestro/flows/04-dark-mode.yaml

      - name: 📤 Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            /tmp/maestro-reports/**
            /tmp/maestro-debug/**
            /tmp/emulator.log
            /tmp/prewarm-screen.png
            /tmp/ui-pre.xml
            /tmp/fail-screen.png
            /tmp/ui-fail.xml
          if-no-files-found: warn
