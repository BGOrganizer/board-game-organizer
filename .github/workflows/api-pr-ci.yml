name: API PR CI/CD

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'

concurrency:
  group: api-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: 🔍 Conventional Commits
    uses: ./.github/workflows/reusable-conventional-commits.yml

  test:
    name: 🧪 Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      project-name: api

  vercel-preview:
    name: 🚀 Vercel Preview
    runs-on: ubuntu-latest
    needs: [conventional-commits, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel (Preview)
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: 📝 Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.preview-url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **API Preview Deployed**\n\n🔗 **Preview URL:** ${url}\n\n_Triggered by PR #${context.issue.number}_`
            });