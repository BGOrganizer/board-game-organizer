name: 📱 Mobile APK (local EAS builds)

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - .github/actions/mobile-build/**
      - .github/actions/setup-pnpm/**
      - .github/actions/conventional-commits/**
      - .github/actions/test/**
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 🔍 Conventional Commits & Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the conventional commits check

      - uses: ./.github/actions/conventional-commits

      - uses: ./.github/actions/test
        with:
          project-name: mobile

  build:
    name: 🏗️ Build APK (${{ matrix.profile }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false # one profile failing shouldn't cancel the other
      matrix:
        profile: [development, internal]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build APK (eas build --local)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          profile: ${{ matrix.profile }}
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.profile }}
          path: ${{ steps.build.outputs.artifact-path }}
          retention-days: 7

  release:
    name: 📝 Draft GitHub Release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: 📥 Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: 🏷️ Resolve version & build number
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.config.js').expo.version")
          BUILD_NUMBER=$(ls apks/ | grep -oE '[0-9]{14}' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "APKs:"
          ls -lh apks/

      - name: 📝 Generate changelog
        shell: bash
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > changelog.md
          else
            git log --pretty=format:"- %s" -n 10 > changelog.md
          fi
          echo "Changelog:"
          cat changelog.md

      - name: 🚀 Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: board-game-organizer-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build-number }}
          name: board-game-organizer-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build-number }}
          files: apks/*.apk
          body_path: changelog.md
