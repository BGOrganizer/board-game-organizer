name: 📱 Mobile APK (local EAS builds)

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - .github/actions/mobile-build/**
      - .github/actions/setup-pnpm/**
      - .github/actions/conventional-commits/**
      - .github/actions/test/**
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  checks:
    name: 🔍 Conventional Commits & Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the conventional commits check

      - uses: ./.github/actions/conventional-commits

      - uses: ./.github/actions/test
        with:
          project-name: mobile

  build-and-release:
    name: 🏗️ Build APKs (development + internal) & Draft Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: 🏗️ Build APKs (eas build --local)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            ${{ steps.build.outputs.development-artifact-path }}
            ${{ steps.build.outputs.internal-artifact-path }}
          retention-days: 7

      - name: 📝 Generate changelog
        shell: bash
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > changelog.md
          else
            git log --pretty=format:"- %s" -n 10 > changelog.md
          fi
          echo "Changelog:"
          cat changelog.md

      - name: 🚀 Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: board-game-organizer-v${{ steps.build.outputs.version }}-${{ steps.build.outputs.build-number }}
          name: board-game-organizer-v${{ steps.build.outputs.version }}-${{ steps.build.outputs.build-number }}
          files: |
            ${{ steps.build.outputs.development-artifact-path }}
            ${{ steps.build.outputs.internal-artifact-path }}
          body_path: changelog.md
