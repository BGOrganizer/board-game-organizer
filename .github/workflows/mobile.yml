name: 📱 Mobile APK (local EAS builds)

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - .github/actions/mobile-build/**
      - .github/actions/setup-pnpm/**
      - .github/actions/conventional-commits/**
      - .github/actions/test/**
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 🔍 Conventional Commits & Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the conventional commits check

      - uses: ./.github/actions/conventional-commits

      - uses: ./.github/actions/test
        with:
          project-name: mobile

  # One job per build type: a single job building both APKs exhausts the
  # 14GB runner disk (Android SDK + Gradle caches + node_modules + 2 builds).
  build-development:
    name: 🏗️ Build Development APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.build.outputs.version }}
      build-number: ${{ steps.build.outputs.build-number }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build APK (eas build --local)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          build-type: development
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-development
          path: ${{ steps.build.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  build-internal:
    name: 🏗️ Build Internal APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build APK (eas build --local)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          build-type: internal
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-internal
          path: ${{ steps.build.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 🚀 Draft GitHub Release
    needs: [build-development, build-internal]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: 📦 Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 📝 Generate changelog
        shell: bash
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            git log "$LAST_TAG"..HEAD --pretty=format:"- %s" > changelog.md
          else
            git log --pretty=format:"- %s" -n 10 > changelog.md
          fi
          echo "Changelog:"
          cat changelog.md
          ls -lh dist/

      - name: 🚀 Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: board-game-organizer-v${{ needs.build-development.outputs.version }}-${{ needs.build-development.outputs.build-number }}
          name: board-game-organizer-v${{ needs.build-development.outputs.version }}-${{ needs.build-development.outputs.build-number }}
          files: dist/*
          body_path: changelog.md
