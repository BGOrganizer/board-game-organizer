name: 🤖 Android Emulator Smoke Test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "API asset URL of the internal APK (default: latest internal from releases)"
        required: false

permissions:
  contents: read

jobs:
  emulator-test:
    name: 📱 Run app on emulator & capture diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔗 Resolve latest internal APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "url=${{ inputs.apk_url }}" >> "$GITHUB_OUTPUT"
          else
            URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
              jq -r '[.[] | .assets[] | select(.name | contains("internal"))][0].url')
            echo "Resolved APK asset URL: $URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.apk "${{ steps.apk.outputs.url }}"
          ls -lh app.apk

      - name: 🚀 Boot emulator & run the app
        uses: ./.github/actions/android-emulator
        with:
          script: |
            set +e
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            adb install -r app.apk || { sleep 30; adb install -r app.apk; }
            adb shell am start -n com.bgo.mobile/.MainActivity
            for s in 20 50 90; do
              sleep $s
              adb exec-out screencap -p > /tmp/screen-$s.png
            done
            adb logcat -d > /tmp/logcat-full.txt
            adb logcat -d | grep -E "ReactNativeJS|AndroidRuntime|FATAL|Sentry|Exception|bgo" > /tmp/logcat-errors.txt || true
            adb shell dumpsys activity activities | grep -iE "mResumedActivity|topResumedActivity" | head -3 > /tmp/activity.txt || true
            echo "--- resumed activity ---"
            cat /tmp/activity.txt

      - name: 📤 Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diag
          path: |
            /tmp/screen-*.png
            /tmp/logcat-full.txt
            /tmp/logcat-errors.txt
            /tmp/activity.txt
            /tmp/emulator.log
          if-no-files-found: warn
