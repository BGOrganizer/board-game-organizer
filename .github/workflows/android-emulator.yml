name: 🤖 Android Emulator Smoke Test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "API asset URL of the internal APK (default: latest internal from releases)"
        required: false

permissions:
  contents: read

jobs:
  emulator-test:
    name: 📱 Run app on emulator & capture diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔗 Resolve latest internal APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "url=${{ inputs.apk_url }}" >> "$GITHUB_OUTPUT"
          else
            URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
              jq -r '[.[] | .assets[] | select(.name | contains("internal"))][0].url')
            echo "Resolved APK asset URL: $URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.apk "${{ steps.apk.outputs.url }}"
          ls -lh app.apk

      - name: 🚀 Boot emulator & run the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 2048
          emulator-boot-timeout: 900
          script: |
            adb install -r app.apk
            adb shell input keyevent 82 || true
            adb logcat -c
            adb shell am start -n com.bgo.mobile/.MainActivity
            sleep 20
            adb exec-out screencap -p > /tmp/screen-1.png || true
            sleep 30
            adb exec-out screencap -p > /tmp/screen-2.png || true
            adb logcat -d > /tmp/logcat-full.txt || true
            adb logcat -d | grep -E "ReactNativeJS|AndroidRuntime|FATAL|Sentry|hermes|bgo|Exception" > /tmp/logcat-errors.txt || true
            echo "--- resumed activity ---"
            adb shell dumpsys activity activities | grep -iE "mResumedActivity|topResumedActivity" | head -3 || true

      - name: 📤 Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diag
          path: |
            /tmp/screen-1.png
            /tmp/screen-2.png
            /tmp/logcat-full.txt
            /tmp/logcat-errors.txt
          if-no-files-found: warn
