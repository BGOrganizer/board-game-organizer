name: 🤖 Android Emulator Smoke Test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "API asset URL of the internal APK (default: latest internal from releases)"
        required: false

permissions:
  contents: read

jobs:
  emulator-test:
    name: 📱 Run app on emulator & capture diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔗 Resolve latest internal APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "url=${{ inputs.apk_url }}" >> "$GITHUB_OUTPUT"
          else
            URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=5" | \
              jq -r '[.[] | .assets[] | select(.name | contains("internal"))][0].url')
            echo "Resolved APK asset URL: $URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o app.apk "${{ steps.apk.outputs.url }}"
          ls -lh app.apk

      - name: 🛠️ Install SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "emulator" > /dev/null
          "$SDKMGR" "system-images;android-34;default;x86_64" > /dev/null
          ls "$ANDROID_HOME/system-images/android-34" 2>/dev/null || true

      - name: 🚀 Boot emulator & run the app
        run: |
          set +e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$HOME/.android/avd"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo no | avdmanager create avd --force -n test \
            --package "system-images;android-34;default;x86_64" --device pixel_6 \
            2>&1 | tee /tmp/avd-create.log
          echo "--- avd list ---"
          avdmanager list avd
          echo "--- avd dir ---"
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/test.ini" || { echo "AVD FILE MISSING"; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -avd test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 2048 -cores 4 -accel off \
            -port 5554 > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          timeout 300 adb wait-for-device || { echo "NO DEVICE"; tail -20 /tmp/emulator.log; exit 1; }
          BOOTED=0
          for i in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=1; echo "booted after ~$((i*10))s"; break
            fi
            sleep 10
          done
          if [ "$BOOTED" != "1" ]; then
            echo "EMULATOR FAILED TO BOOT"; tail -30 /tmp/emulator.log; exit 1
          fi
          sleep 45 # let the input service settle before interacting
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0.0
          adb shell settings put global transition_animation_scale 0.0
          adb shell settings put global animator_duration_scale 0.0
          adb logcat -c
          adb install -r app.apk || { sleep 30; adb install -r app.apk; }
          adb shell am start -n com.bgo.mobile/.MainActivity
          for s in 20 50 90; do
            sleep $s
            adb exec-out screencap -p > /tmp/screen-$s.png
          done
          adb logcat -d > /tmp/logcat-full.txt
          adb logcat -d | grep -E "ReactNativeJS|AndroidRuntime|FATAL|Sentry|Exception|bgo" > /tmp/logcat-errors.txt
          adb shell dumpsys activity activities | grep -iE "mResumedActivity|topResumedActivity" | head -3 > /tmp/activity.txt
          echo "--- resumed activity ---"
          cat /tmp/activity.txt
          kill $EMU_PID 2>/dev/null
          exit 0

      - name: 📤 Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diag
          path: |
            /tmp/screen-*.png
            /tmp/logcat-full.txt
            /tmp/logcat-errors.txt
            /tmp/activity.txt
            /tmp/emulator.log
          if-no-files-found: warn
