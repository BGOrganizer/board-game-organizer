name: 📱 Mobile APK (development — manual, main only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-development:
    name: 📱 Build development APK & attach to latest release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Development builds are only allowed from main, manually.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build APK (eas build --local, development profile)
        id: build
        uses: ./.github/actions/mobile-build
        with:
          profile: development
          expo-token: ${{ secrets.EXPO_TOKEN }}
          clerk-publishable-key: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          api-url: ${{ vars.EXPO_PUBLIC_API_URL }}
          sentry-dsn: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}

      - name: 📦 Attach development APK to latest release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact-path }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact-name }}
        run: |
          REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=1" | \
            jq -r '.[0].id')
          echo "Uploading to release id: $REL"
          curl -sL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$ARTIFACT_PATH" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL/assets?name=$ARTIFACT_NAME" | \
            jq -r '"Attached: " + .name'
