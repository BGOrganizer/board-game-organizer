name: PR CI fail-fast watchdog

# Always executes trusted default-branch code. Keep name compatibility during rollout.
on:
  workflow_run:
    workflows: ["🚦 PR CI/CD (quality gates → draft prerelease + Telegram)"]
    types: [in_progress]
permissions:
  actions: write
  contents: read
jobs:
  cancel-failed-run:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 📥 Checkout trusted watchdog code
        uses: actions/checkout@v4
      - name: 🟢 Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Cancel only after a shared quality failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/scripts/ci-fail-fast.mjs
