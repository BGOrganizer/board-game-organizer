name: 🌐 Web CI/CD

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
  pull_request:
    paths:
      - apps/web/**
      - packages/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: 🔍 Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/conventional-commits

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/test
        with:
          project-name: web

  vercel-preview:
    name: 🚀 Vercel Preview
    needs: [conventional-commits, test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Web
          app-path: apps/web
          vercel-environment: preview
          production: 'false'
          status-context: vercel/web/preview
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  vercel-production:
    name: 🚀 Vercel Production
    needs: [conventional-commits, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        uses: ./.github/actions/vercel-deploy
        with:
          app-name: Web
          app-path: apps/web
          vercel-environment: production
          production: 'true'
          status-context: vercel/web/production
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
