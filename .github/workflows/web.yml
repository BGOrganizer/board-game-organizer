name: 🌐 Web CI/CD

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
  pull_request:
    paths:
      - apps/web/**
      - packages/**
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: 🔍 Conventional Commits
    uses: ./.github/workflows/reusable-conventional-commits.yml

  test:
    name: 🧪 Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      project-name: web

  vercel-preview:
    name: 🚀 Vercel Preview
    needs: [conventional-commits, test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' 
    uses: ./.github/workflows/reusable-vercel-deploy.yml
    with:
      app-name: Web
      app-path: apps/web
      vercel-environment: preview
      github-environment: development
      production: false
      status-context: vercel/web/preview
    secrets:
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  vercel-production:
    name: 🚀 Vercel Production
    needs: [conventional-commits, test]
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable-vercel-deploy.yml
    with:
      app-name: Web
      app-path: apps/web
      vercel-environment: production
      github-environment: production
      production: true
      status-context: vercel/web/production
    secrets:
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
