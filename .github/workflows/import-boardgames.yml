name: Import BoardGames (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target API/Clerk environment
        required: true
        type: choice
        default: preview
        options: [preview, production]
      api-url:
        description: Immutable non-CI API Preview URL; leave empty for the fixed Production API
        required: false
        type: string
      csv-url:
        description: HTTPS direct URL of the full boardgames_ranks.csv (POST or GET)
        required: true
        type: string
      skip-chunks:
        description: Skip first N chunks from this same CSV/target (resume; 0 for full import)
        required: false
        type: string
        default: '0'
      end-chunks:
        description: Stop after N chunks (exclusive chunk bound; empty means all)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bgg-import-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'production' || 'development' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'
      - name: 🔒 Verify selected target before forwarding application credentials
        env:
          TARGET: ${{ inputs.target }}
          API_URL: ${{ inputs['api-url'] }}
          CSV_URL: ${{ inputs['csv-url'] }}
          CLERK_SECRET_KEY: ${{ secrets[inputs.target == 'production' && 'CLERK_SECRET_KEY_PRODUCTION' || 'CLERK_SECRET_KEY'] }}
          BYPASS: ${{ inputs.target == 'preview' && secrets.VERCEL_PROTECTION_BYPASS || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { manualApiTarget, requireClerkTarget, verifyPreviewProject, attestManualApi } from './.github/scripts/manual-target.mjs';
          const e = process.env;
          const csv = new URL(e.CSV_URL);
          if (csv.protocol !== 'https:' || csv.username || csv.password || csv.hash) throw new Error('Public HTTPS CSV URL required');
          const api = manualApiTarget(e.TARGET, e.API_URL);
          requireClerkTarget(e.TARGET, e.CLERK_SECRET_KEY, 'sk');
          if (e.TARGET === 'preview') await verifyPreviewProject(api, { token: e.VERCEL_TOKEN, team: e.VERCEL_ORG_ID, project: e.VERCEL_API_PROJECT_ID });
          await attestManualApi(e.TARGET, api, e.CLERK_SECRET_KEY, e.BYPASS);
          const endpoint = new URL('/api/admin/import-games', api);
          appendFileSync(e.GITHUB_ENV, `BGG_IMPORT_URL=${endpoint.href}\n`);
          NODE
      - name: ⬇️ Download full CSV dump
        env:
          CSV_URL: ${{ inputs['csv-url'] }}
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' -X POST "$CSV_URL" -o /tmp/ranks.csv || \
            curl -fsSL --proto '=https' --proto-redir '=https' "$CSV_URL" -o /tmp/ranks.csv
          test -s /tmp/ranks.csv
          # The shared parser validates all 16 columns, BOM, quoted/reordered headers and every row
          # before the import script's first request. Do not reject valid CSV with a '^id,' probe.
      - name: 🚚 Import through the shared CSV parser and repository contract
        env:
          BGG_CSV: /tmp/ranks.csv
          BGG_IMPORT_TOKEN: ${{ secrets[inputs.target == 'production' && 'CLERK_SECRET_KEY_PRODUCTION' || 'CLERK_SECRET_KEY'] }}
          BGG_BYPASS: ${{ inputs.target == 'preview' && secrets.VERCEL_PROTECTION_BYPASS || '' }}
          BGG_CHUNK: '500'
          BGG_SKIP_CHUNKS: ${{ inputs['skip-chunks'] }}
          BGG_END_CHUNKS: ${{ inputs['end-chunks'] }}
        run: node apps/api/scripts/import-boardgames.mjs
