name: Import BoardGames (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment (selects matching Clerk secret)
        required: true
        type: choice
        options:
          - preview
          - production
      api-url:
        description: Base URL of target API
        required: true
        type: string
      csv-url:
        description: Direct URL of boardgames_ranks.csv (POST or GET)
        required: true
        type: string
      skip-chunks:
        description: Skip first N chunks (resume; 0 for full import)
        required: false
        type: string
        default: "0"
      end-chunks:
        description: Stop after N chunks (empty means all)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup workspace
        uses: ./.github/actions/setup-pnpm
        with:
          install: "false"

      - name: ⬇️ Download CSV dump
        env:
          CSV_URL: ${{ inputs['csv-url'] }}
        shell: bash
        run: |
          curl -fsSL -X POST "$CSV_URL" -o /tmp/ranks.csv || curl -fsSL "$CSV_URL" -o /tmp/ranks.csv
          if ! head -c 20 /tmp/ranks.csv | grep -q '^id,'; then
            echo "Downloaded content is not a BGG CSV."
            exit 1
          fi
          wc -l /tmp/ranks.csv

      - name: 🚚 Import into target API
        env:
          TARGET: ${{ inputs.target }}
          API_URL: ${{ inputs['api-url'] }}
          BGG_CSV: /tmp/ranks.csv
          BGG_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          BGG_IMPORT_TOKEN: ${{ inputs.target == 'production' && secrets.CLERK_SECRET_KEY_PRODUCTION || secrets.CLERK_SECRET_KEY }}
          BGG_CHUNK: "500"
          BGG_SKIP_CHUNKS: ${{ inputs['skip-chunks'] }}
          BGG_END_CHUNKS: ${{ inputs['end-chunks'] }}
        shell: bash
        run: |
          if [[ "$TARGET" == production && "$API_URL" != "https://api.board-game-organizer.com" ]] || \
             [[ "$TARGET" == preview && "$API_URL" != https://*.vercel.app ]]; then
            echo "API URL does not match target environment."
            exit 1
          fi
          export BGG_IMPORT_URL="${API_URL%/}/api/admin/import-games?x-vercel-protection-bypass=$BGG_BYPASS"
          node apps/api/scripts/import-boardgames.mjs
