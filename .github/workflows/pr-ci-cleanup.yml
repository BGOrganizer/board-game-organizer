name: PR CI cancellation cleanup

on:
  workflow_run:
    workflows: ["🚦 PR CI/CD (quality gates → draft prerelease + Telegram)"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # workflow_run executes trusted default-branch code, never the PR checkout.
      - name: 📥 Checkout trusted cleanup code
        uses: actions/checkout@v4
      - name: 🗑️ Remove only this run's CI users and database
        env:
          GH_TOKEN: ${{ github.token }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash .github/scripts/cleanup-pr-e2e.sh "$RUN_ID" "$RUN_ATTEMPT"
