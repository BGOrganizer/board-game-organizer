packages:
  - "apps/*"
  - "packages/*"

nodeLinker: hoisted

overrides:
  react: "19.2.3"
  react-dom: "19.2.3"
  utf-8-validate: "5.0.10"

peerDependencyRules:
  allowedVersions:
    "@gorhom/bottom-sheet>react-native-reanimated": ">=3.16.0"

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - expo-notifications@57.0.19
