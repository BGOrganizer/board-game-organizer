packages:
  - "apps/*"
  - "packages/*"

overrides:
  utf-8-validate: "5.0.10"
  # Single @babel/core version across the monorepo: react-native 0.85 ships
  # @babel/core@8 but react-native-gesture-handler's worklets plugin requires
  # ^7 — pinning to 7.29.7 (the babel-preset-expo peer) makes the EAS local
  # bundle and the expo-doctor duplicate check pass.
  "@babel/core": "7.29.7"

peerDependencyRules:
  allowedVersions:
    "@gorhom/bottom-sheet>react-native-reanimated": ">=3.16.0"

allowBuilds:
  '@sentry/cli': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
  utf-8-validate: true
